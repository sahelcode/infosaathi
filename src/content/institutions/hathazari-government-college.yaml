about: ১৯৬৮ সালে হাটহাজারী উপজেলা সদরে কলেজটি প্রতিষ্ঠিত হয়। ২০১৭ সালে কলেজটি সরকারি হয়। এখানে উচ্চ মাধ্যমিক, ডিগ্রি (পাস) এবং ৫টি বিষয়ে অনার্স পড়ানো হয়।
faq:
  - q: হাটহাজারী সরকারি কলেজে অনার্সে কোন কোন বিষয় আছে?
    a: অনার্সে ৫টি বিষয় আছে — অর্থনীতি, রাষ্ট্রবিজ্ঞান, সমাজবিজ্ঞান, হিসাববিজ্ঞান ও ব্যবস্থাপনা।
  - q: কলেজের জাতীয় বিশ্ববিদ্যালয় কোড কত?
    a: জাতীয় বিশ্ববিদ্যালয়ে কলেজের কোড ৪৩১২।
  - q: হাটহাজারী কলেজ কবে সরকারি হয়?
    a: ২০১৭ সালে। কলেজটি প্রতিষ্ঠিত হয় ১৯৬৮ সালে।

