about: ১৯৫৬ সালের ১ জুলাই শহরের দক্ষিণ প্রান্তে ২০–২৫ জন শিক্ষার্থী নিয়ে ইন্টারমিডিয়েট কলেজ হিসেবে যাত্রা শুরু হয়; পরে ডিগ্রি কলেজ হয়। ১৯৮০ সালে কলেজটি সরকারি হয়। ১৯৯৯–২০০০ সালে অনার্স চালু হয়; এখন ১৪টি বিষয়ে অনার্স ও ৫টি বিষয়ে মাস্টার্স পড়ানো হয়। ক্যাম্পাস ১৮ একরের বেশি।
faq:
  - q: মৌলভীবাজার সরকারি কলেজ কবে সরকারি হয়?
    a: ১৯৮০ সালে। কলেজটি প্রতিষ্ঠিত হয় ১৯৫৬ সালে।
  - q: অনার্সে কয়টি বিষয় আছে?
    a: ১৪টি বিষয়ে অনার্স এবং ৫টি বিষয়ে মাস্টার্স পড়ানো হয়।
  - q: কলেজের জাতীয় বিশ্ববিদ্যালয় কোড কত?
    a: জাতীয় বিশ্ববিদ্যালয়ে কলেজের কোড ২০০১।
  - q: প্রিলিমিনারি মাস্টার্স কি আছে?
    a: হ্যাঁ। কলেজে প্রিলিমিনারি-টু-মাস্টার্সে ভর্তির নোটিশ দেওয়া হয়।
  - q: মৌলভীবাজার সরকারি কলেজ আর সরকারি মহিলা কলেজ কি একই?
    a: না। মৌলভীবাজার সরকারি কলেজের EIIN ১২৯৭৩০; সরকারি মহিলা কলেজ আলাদা প্রতিষ্ঠান।

