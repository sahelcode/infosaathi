about: ব্লু বার্ড হাই স্কুল অ্যান্ড কলেজ সিলেট শহরের মীরের ময়দানে অবস্থিত একটি বেসরকারি স্কুল অ্যান্ড কলেজ। এখানে প্রাক-প্রাথমিক ও নার্সারি থেকে উচ্চ মাধ্যমিক (একাদশ–দ্বাদশ শ্রেণি) পর্যন্ত পড়ানো হয়। প্রতিষ্ঠানের ওয়েবসাইট অনুযায়ী এখানে প্রায় ৪,২০০ শিক্ষার্থী ও ৯৮ জন শিক্ষক রয়েছেন।

