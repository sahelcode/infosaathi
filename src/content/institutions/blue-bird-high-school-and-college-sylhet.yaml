about: ব্লু বার্ড হাই স্কুল অ্যান্ড কলেজ ১৯৬১ সালে প্রতিষ্ঠিত। এটি সিলেট শহরের মীরের ময়দানে অবস্থিত একটি বেসরকারি এমপিওভুক্ত প্রতিষ্ঠান। এখানে নার্সারি থেকে দ্বাদশ শ্রেণি পর্যন্ত পড়ানো হয়।
faq:
  - q: ব্লু বার্ড স্কুলে কি ছেলে-মেয়ে একসাথে পড়ে?
    a: হ্যাঁ, এটি সহশিক্ষা প্রতিষ্ঠান। ছাত্র ও ছাত্রী দুজনেই ভর্তি হতে পারে।
  - q: নার্সারি ও প্রাক-প্রাথমিকে ভর্তি কীভাবে হয়?
    a: ভর্তি হয় বাছাই ও লটারির মাধ্যমে। গত বছর (২০২৬ শিক্ষাবর্ষ) লটারির ফল ডিসেম্বর ২০২৫-এ স্কুলের ওয়েবসাইটে দেওয়া হয়।
  - q: একাদশ শ্রেণিতে ভর্তির নোটিশ কোথায় পাব?
    a: স্কুলের ওয়েবসাইটের নোটিশ পাতায় পাবেন। ২০২৬–২৭ শিক্ষাবর্ষের নোটিশ দেওয়া হয় ১৭ সেপ্টেম্বর ২০২৬।
  - q: প্রতিষ্ঠানটি কি এমপিওভুক্ত?
    a: হ্যাঁ, এটি এমপিওভুক্ত বেসরকারি প্রতিষ্ঠান।

