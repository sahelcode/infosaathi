about: ১৯৭৯ সালে বগুড়ার মাজহিরা সেনানিবাসে প্রতিষ্ঠানটি প্রতিষ্ঠিত হয়। এটি বাংলাদেশ সেনাবাহিনী পরিচালিত; ১১ পদাতিক ডিভিশনের জিওসি ও বগুড়া এরিয়া কমান্ডার এর প্রধান পৃষ্ঠপোষক। এখানে নার্সারি থেকে দ্বাদশ শ্রেণি পর্যন্ত বাংলা ও ইংরেজি ভার্সনে পড়ানো হয়।
faq:
  - q: বগুড়া ক্যান্টনমেন্ট পাবলিক স্কুল অ্যান্ড কলেজ কারা পরিচালনা করে?
    a: বাংলাদেশ সেনাবাহিনী। ১১ পদাতিক ডিভিশনের জিওসি ও বগুড়া এরিয়া কমান্ডার এর প্রধান পৃষ্ঠপোষক।
  - q: এখানে কি ইংরেজি ভার্সন আছে?
    a: হ্যাঁ। বাংলা ও ইংরেজি দুই ভার্সনেই ভর্তি নেওয়া হয়।
  - q: বগুড়া ক্যান্টনমেন্ট পাবলিক স্কুলের এসএসসি ২০২৫ ফলাফল কেমন?
    a: এসএসসি ২০২৫-এ ৩৭১ জন পরীক্ষার্থীর সবাই পাস করেছে, জিপিএ-৫ পেয়েছে ৩৪২ জন।
  - q: অফিস কখন খোলা থাকে?
    a: সকাল ৮টা থেকে বিকেল ৩টা পর্যন্ত।

