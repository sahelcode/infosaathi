about: ১৯৫৮ সালে স্থানীয় মানুষ ও রাজশাহী প্রশাসনের উদ্যোগে কলেজটি প্রতিষ্ঠিত হয়; শুরুতে নিজস্ব জমি না থাকায় লোকনাথ হাই স্কুলে ক্লাস হতো। ১৯৮২ সালে কলেজটি সরকারি হয়। এখানে উচ্চ মাধ্যমিক, ডিগ্রি (পাস), অনার্স ও মাস্টার্স পড়ানো হয়; কলেজে কলা, সামাজিক বিজ্ঞান, ব্যবসায় শিক্ষা ও বিজ্ঞান অনুষদের ১৫টি বিভাগ আছে।
faq:
  - q: রাজশাহী সরকারি সিটি কলেজ কবে সরকারি হয়?
    a: ১৯৮২ সালে। কলেজটি প্রতিষ্ঠিত হয় ১৯৫৮ সালে।
  - q: রাজশাহী সরকারি সিটি কলেজে কয়টি বিভাগ আছে?
    a: কলেজে ১৫টি বিভাগ আছে — বাংলা, ইংরেজি, ইতিহাস, দর্শন, ইসলামের ইতিহাস ও সংস্কৃতি, মনোবিজ্ঞান, অর্থনীতি, রাষ্ট্রবিজ্ঞান, হিসাববিজ্ঞান, ব্যবস্থাপনা, পদার্থবিজ্ঞান, রসায়ন, উদ্ভিদবিজ্ঞান, গণিত ও প্রাণিবিজ্ঞান।

