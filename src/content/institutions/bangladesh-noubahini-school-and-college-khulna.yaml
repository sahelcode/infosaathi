about: বাংলাদেশ নৌবাহিনী স্কুল ও কলেজ, খুলনা ১৯৭৯ সালে প্রতিষ্ঠিত। এটি বাংলাদেশ নৌবাহিনী পরিচালিত একটি স্কুল ও কলেজ। ক্যাম্পাস খালিশপুরের গোয়ালখালীতে, নৌবাহিনীর আবাসিক এলাকায়। এখানে ১ম থেকে দ্বাদশ শ্রেণি পর্যন্ত বাংলা মাধ্যমে পড়ানো হয়।
faq:
  - q: বাংলাদেশ নৌবাহিনী স্কুল ও কলেজ, খুলনায় কোন শ্রেণিতে ভর্তি নেওয়া হয়?
    a: ১ম থেকে ৯ম শ্রেণি এবং একাদশ শ্রেণিতে ভর্তি নেওয়া হয়। ২০২৭ শিক্ষাবর্ষের ১ম–৯ম শ্রেণির ভর্তি বিজ্ঞপ্তি অফিসিয়াল ওয়েবসাইটে দেওয়া আছে।
  - q: একাদশ শ্রেণিতে আবেদন করতে এসএসসিতে কত জিপিএ লাগে?
    a: বিজ্ঞানে জিপিএ ৪.৫০ লাগে। এই প্রতিষ্ঠানের নিজের শিক্ষার্থীদের জন্য বিজ্ঞানে ৪.০০। ব্যবসায় শিক্ষায় ৩.০০ এবং মানবিকে ২.৫০ লাগে। এটি ২০২৬–২০২৭ সেশনের অফিসিয়াল ভর্তি পাতার তথ্য।
  - q: একাদশ শ্রেণিতে আবেদন কোথায় করতে হয়?
    a: আবেদন করতে হয় xiclassadmission.gov.bd ওয়েবসাইটে। কলেজে এসেও অনলাইনে আবেদন করা যায়।
  - q: এসএসসিতে গোল্ডেন এ+ পেলে কি বেতন লাগে?
    a: না। গোল্ডেন এ+ পাওয়া শিক্ষার্থীরা একাদশ শ্রেণিতে বিনা বেতনে পড়তে পারে।
  - q: প্রতিষ্ঠানের ফি কীভাবে দেওয়া যায়?
    a: বিকাশ বা রকেটে ফি দেওয়া যায়।

