about: বাংলাদেশ নৌবাহিনী স্কুল ও কলেজ, খুলনা ১৯৭৯ সালে বাংলাদেশ নৌবাহিনীর তত্ত্বাবধানে প্রতিষ্ঠিত এবং নৌবাহিনী পরিচালিত একটি শিক্ষাপ্রতিষ্ঠান। শুরুতে নৌবাহিনীর সদস্যদের সন্তানদের জন্য হলেও পরে বেসামরিক শিক্ষার্থীদের জন্যও ভর্তি উন্মুক্ত করা হয়। এখানে প্রাথমিক থেকে উচ্চ মাধ্যমিক পর্যন্ত বিজ্ঞান, ব্যবসায় শিক্ষা ও মানবিক বিভাগে পড়ানো হয়।

