about: ১৯৬৪ সালের ৬ নভেম্বর ভিত্তিপ্রস্তর স্থাপনের পর ১৯৬৬ সালের ১১ ফেব্রুয়ারি "আইয়ুব ক্যাডেট কলেজ" নামে যাত্রা শুরু করে। স্বাধীনতার পর নাম হয় রাজশাহী ক্যাডেট কলেজ। ক্যাম্পাস পদ্মার তীরে, রাজশাহী শহর থেকে প্রায় ২৫ কিলোমিটার দূরে, আয়তন ১১০ একর। ক্যাডেটদের জন্য তিনটি হাউস আছে — খালিদ, কাসিম ও তারিক।
faq:
  - q: রাজশাহী ক্যাডেট কলেজে ভর্তির আবেদন কবে?
    a: ২০২৭ শিক্ষাবর্ষে সপ্তম শ্রেণিতে অনলাইন আবেদন চলবে ১ নভেম্বর থেকে ৫ ডিসেম্বর ২০২৬ পর্যন্ত। আবেদন করতে হয় cadetcollege.army.mil.bd-তে।
  - q: ক্যাডেট কলেজে ভর্তির যোগ্যতা কী?
    a: ষষ্ঠ শ্রেণি বা সমমান পাস হতে হবে। ১ জানুয়ারি ২০২৭-এ বয়স সর্বোচ্চ ১৩ বছর ৬ মাস এবং উচ্চতা কমপক্ষে ৪ ফুট ৮ ইঞ্চি।
  - q: রাজশাহী ক্যাডেট কলেজ কোথায়?
    a: রাজশাহীর চারঘাট উপজেলার সরদহে, মোক্তারপুর গ্রামে। রাজশাহী শহর থেকে প্রায় ২৫ কিলোমিটার দূরে।
  - q: রাজশাহী ক্যাডেট কলেজের এসএসসি ২০২৬ ফলাফল কেমন?
    a: এসএসসি ২০২৬-এ ৪৯ জন পরীক্ষার্থীর সবাই জিপিএ-৫ পেয়েছে।

