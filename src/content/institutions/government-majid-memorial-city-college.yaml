about: ১৯৬৫ সালে "খুলনা সিটি কলেজ" নামে কলেজটির যাত্রা শুরু হয়; পরে প্রতিষ্ঠাতা শাহ মোস্তফা আহমেদ মজিদের নামে নাম হয় মজিদ মেমোরিয়াল সিটি কলেজ। খুলনার খানজাহান আলী রোডে অবস্থিত এই সরকারি কলেজে উচ্চ মাধ্যমিক, ডিগ্রি (পাস) ও অনার্স পড়ানো হয়।
faq:
  - q: এমএম সিটি কলেজের পুরো নাম কী?
    a: সরকারি মজিদ মেমোরিয়াল সিটি কলেজ, খুলনা।
  - q: কলেজের জাতীয় বিশ্ববিদ্যালয় কোড কত?
    a: জাতীয় বিশ্ববিদ্যালয়ে কলেজের কোড ০৩১৬।
  - q: এইচএসসি ২০২৬-এ কতজন পরীক্ষার্থী ছিল?
    a: যশোর বোর্ডের কেন্দ্র তালিকা অনুযায়ী ১,০৬৩ জন (৫২৪ জন ছাত্র, ৫৩৯ জন ছাত্রী)।

