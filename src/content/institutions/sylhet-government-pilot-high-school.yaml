about: বিদ্যালয়টি ১৮৩৬ সালে প্রতিষ্ঠিত। এটি দেশের প্রাচীনতম বিদ্যালয়গুলোর একটি। এটি সিলেট শহরের কালীঘাটে ডাক বাংলো রোডে অবস্থিত।
faq:
  - q: সিলেট সরকারি পাইলট উচ্চ বিদ্যালয়ে কি মেয়েরা পড়তে পারে?
    a: না, এটি ছেলেদের বিদ্যালয়। এখানে শুধু ছাত্র ভর্তি হয়।
  - q: কোন কোন শ্রেণিতে ভর্তি নেওয়া হয়?
    a: সাধারণত ৩য় ও ৬ষ্ঠ শ্রেণিতে ভর্তি নেওয়া হয়। বাছাই হয় সরকারি লটারিতে।
  - q: ভর্তির আবেদন কোথায় করতে হয়?
    a: আবেদন করতে হয় অনলাইনে gsa.teletalk.com.bd-তে। গত বছর আবেদন ফি ছিল ১০০ টাকা।
  - q: বিদ্যালয়ে কয়টি শিফট আছে?
    a: দুটি শিফট আছে, প্রভাতি ও দিবা।

