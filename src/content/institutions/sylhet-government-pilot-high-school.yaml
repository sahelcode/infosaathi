about: সিলেট সরকারি পাইলট উচ্চ বিদ্যালয় ১৮৩৬ সালে প্রতিষ্ঠিত, দেশের প্রাচীনতম বিদ্যালয়গুলোর একটি। ব্রিটিশ আমলে আধুনিক শিক্ষানীতি বাস্তবায়নের অংশ হিসেবে এটি গড়ে ওঠে। বিদ্যালয়টি সিলেট শহরের কালীঘাটে ডাক বাংলো রোডে অবস্থিত এবং এখানে ৩য় থেকে ১০ম শ্রেণি পর্যন্ত পড়ানো হয়।
