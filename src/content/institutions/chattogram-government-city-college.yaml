about: ১৯৫৪ সালে "চট্টগ্রাম নৈশ কলেজ" নামে কাজেম আলী হাই স্কুলে কলেজটির যাত্রা শুরু হয়; পরে নাম হয় সিটি কলেজ; ১৯৭৯ সালে কলেজটি সরকারি হয়। কলেজটি নিউ মার্কেট মোড়ের কাছে আইস ফ্যাক্টরি রোডে। এখানে উচ্চ মাধ্যমিক, ডিগ্রি (পাস), অনার্স, মাস্টার্স ও প্রিলিমিনারি-টু-মাস্টার্স পড়ানো হয়; ১৫টি বিভাগে অনার্স ও মাস্টার্স আছে। দিবা ও বৈকালিক দুই শিফটে ক্লাস হয়।
faq:
  - q: সরকারি সিটি কলেজ চট্টগ্রাম কোথায়?
    a: চট্টগ্রাম শহরের নিউ মার্কেট মোড়ের কাছে আইস ফ্যাক্টরি রোডে।
  - q: সিটি কলেজের আগের নাম কী ছিল?
    a: ১৯৫৪ সালে কলেজটি "চট্টগ্রাম নৈশ কলেজ" নামে শুরু হয়, পরে নাম হয় সিটি কলেজ।
  - q: এখানে কি প্রিলিমিনারি মাস্টার্স পড়ানো হয়?
    a: হ্যাঁ। কলেজে প্রিলিমিনারি-টু-মাস্টার্সে ভর্তির নোটিশ দেওয়া হয়।

