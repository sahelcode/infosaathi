about: ১৯৭০ সালে ফটিকছড়ির বিবিরহাটে উচ্চ মাধ্যমিক কলেজ হিসেবে কলেজটি প্রতিষ্ঠিত হয়; পরে ডিগ্রি (পাস) ও অনার্স চালু হয়। এখন এখানে উচ্চ মাধ্যমিক, ডিগ্রি (পাস) এবং হিসাববিজ্ঞান ও ব্যবস্থাপনায় অনার্স পড়ানো হয়।
faq:
  - q: ফটিকছড়ি সরকারি কলেজের জাতীয় বিশ্ববিদ্যালয় কোড কত?
    a: জাতীয় বিশ্ববিদ্যালয়ে কলেজের কোড ৪৩৪১।
  - q: ফটিকছড়ি সরকারি কলেজে অনার্সে কোন কোন বিষয় আছে?
    a: অনার্সে ২টি বিষয় আছে — হিসাববিজ্ঞান ও ব্যবস্থাপনা।
  - q: ডিগ্রি (পাস)-এ কোন কোন কোর্স পড়ানো হয়?
    a: বিএসসি ও বিবিএস-এর ফল কলেজের ওয়েবসাইটে প্রকাশিত হয়।

