about: ১৮৮৬ সালে প্রতিষ্ঠিত একটি স্কুল ১৮৯২ সালে কলেজে উন্নীত হয়ে মুরারিচাঁদ কলেজের যাত্রা শুরু; বর্তমান ক্যাম্পাস সিলেট শহরের পূর্বে টিলাগড়ের থ্যাকারে টিলায়। কলেজটি ১৯৯২ সাল থেকে জাতীয় বিশ্ববিদ্যালয়ের অধিভুক্ত। উচ্চমাধ্যমিকে শুধু বিজ্ঞান বিভাগ চালু আছে; পাশাপাশি ডিগ্রি (পাস), ১৫টি বিষয়ে অনার্স ও মাস্টার্স এবং ইসলামিক স্টাডিজে মাস্টার্স পড়ানো হয়।
