about: ১৮৮৬ সালের মুরারিচাঁদ স্কুল থেকে ১৮৯২ সালের ২৭ জুন কলেজ হিসেবে যাত্রা শুরু হয়। বর্তমান ক্যাম্পাস সিলেট শহরের টিলাগড়ে, থ্যাকারে টিলায়। কলেজটি জাতীয় বিশ্ববিদ্যালয়ের অধিভুক্ত। উচ্চমাধ্যমিকে শুধু বিজ্ঞান বিভাগ আছে। ডিগ্রি (পাস) পর্যায়ে বিএ, বিএসএস ও বিএসসি পড়ানো হয়। ১৫টি বিষয়ে অনার্স ও মাস্টার্স আছে, আর ইসলামিক স্টাডিজে শুধু মাস্টার্স।
faq:
  - q: এমসি কলেজে উচ্চমাধ্যমিকে কোন কোন বিভাগ আছে?
    a: শুধু বিজ্ঞান বিভাগ। মানবিক ও ব্যবসায় শিক্ষা বিভাগ ১৯৬৪ সালে বন্ধ হয়ে যায়।
  - q: এমসি কলেজে একাদশ শ্রেণিতে ভর্তি কীভাবে হয়?
    a: আবেদন হয় কেন্দ্রীয়ভাবে xiclassadmission.gov.bd-তে। মনোনীত হলে কলেজের নোটিশ অনুযায়ী ভর্তি হতে হয়। ২০২৬–২৭ সেশনের ভর্তির নোটিশ কলেজের ওয়েবসাইটে ১৭ সেপ্টেম্বর ২০২৬ প্রকাশ হয়েছে।
  - q: এমসি কলেজে অনার্স ভর্তির যোগ্যতা কত?
    a: গত সেশনে (২০২৫–২৬) বিজ্ঞান ও ব্যবসায় শিক্ষা থেকে এসএসসি ও এইচএসসি দুটিতে কমপক্ষে জিপিএ ২.০০ এবং মোট ৪.৫০ লাগত। মানবিক থেকে এসএসসিতে ২.২৫, এইচএসসিতে ২.০০ এবং মোট ৪.৭৫ লাগত। আবেদন ফি ছিল ১,০০০ টাকা।
  - q: এমসি কলেজে ছাত্রাবাস আছে কি?
    a: হ্যাঁ। ছেলেদের ও মেয়েদের আলাদা ছাত্রাবাস আছে।

