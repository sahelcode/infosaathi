about: ১৯৩১ সালে "হবিগঞ্জ কলেজ" নামে মনোহরগঞ্জ বাজারে কলেজটির যাত্রা শুরু হয়; পরে নাম হয় বৃন্দাবন কলেজ। ১৯৭৯ সালের ৭ মে কলেজটি সরকারি হয়। এখানে উচ্চ মাধ্যমিক, ডিগ্রি (পাস), ১৪টি বিষয়ে অনার্স এবং মাস্টার্স পড়ানো হয়; ক্যাম্পাস ৬.১০ একর।
faq:
  - q: বৃন্দাবন সরকারি কলেজ কবে সরকারি হয়?
    a: ১৯৭৯ সালের ৭ মে। কলেজটি প্রতিষ্ঠিত হয় ১৯৩১ সালে।
  - q: অনার্সে কয়টি বিষয় আছে?
    a: ১৪টি — বাংলা, ইংরেজি, ইতিহাস, ইসলামের ইতিহাস ও সংস্কৃতি, দর্শন, রাষ্ট্রবিজ্ঞান, অর্থনীতি, হিসাববিজ্ঞান, ব্যবস্থাপনা, পদার্থবিজ্ঞান, রসায়ন, গণিত, উদ্ভিদবিজ্ঞান ও প্রাণিবিজ্ঞান।
  - q: কলেজের জাতীয় বিশ্ববিদ্যালয় কোড কত?
    a: জাতীয় বিশ্ববিদ্যালয়ে কলেজের কোড ১৮০১।
  - q: মেয়েদের থাকার ব্যবস্থা আছে কি?
    a: হ্যাঁ। কলেজে ছাত্রী নিবাস আছে।
  - q: বৃন্দাবন সরকারি কলেজের অধ্যক্ষ কে?
    a: অধ্যাপক দেওয়ান জামাল উদ্দিন চৌধুরী (২০২৬-এর সংবাদ অনুযায়ী)।

