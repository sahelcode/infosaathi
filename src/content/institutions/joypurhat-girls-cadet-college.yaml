about: ২০০৫ সালের ২৯ মার্চ ভিত্তিপ্রস্তর স্থাপনের পর ২০০৬ সালে সপ্তম ও অষ্টম শ্রেণির ১০০ জন ক্যাডেট নিয়ে কলেজের যাত্রা শুরু হয়। দেশের তিনটি গার্লস ক্যাডেট কলেজের একটি এটি; ক্যাম্পাস ৫৭ একর। ক্যাডেটদের জন্য তিনটি হাউস আছে — সুলতানা রাজিয়া, বীর প্রতীক ক্যাপ্টেন সিতারা বেগম ও বীর প্রতীক তারামন বিবি।
faq:
  - q: জয়পুরহাট গার্লস ক্যাডেট কলেজে ভর্তির আবেদন কবে?
    a: ২০২৭ শিক্ষাবর্ষে সপ্তম শ্রেণিতে অনলাইন আবেদন চলবে ১ নভেম্বর থেকে ৫ ডিসেম্বর ২০২৬ পর্যন্ত। আবেদন করতে হয় cadetcollege.army.mil.bd-তে।
  - q: ক্যাডেট কলেজে ভর্তির যোগ্যতা কী?
    a: ষষ্ঠ শ্রেণি বা সমমান পাস হতে হবে। ১ জানুয়ারি ২০২৭-এ বয়স সর্বোচ্চ ১৩ বছর ৬ মাস এবং উচ্চতা কমপক্ষে ৪ ফুট ৮ ইঞ্চি।
  - q: দেশে কয়টি গার্লস ক্যাডেট কলেজ আছে?
    a: তিনটি — ময়মনসিংহ, ফেনী ও জয়পুরহাট গার্লস ক্যাডেট কলেজ। মোট ক্যাডেট কলেজ ১২টি।
  - q: জয়পুরহাট গার্লস ক্যাডেট কলেজের এসএসসি ২০২৬ ফলাফল কেমন?
    a: এসএসসি ২০২৬-এ ৫৬ জন পরীক্ষার্থীর সবাই পাস করেছে, জিপিএ-৫ পেয়েছে ৫৪ জন।

