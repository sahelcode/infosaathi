about: প্রতিষ্ঠানটি ১৯৫২ সালের ১৪ জানুয়ারি ঢাকার বেইলি রোডে প্রতিষ্ঠিত হয়। এটি মেয়েদের স্কুল অ্যান্ড কলেজ। মূল শাখা বেইলি রোডে; ধানমন্ডি, বসুন্ধরা ও আজিমপুরে আরও তিনটি শাখা আছে।
faq:
  - q: ভিকারুননিসায় কি ছেলেরা পড়তে পারে?
    a: না, এটি মেয়েদের প্রতিষ্ঠান। এখানে শুধু ছাত্রী ভর্তি হয়।
  - q: ভিকারুননিসার কয়টি শাখা আছে?
    a: মোট চারটি ক্যাম্পাস আছে। মূল শাখা বেইলি রোডে, বাকি তিনটি ধানমন্ডি, বসুন্ধরা ও আজিমপুরে।
  - q: ১ম থেকে ৯ম শ্রেণিতে ভর্তি কীভাবে হয়?
    a: ভর্তি হয় মাধ্যমিক ও উচ্চ শিক্ষা অধিদপ্তরের ডিজিটাল লটারিতে। গত বছর (২০২৬ শিক্ষাবর্ষ) আবেদন হয়েছিল gsa.teletalk.com.bd-তে, ফি ছিল ১০০ টাকা। সেবার চার ক্যাম্পাসে মোট আসন ছিল ২,০২০টি।
  - q: এসএসসি ২০২৬-এ ভিকারুননিসার ফল কেমন?
    a: পাসের হার ৯৭.৯৭ শতাংশ। ২,১১৬ জন পরীক্ষা দিয়ে ১,১১৫ জন জিপিএ-৫ পেয়েছে।

