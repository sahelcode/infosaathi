about: ১৯৫২ সালের ১৪ জানুয়ারি ঢাকার বেইলি রোডে প্রতিষ্ঠিত ভিকারুননিসা নূন স্কুল অ্যান্ড কলেজ মেয়েদের একটি শিক্ষাপ্রতিষ্ঠান। মূল বেইলি রোড শাখা ছাড়াও ধানমন্ডি, বসুন্ধরা ও আজিমপুরে শাখা আছে; চার ক্যাম্পাসে প্রায় ২৫,০০০ শিক্ষার্থী পড়ে। বাংলা ভার্সনের পাশাপাশি ইংরেজি ভার্সনও চালু আছে।

