about: যমুনা নদীর পাশের শহর সিরাজগঞ্জে উচ্চশিক্ষার সুযোগ তৈরির জন্য ১৯৪০ সালে "সিরাজগঞ্জ কলেজ" নামে কলেজটি প্রতিষ্ঠিত হয়। ১৯৭৯ সালে কলেজটি সরকারি হয়। এখন এখানে উচ্চ মাধ্যমিক, অনার্স, মাস্টার্স ও প্রিলিমিনারি-টু-মাস্টার্স পড়ানো হয়।
faq:
  - q: সিরাজগঞ্জ সরকারি কলেজ কবে সরকারি হয়?
    a: ১৯৭৯ সালে। কলেজটি প্রতিষ্ঠিত হয় ১৯৪০ সালে।
  - q: সিরাজগঞ্জ সরকারি কলেজে অনার্সে কোন কোন বিষয় আছে?
    a: কলেজের ওয়েবসাইটে ১২টি অনার্স বিভাগ পাওয়া যায় — বাংলা, ইংরেজি, ইতিহাস, ইসলামের ইতিহাস ও সংস্কৃতি, দর্শন, রাষ্ট্রবিজ্ঞান, অর্থনীতি, হিসাববিজ্ঞান, পদার্থবিজ্ঞান, রসায়ন, গণিত ও উদ্ভিদবিজ্ঞান।
  - q: এখানে কি মাস্টার্স ও প্রিলিমিনারি মাস্টার্স পড়ানো হয়?
    a: হ্যাঁ। কলেজে মাস্টার্স (নিয়মিত) ও প্রিলিমিনারি-টু-মাস্টার্সে ভর্তির নোটিশ দেওয়া হয়।

