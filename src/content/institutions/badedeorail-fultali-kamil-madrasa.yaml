about: "বাদেদেওরাইল ফুলতলী কামিল (এম.এ) মাদ্রাসা সিলেটের জকিগঞ্জ উপজেলার বাদেদেওরাইল গ্রামে অবস্থিত। জকিগঞ্জ দেশের সবচেয়ে উত্তর-পূর্ব কোণের উপজেলা। মাদ্রাসাটি বেসরকারি ও এমপিওভুক্ত। এর EIIN নম্বর ১৩০৫২৫। মাদ্রাসার লোগোতে প্রতিষ্ঠার সাল ১৯২০ লেখা আছে। উইকিপিডিয়া অনুযায়ী মাওলানা ফাতির আলী এটি প্রতিষ্ঠা করেন। তিনি শুরুতে বাদেদেওরাইল মসজিদে পড়াতেন। পরে আলাদা মাদ্রাসা ঘর তৈরি হয়। আলী চৌধুরী পরিবারের ছয়জন সদস্য মাদ্রাসার জন্য জমি দান করেন। পরে আল্লামা আবদুল লতিফ চৌধুরী ফুলতলীর দানে জমি আরও বাড়ে। এখানে দাখিল, আলিম, ফাজিল ও কামিল স্তরে পড়ানো হয়। কামিলে হাদীস ও তাফসীর দুটি বিভাগ আছে। দাখিল ও আলিম স্তর বাংলাদেশ মাদ্রাসা শিক্ষা বোর্ডের অধীনে। ২০০৬ থেকে ২০১৬ সাল পর্যন্ত ফাজিল ও কামিল স্তর ইসলামী বিশ্ববিদ্যালয়ের অধিভুক্ত ছিল। ২০১৬ সাল থেকে এটি ইসলামি আরবি বিশ্ববিদ্যালয়ের অধিভুক্ত। ২০২০ সালের ফেব্রুয়ারিতে মাদ্রাসার শতবর্ষ উদযাপন করা হয়। মাদ্রাসার প্রথম দিকের শিক্ষকদের মধ্যে ছিলেন মাস্টার সৈয়দ আলী চৌধুরী মনসুরপুরী, কারী সৈয়দ আলী পলাশপুরী ও হাবিবুল্লাহ ভাদেশ্বরী। মাওলানা ফাতির আলীর পরে বিভিন্ন সময়ে মুকাদ্দস আলী চৌধুরী, তৈয়বুর রহমান চৌধুরী, শাহ আবদুল মজিদ চৌধুরী ও মুহাম্মদ আবদুল ওয়াহিদ চৌধুরী মাদ্রাসা পরিচালনায় ছিলেন।"
