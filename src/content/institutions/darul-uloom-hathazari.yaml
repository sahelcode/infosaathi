about: "আল-জামিয়াতুল আহলিয়া দারুল উলূম মুঈনুল ইসলাম চট্টগ্রামের হাটহাজারী উপজেলার কেন্দ্রে অবস্থিত একটি কওমি মাদ্রাসা। এটি হাটহাজারী মাদ্রাসা নামে বেশি পরিচিত। মাদ্রাসার অফিসিয়াল ওয়েবসাইট অনুযায়ী ১৮৯৭ সালে (১৩১৫ হিজরি) এখানে পড়ানো শুরু হয়। ১৯০১ সালে (১৩১৯ হিজরি) স্থায়ী মাদ্রাসা গড়ার সিদ্ধান্ত হয়। দারুল উলূম দেওবন্দ থেকে পড়ে আসা চট্টগ্রামের কয়েকজন আলেম দেওবন্দের আদলে এটি গড়ার উদ্যোগ নেন। মাওলানা আবদুল ওয়াহেদ, মাওলানা আবদুল হামিদ ও মাওলানা সুফি আজিজুর রহমান এতে বড় ভূমিকা রাখেন। শাইখুল ইসলাম মাওলানা হাবীবুল্লাহ পড়ানো শুরু করেন, তাঁকে মাদ্রাসার প্রতিষ্ঠাতা বলা হয়। শুরুতে চারিয়া গ্রামে, পরে হাটহাজারী বাজারের কাছে কয়েক জায়গায় ক্লাস হয়। পরে স্থানীয় গোলবদন জমাদারের পরিবারের সহায়তায় স্থায়ী জমি পাওয়া যায়। এখন ক্যাম্পাসের আয়তন ৪.৪৩ একর। এখানে প্রায় ৮,০০০-এর বেশি ছাত্র পড়ে। এর মধ্যে দাওরায়ে হাদীস শ্রেণিতে ২,৭১৪ জন। শিক্ষক ও কর্মকর্তা মিলে ১১০ জন। শিশু শ্রেণি থেকে দাওরায়ে হাদীস পর্যন্ত পড়ানো হয়। এর পরে তাফসীর, হাদীস, ফিকহ, তাজবীদ ও কিরাআত, আরবি সাহিত্য, বাংলা সাহিত্য ও দর্শনে আলাদা বিভাগ আছে। হিফজুল কুরআন বিভাগও আছে। পড়াশোনা সম্পূর্ণ অবৈতনিক। প্রায় ৪,৭০০ গরিব ছাত্র লিল্লাহ বোর্ডিং থেকে বিনা খরচে বা অর্ধেক খরচে খাবার পায়। ক্যাম্পাসে দলীয় রাজনীতি নিষিদ্ধ। মাদ্রাসা থেকে মাসিক মুঈনুল ইসলাম পত্রিকা প্রকাশিত হয়।"
