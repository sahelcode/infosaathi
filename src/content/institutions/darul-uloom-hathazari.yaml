about: "আল-জামিয়াতুল আহলিয়া দারুল উলূম মুঈনুল ইসলাম হাটহাজারী মাদ্রাসা বা বড় মাদ্রাসা নামে পরিচিত। উইকিপিডিয়া অনুযায়ী এটি ১৮৯৬ সালে শুরু হয় এবং ১৯০১ সালে বর্তমান জায়গায় আসে। এটি দেশের সবচেয়ে বড় ও পুরোনো দেওবন্দি কওমি প্রতিষ্ঠান বলে বর্ণিত। প্রতিষ্ঠাতা শায়খুল ইসলাম আল্লামা হাবীবুল্লাহ কুরাইশী।"
