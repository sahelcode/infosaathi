about: "সরকারি মাদ্রাসা-ই-আলিয়া ১৭৮০ সালে ব্রিটিশ সরকারের উদ্যোগে প্রতিষ্ঠিত হয়। এটি ঢাকার বকশীবাজারে অবস্থিত। বাংলাদেশ মাদ্রাসা শিক্ষা বোর্ড ও ইসলামিক আরবি বিশ্ববিদ্যালয়ের সাথে যুক্ত।"
