about: "সরকারি মাদ্রাসা-ই-আলিয়া ঢাকার বকশীবাজারে অবস্থিত একটি সরকারি মাদ্রাসা। মাদ্রাসার অফিসিয়াল ওয়েবসাইট অনুযায়ী এটি ১৭৮০ সালের অক্টোবরে কলকাতায় প্রতিষ্ঠিত হয়। তখন এর নাম ছিল কলকাতা আলিয়া মাদ্রাসা। মুসলিম নেতাদের আবেদনে লর্ড ওয়ারেন হেস্টিংস এটি প্রতিষ্ঠা করেন। শুরুতে ভাড়া করা ভবনে প্রায় চল্লিশজন ছাত্র নিয়ে পড়ানো শুরু হয়। প্রথম প্রধান শিক্ষক ছিলেন মোল্লা মাজদুদ্দীন। ১৮২১ সালে এখানে পরীক্ষা পদ্ধতি চালু হয় এবং ১৮২৯ সালে ইংরেজি পড়ানো শুরু হয়। ১৯৪৭ সালে দেশভাগের পর মাদ্রাসাটি ঢাকায় আসে। ১৯৬১ সালে এটি বকশীবাজারের নিজস্ব ভবনে চলে আসে। মাদ্রাসা শিক্ষা অধিদপ্তরের তথ্য অনুযায়ী ২০০৬ সালে এর ফাজিল ও কামিল স্তর ডিগ্রি ও অনার্স মান পায়। এখন এখানে দাখিল, আলিম, ফাজিল (অনার্স) ও কামিল (স্নাতকোত্তর) স্তরে পড়ানো হয়। দাখিল ও আলিম স্তর বাংলাদেশ মাদ্রাসা শিক্ষা বোর্ডের অধীনে। ফাজিল ও কামিল স্তর ইসলামি আরবি বিশ্ববিদ্যালয়ের অধিভুক্ত। মাদ্রাসার লাইব্রেরিতে ২৫ থেকে ৩০ হাজার দুর্লভ পাণ্ডুলিপি ও বই আছে। ছাত্রদের থাকার জন্য হল আছে, যেমন মুফতি আমিমুল ইহসান হল। মাদ্রাসার EIIN নম্বর ১০৮১৫১।"
