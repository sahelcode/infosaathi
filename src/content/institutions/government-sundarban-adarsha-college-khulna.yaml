about: ১৯৬৯ সালের ১ জুলাই কলেজটি প্রতিষ্ঠিত হয়। ১৯৯৩ সালের ১ আগস্ট কলেজটি সরকারি হয়। খুলনার খানজাহান আলী রোডে কলেজের জমি ০.৭২ একর; এখানে উচ্চ মাধ্যমিক, ডিগ্রি (পাস) ও অনার্স পড়ানো হয়।
faq:
  - q: সরকারি সুন্দরবন আদর্শ কলেজ কবে সরকারি হয়?
    a: ১৯৯৩ সালের ১ আগস্ট। কলেজটি প্রতিষ্ঠিত হয় ১৯৬৯ সালের ১ জুলাই।
  - q: কলেজের জাতীয় বিশ্ববিদ্যালয় কোড কত?
    a: জাতীয় বিশ্ববিদ্যালয়ে কলেজের কোড ০৩১৫।
  - q: সরকারি সুন্দরবন আদর্শ কলেজ কোথায়?
    a: খুলনা শহরে, যশোর–ঢাকা মহাসড়কের পাশে ২৩১ খানজাহান আলী রোডে।
  - q: সরকারি সুন্দরবন আদর্শ কলেজের অধ্যক্ষ কে?
    a: প্রফেসর মো. জাহাঙ্গীর আলী (কলেজের ওয়েবসাইট অনুযায়ী)।

