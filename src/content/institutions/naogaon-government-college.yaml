fee_note: ২০২৬–২০২৭ সেশনের একাদশ শ্রেণি ভর্তির অফিসিয়াল নোটিশ (১৬/০৯/২০২৬) অনুযায়ী; পরের সেশনে বদলাতে পারে।

about: ১৯৫৯ সালে নওগাঁ শহরের উত্তর প্রান্তে ভিত্তিপ্রস্তর স্থাপনের পর ১৯৬২ সালে স্থানীয় জনসাধারণের অর্থে ডিগ্রি কলেজ হিসেবে যাত্রা শুরু; পরে উচ্চমাধ্যমিক যুক্ত হয় এবং ১৯৮০ সালে কলেজটি সরকারি হয়। ১৯৯৬ সালে এখানে অনার্স ও মাস্টার্স চালু হয়; বর্তমানে একাদশ–দ্বাদশ শ্রেণি, ডিগ্রি (পাস), অনার্স ও মাস্টার্স পড়ানো হয়। ক্যাম্পাসের আয়তন ১১ একর।
faq:
  - q: নওগাঁ সরকারি কলেজে একাদশ শ্রেণিতে ভর্তি কীভাবে হয়?
    a: একাদশ শ্রেণির আবেদন হয় কেন্দ্রীয়ভাবে xiclassadmission.gov.bd-তে। মনোনীত হলে কলেজের নোটিশ অনুযায়ী অনলাইনে ফি জমা দিয়ে কাগজপত্রসহ কলেজে ভর্তি সম্পন্ন করতে হয়। সর্বশেষ নোটিশ কলেজের ওয়েবসাইটের ভর্তি সংক্রান্ত নোটিশ বোর্ডে দেওয়া হয়।

