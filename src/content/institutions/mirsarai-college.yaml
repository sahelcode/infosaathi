about: ১৯৭৩ সালে মিরসরাই উপজেলা সদরে স্থানীয় উদ্যোক্তারা কলেজটি প্রতিষ্ঠা করেন। এটি এমপিওভুক্ত বেসরকারি কলেজ। এখানে উচ্চ মাধ্যমিক, ডিগ্রি (পাস) এবং হিসাববিজ্ঞান ও ব্যবস্থাপনায় অনার্স পড়ানো হয়; শিক্ষার্থী প্রায় ৪ হাজার।
faq:
  - q: মিরসরাই কলেজ কি সরকারি?
    a: না। মিরসরাই কলেজ এমপিওভুক্ত বেসরকারি কলেজ।
  - q: মিরসরাই কলেজে অনার্সে কোন কোন বিষয় আছে?
    a: অনার্সে ২টি বিষয় আছে — হিসাববিজ্ঞান ও ব্যবস্থাপনা।
  - q: ডিগ্রি (পাস)-এ কোন কোন কোর্স পড়ানো হয়?
    a: বিএ, বিএসএস, বিবিএস ও বিএসসি।

