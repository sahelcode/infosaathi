about: ১৯৬৩ সালে "রংপুর মহিলা কলেজ" নামে শালবন এলাকায় কলেজটির যাত্রা শুরু হয়; ১৯৬৯ সালের ১৯ জুন নাম হয় বেগম রোকেয়া কলেজ। ১৯৭৯ সালের ৭ মে কলেজটি সরকারি হয়। এখানে উচ্চ মাধ্যমিক, ডিগ্রি (পাস) এবং ৬টি বিষয়ে অনার্স ও মাস্টার্স পড়ানো হয়।
faq:
  - q: সরকারি বেগম রোকেয়া কলেজের আগের নাম কী ছিল?
    a: আগের নাম ছিল রংপুর মহিলা কলেজ। ১৯৬৯ সালে নাম হয় বেগম রোকেয়া কলেজ।
  - q: এই কলেজে কি শুধু মেয়েরা পড়ে?
    a: হ্যাঁ। এটি মেয়েদের কলেজ।
  - q: অনার্স ও মাস্টার্সে কোন কোন বিষয় আছে?
    a: ৬টি বিষয় — বাংলা, ইংরেজি, দর্শন, ইসলামের ইতিহাস ও সংস্কৃতি, রাষ্ট্রবিজ্ঞান ও অর্থনীতি। সব বিষয়েই মাস্টার্স আছে।
  - q: এইচএসসি ২০২৫-এ ফলাফল কেমন?
    a: ৯৮২ জন পরীক্ষার্থীর মধ্যে ৮২৯ জন পাস করেছে।
  - q: বেগম রোকেয়া কলেজ আর বেগম রোকেয়া বিশ্ববিদ্যালয় কি একই?
    a: না। সরকারি বেগম রোকেয়া কলেজ পূর্ব শালবনের একটি কলেজ; বেগম রোকেয়া বিশ্ববিদ্যালয় আলাদা প্রতিষ্ঠান।

