about: ১৯৬৪ সালে "মুরারি চাঁদ উচ্চমাধ্যমিক মহাবিদ্যালয়" নামে কলেজটি প্রতিষ্ঠিত হয়; ১৯৬৬ সালে মানবিক ও বাণিজ্য বিভাগে ক্লাস শুরু হয়। ১৯৮৮ সালে শিক্ষা মন্ত্রণালয়ের আদেশে নাম হয় সিলেট সরকারি কলেজ। ২০১৭ সাল থেকে এখানে ৫টি বিষয়ে অনার্স পড়ানো হয়।
faq:
  - q: সিলেট সরকারি কলেজের আগের নাম কী ছিল?
    a: আগের নাম ছিল মুরারি চাঁদ উচ্চমাধ্যমিক মহাবিদ্যালয়। ১৯৮৮ সালে নাম হয় সিলেট সরকারি কলেজ।
  - q: সিলেট সরকারি কলেজে অনার্সে কোন কোন বিষয় আছে?
    a: অনার্সে ৫টি বিষয় আছে — বাংলা, রাষ্ট্রবিজ্ঞান, অর্থনীতি, হিসাববিজ্ঞান ও ব্যবস্থাপনা।
  - q: সিলেট সরকারি কলেজে একাদশ শ্রেণিতে কত আসন?
    a: গত বছর (২০২৪–২৫ সেশন) বিজ্ঞান, মানবিক ও ব্যবসায় শিক্ষা বিভাগে ৩০০টি করে মোট ৯০০ আসন ছিল।
  - q: সিলেট সরকারি কলেজের অধ্যক্ষ কে?
    a: প্রফেসর মো. ফরিদ আহমেদ (সংবাদ অনুযায়ী)।

