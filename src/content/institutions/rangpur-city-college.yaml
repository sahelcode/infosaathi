about: ২০০০ সালে রংপুর শহরের আশরতপুরে কলেজটি প্রতিষ্ঠিত হয়। এটি বেসরকারি উচ্চ মাধ্যমিক কলেজ; এখানে একাদশ–দ্বাদশ শ্রেণিতে বিজ্ঞান, মানবিক ও ব্যবসায় শিক্ষা বিভাগে পড়ানো হয়। এটি রংপুর সরকারি সিটি কলেজ থেকে আলাদা প্রতিষ্ঠান।
faq:
  - q: রংপুর সিটি কলেজ আর রংপুর সরকারি সিটি কলেজ কি একই?
    a: না। রংপুর সিটি কলেজ আশরতপুরের বেসরকারি কলেজ (EIIN ১২৭৪৯৫, প্রতিষ্ঠা ২০০০)। রংপুর সরকারি সিটি কলেজ আলাদা একটি সরকারি কলেজ।
  - q: রংপুর সিটি কলেজে কি অনার্স আছে?
    a: না। এখানে শুধু একাদশ–দ্বাদশ শ্রেণি (এইচএসসি) পড়ানো হয়।

