about: ১৯৫৭ সালে আন্দরকিল্লা শাহী জামে মসজিদের পাশে ভিক্টোরিয়া ইসলামিক হোস্টেলে ১৫০ জন ছাত্রী ও ৮ জন শিক্ষক নিয়ে কলেজটির যাত্রা শুরু হয়। ১৯৬১–৬২ সালে কলেজ খুলশীর পাহাড়ে প্রায় ২০ একর জায়গায় সরে আসে। এখন এখানে উচ্চ মাধ্যমিক, ডিগ্রি (পাস), অনার্স ও মাস্টার্স পড়ানো হয়।
faq:
  - q: চট্টগ্রাম সরকারি মহিলা কলেজে অনার্সে কোন কোন বিষয় আছে?
    a: অনার্সে ৯টি বিষয় আছে — বাংলা, ইংরেজি, দর্শন, ইসলামের ইতিহাস ও সংস্কৃতি, অর্থনীতি, রাষ্ট্রবিজ্ঞান, সমাজবিজ্ঞান, সমাজকর্ম ও মনোবিজ্ঞান।
  - q: চট্টগ্রাম সরকারি মহিলা কলেজে কতজন শিক্ষার্থী পড়ে?
    a: কলেজের ওয়েবসাইট অনুযায়ী প্রায় ১৩,০০০ শিক্ষার্থী পড়ে, শিক্ষক ৭৩ জন।
  - q: চট্টগ্রাম সরকারি মহিলা কলেজে কি ছেলেরা পড়তে পারে?
    a: না। এটি শুধু মেয়েদের কলেজ।
  - q: চট্টগ্রাম সরকারি মহিলা কলেজের জাতীয় বিশ্ববিদ্যালয় কোড কত?
    a: জাতীয় বিশ্ববিদ্যালয়ে কলেজের কোড ৪৩০২।
  - q: চট্টগ্রাম সরকারি মহিলা কলেজের অধ্যক্ষ কে?
    a: প্রফেসর মো. রেজা খান হেলালী (কলেজের ওয়েবসাইট অনুযায়ী, ২০২৬)।

