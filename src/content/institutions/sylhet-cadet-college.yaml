about: ১৯৬৯ সালে মডেল স্কুল হিসেবে যাত্রা শুরু করে, ১৯৭৪ সালে মডেল কলেজ হয়। ১৯৭৮ সালে এটি ক্যাডেট কলেজে রূপান্তরিত হয়; মুক্তিযুদ্ধের পর প্রতিষ্ঠিত প্রথম ক্যাডেট কলেজ। ক্যাডেটদের জন্য তিনটি হাউস আছে — তিতুমীর, হযরত শাহজালাল (রহ.) ও সুরমা।
faq:
  - q: সিলেট ক্যাডেট কলেজে ভর্তির আবেদন কবে?
    a: ২০২৭ শিক্ষাবর্ষে সপ্তম শ্রেণিতে অনলাইন আবেদন চলবে ১ নভেম্বর থেকে ৫ ডিসেম্বর ২০২৬ পর্যন্ত। আবেদন করতে হয় cadetcollege.army.mil.bd-তে।
  - q: ক্যাডেট কলেজে ভর্তির যোগ্যতা কী?
    a: ষষ্ঠ শ্রেণি বা সমমান পাস হতে হবে। ১ জানুয়ারি ২০২৭-এ বয়স সর্বোচ্চ ১৩ বছর ৬ মাস এবং উচ্চতা কমপক্ষে ৪ ফুট ৮ ইঞ্চি।
  - q: সিলেট ক্যাডেট কলেজে কি মেয়েরা পড়তে পারে?
    a: না। সিলেট ক্যাডেট কলেজ শুধু ছেলেদের জন্য।

