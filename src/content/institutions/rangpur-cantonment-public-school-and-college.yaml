about: ১৯৭৭ সালে তৎকালীন উত্তরাঞ্চলের কমান্ডার ব্রিগেডিয়ার এম এ লতিফ ভিত্তিপ্রস্তর স্থাপন করেন; ১৯৭৮ সালে নার্সারি থেকে ষষ্ঠ শ্রেণি নিয়ে ক্লাস শুরু হয়। ১৯৮০ সালে দশম শ্রেণি পর্যন্ত এবং ১৯৮১ সালে কলেজ শাখা চালু হয়। পরে জাতীয় বিশ্ববিদ্যালয়ের অধীনে ডিগ্রি (পাস) কোর্স যুক্ত হয়।
faq:
  - q: রংপুর ক্যান্টনমেন্ট পাবলিক স্কুল অ্যান্ড কলেজে কোন কোন শ্রেণিতে পড়ানো হয়?
    a: প্লে থেকে দশম শ্রেণি, একাদশ–দ্বাদশ শ্রেণি এবং জাতীয় বিশ্ববিদ্যালয়ের অধীনে ডিগ্রি (পাস)।
  - q: এসএসসি ২০২৬-এ ফলাফল কেমন?
    a: ৫৩৩ জন পরীক্ষার্থীর মধ্যে ৫৩০ জন পাস করেছে, পাসের হার ৯৯.৪৪%। জিপিএ-৫ পেয়েছে ৩২৯ জন।
  - q: স্কুল ও কলেজের কোড কত?
    a: স্কুল কোড ৫৩৫০, কলেজ কোড ৫৩৭৫।

