about: শিক্ষা মন্ত্রণালয়ের দেশজুড়ে ১১টি মডেল স্কুল প্রতিষ্ঠা প্রকল্পের অংশ হিসেবে প্রতিষ্ঠানটির ভিত্তিপ্রস্তর স্থাপিত হয় ২০০৩ সালে, আর নিয়মিত পাঠদান ও শিক্ষার্থী ভর্তি শুরু হয় ২০০৭ সালে। ১৮ সেপ্টেম্বর ২০১৭ তারিখের গেজেটে এটি সরকারি হয় এবং নাম হয় সিলেট সরকারি মডেল স্কুল এন্ড কলেজ। এখানে ৬ষ্ঠ থেকে ১০ম শ্রেণি (মাধ্যমিক) এবং একাদশ–দ্বাদশ শ্রেণি (উচ্চ মাধ্যমিক) পড়ানো হয়।
