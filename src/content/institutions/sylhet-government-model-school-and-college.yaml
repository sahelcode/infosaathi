about: শিক্ষা মন্ত্রণালয়ের মডেল স্কুল প্রকল্পের অধীনে ২০০৩ সালে এর ভিত্তিপ্রস্তর স্থাপিত হয়। নিয়মিত ক্লাস ও ভর্তি শুরু হয় ২০০৭ সালে। ১৮ সেপ্টেম্বর ২০১৭ তারিখের গেজেটে প্রতিষ্ঠানটি সরকারি হয়।
faq:
  - q: সিলেট সরকারি মডেল স্কুল এন্ড কলেজে কোন কোন শ্রেণি আছে?
    a: এখানে ৬ষ্ঠ থেকে দ্বাদশ শ্রেণি পর্যন্ত পড়ানো হয়। একাদশ–দ্বাদশে বিজ্ঞান, মানবিক ও ব্যবসায় শিক্ষা বিভাগ আছে।
  - q: এখানে কি ছেলে-মেয়ে একসাথে পড়ে?
    a: হ্যাঁ, এটি সহশিক্ষা প্রতিষ্ঠান।
  - q: একাদশ শ্রেণিতে ভর্তি কীভাবে হয়?
    a: আবেদন হয় কেন্দ্রীয়ভাবে xiclassadmission.gov.bd-তে। মনোনীত হলে প্রতিষ্ঠানের নোটিশ অনুযায়ী ভর্তি হতে হয়। নোটিশ প্রতিষ্ঠানের ওয়েবসাইটের নোটিশ বোর্ডে দেওয়া হয়।
  - q: প্রতিষ্ঠানটি কবে সরকারি হয়?
    a: ১৮ সেপ্টেম্বর ২০১৭ তারিখের গেজেটে এটি সরকারি হয়।

