about: ১৯৬০ সালের ১ মার্চ তেজগাঁও বিমানবন্দরের কাছে ইংরেজি মাধ্যমের "শাহীন স্কুল" হিসেবে ৩৪ জন শিক্ষার্থী নিয়ে যাত্রা শুরু করে। ১৯৬৭ সালে বাংলা মাধ্যম চালু হয় এবং ১৯৭৭–৭৮ সালে উচ্চ মাধ্যমিক যুক্ত হয়ে নাম হয় বিএএফ শাহীন কলেজ ঢাকা। বাংলাদেশ বিমান বাহিনী পরিচালিত এই প্রতিষ্ঠানে কেজি থেকে দ্বাদশ শ্রেণি পর্যন্ত বাংলা ও ইংরেজি ভার্সনে পড়ানো হয়।
faq:
  - q: বিএএফ শাহীন কলেজ ঢাকা কারা পরিচালনা করে?
    a: বাংলাদেশ বিমান বাহিনী। বিমান বাহিনীর সদস্যদের সন্তানদের পাশাপাশি বেসামরিক পরিবারের সন্তানরাও ভর্তি হতে পারে।
  - q: একাদশ শ্রেণিতে কত আসন?
    a: ২০২৬–২৭ সেশনে বাংলা ভার্সনে ১,৪৩০টি এবং ইংরেজি ভার্সনে ৩৯০টি আসন।
  - q: বিএএফ শাহীন কলেজ ঢাকা আর বিএএফ শাহীন কলেজ কুর্মিটোলা কি একই?
    a: না। শাহীন কলেজ ঢাকা জাহাঙ্গীর গেটে (EIIN ১০৭৮৫৮); শাহীন কলেজ কুর্মিটোলা আলাদা প্রতিষ্ঠান।
  - q: প্রতিষ্ঠানের মূলমন্ত্র কী?
    a: শিক্ষা, সংযম, শৃঙ্খলা।

