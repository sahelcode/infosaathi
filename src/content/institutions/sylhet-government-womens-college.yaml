about: সিলেট সরকারি মহিলা কলেজ ১৯৩৯ সালে ১০০ জন ছাত্রী নিয়ে যাত্রা শুরু করে। কলেজটি সিলেট শহরের চৌহাট্টায়, হযরত শাহজালাল রোডে। এটি জাতীয় বিশ্ববিদ্যালয়ের অধিভুক্ত, কলেজ কোড ১৭০৫। এখানে একাদশ–দ্বাদশ শ্রেণি, ডিগ্রি (পাস) বিএ, বিএসএস ও বিএসসি পড়ানো হয়। কলেজের ওয়েবসাইট অনুযায়ী অনার্স বিভাগ ১৪টি। মাস্টার্স ও প্রিলিমিনারি মাস্টার্সও আছে।
faq:
  - q: সিলেট সরকারি মহিলা কলেজে কি শুধু মেয়েরা পড়ে?
    a: হ্যাঁ। এটি শুধু ছাত্রীদের কলেজ।
  - q: সিলেট সরকারি মহিলা কলেজে উচ্চমাধ্যমিকে কোন কোন বিভাগ আছে?
    a: বিজ্ঞান ও মানবিক। ২০২৬–২৭ সেশনের একাদশ শ্রেণির মেধাতালিকা এই দুই বিভাগেই প্রকাশ হয়েছে।
  - q: সিলেট সরকারি মহিলা কলেজে একাদশ শ্রেণিতে ভর্তি কীভাবে হয়?
    a: আবেদন হয় কেন্দ্রীয়ভাবে xiclassadmission.gov.bd-তে। মনোনীত হলে কলেজের নোটিশ অনুযায়ী ভর্তি হতে হয়। ২০২৬–২৭ সেশনের ভর্তির নোটিশ কলেজের ওয়েবসাইটে ৩১ আগস্ট ২০২৬ প্রকাশ হয়েছে।
  - q: জাতীয় বিশ্ববিদ্যালয়ে সিলেট সরকারি মহিলা কলেজের কোড কত?
    a: কলেজ কোড ১৭০৫। অনার্স ও ডিগ্রির আবেদনে এই কোড লাগে।
  - q: সিলেট সরকারি মহিলা কলেজে ছাত্রীনিবাস আছে কি?
    a: হ্যাঁ। দূরের ছাত্রীদের জন্য ছাত্রীনিবাস আছে।

