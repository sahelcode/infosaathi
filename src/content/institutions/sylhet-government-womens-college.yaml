about: ১৯৩৯ সালে প্রতিষ্ঠিত সিলেট সরকারি মহিলা কলেজ সিলেট শহরের চৌহাট্টায় নারীদের উচ্চশিক্ষার একটি সরকারি প্রতিষ্ঠান। এখানে একাদশ–দ্বাদশ শ্রেণি, ডিগ্রি (পাস), অনার্স ও মাস্টার্স পড়ানো হয়; কলেজের ওয়েবসাইট অনুযায়ী অনার্স বিভাগ ১৪টি।
