about: "আল-জামিয়া আল-ইসলামিয়া পটিয়া ১৯৩৮ সালে চট্টগ্রামের পটিয়ায় প্রতিষ্ঠিত হয়। এটি একটি কওমি মাদ্রাসা, যা পটিয়া মাদ্রাসা নামে পরিচিত। এখানে নূরানি, নাজেরা, হিফজ থেকে দাওরায়ে হাদীস পর্যন্ত পড়ানো হয়। সাধারণ শিক্ষার এসএসসিও এখানে আছে।"
