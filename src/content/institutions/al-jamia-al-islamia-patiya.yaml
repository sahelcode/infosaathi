about: "আল-জামিয়া আল-ইসলামিয়া পটিয়া চট্টগ্রামের পটিয়ায় অবস্থিত একটি কওমি মাদ্রাসা। এটি পটিয়া মাদ্রাসা নামে বেশি পরিচিত। জামিয়ার অফিসিয়াল ওয়েবসাইট অনুযায়ী এটি ১৯৩৮ সালে (১৩৫৭ হিজরি) প্রতিষ্ঠিত হয়। জায়গাটি চট্টগ্রাম বন্দর থেকে প্রায় ২৬ কিলোমিটার দক্ষিণ-পূর্বে। প্রতিষ্ঠাতা ও প্রথম মুহতামিম ছিলেন মুফতি আজিজুল হক। উইকিপিডিয়া অনুযায়ী শুরুতে এর নাম ছিল জমিরিয়া কাসেমুল উলুম। অফিসিয়াল সাইটে বলা হয়েছে, এখানে প্রায় ৫,০০০ শিক্ষার্থী ও প্রায় ১৫০ জন শিক্ষক আছেন। প্রায় ২,৫০০ গরিব শিক্ষার্থী বিনা খরচে খাবার পায়। মাদ্রাসাটি দান ও সদকার টাকায় চলে। এখানে প্রাথমিক স্তর থেকে দাওরায়ে হাদীস পর্যন্ত পড়ানো হয়। হিফজুল কুরআন বিভাগ ও ফতোয়া বিভাগ আছে। এর পরে হাদীস, ফিকহ, তাফসীর, আরবি ও বাংলা সাহিত্যে উচ্চতর বিশেষায়িত পড়াশোনার সুযোগ আছে। উইকিপিডিয়া অনুযায়ী ১৯৬৫ সালে এখানে বাংলা সাহিত্য বিভাগ চালু হয়। উইকিপিডিয়ায় লেখা আছে, ১৯৭১ সালের ২৭ মার্চ জিয়াউর রহমান ও তাঁর সঙ্গীরা এই মাদ্রাসার অতিথিশালায় রাত কাটান। জামিয়া থেকে বাংলা মাসিক পত্রিকা আত-তাওহীদ প্রকাশিত হয়। জামিয়ার নিজস্ব কেন্দ্রীয় গ্রন্থাগার আছে। আঞ্জুমানে ইত্তেহাদুল মাদারিস বাংলাদেশ নামের কওমি মাদ্রাসা শিক্ষা বোর্ডটি জামিয়া পরিচালিত সংস্থাগুলোর একটি।"
