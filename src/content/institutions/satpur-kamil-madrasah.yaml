about: "সৎপুর কামিল মাদরাসা সিলেট জেলার বিশ্বনাথ উপজেলার লামাকাজী ইউনিয়নের সৎপুর গ্রামে। এটি একটি বেসরকারি আলিয়া ধারার মাদরাসা। ছেলে ও মেয়ে দুজনেই এখানে পড়ে। মাদরাসার EIIN নম্বর ১৩০২০৫। উইকিপিডিয়া অনুযায়ী মাওলানা গোলাম হোসাইন সৎপুরী ১৯৪৮ সালে নিজের বাড়িতে মাদরাসাটি শুরু করেন। পরে এটি গ্রামের ঈদগাহের জায়গায় সরিয়ে নেওয়া হয়। শুরুতে এটি ছিল ইবতেদায়ি স্তরের প্রতিষ্ঠান। ১৯৫৮ সালে দাখিল, ১৯৬০ সালে আলিম, ১৯৬২ সালে ফাজিল এবং ১৯৬৫ সালে কামিল স্তরের স্বীকৃতি আসে। ২০১৭ সালে আল-হাদিস ও ইসলামিক স্টাডিজ বিষয়ে অনার্স কোর্স চালু হয়। মাদরাসাটি বাংলাদেশ মাদ্রাসা শিক্ষা বোর্ডের স্বীকৃত এবং ইসলামি আরবি বিশ্ববিদ্যালয়ের অধিভুক্ত। মাদরাসার নামে মোট ৪.৩৮ একর জমি নিবন্ধিত। এর মধ্যে ১.৬৫ একর মূল শিক্ষা এলাকা হিসেবে ব্যবহার হয়। ২০১৬ সালে মাদরাসার শিক্ষা ভবনের পুনর্নির্মাণ কাজ শুরু হয়। এখানে বাংলা ও আরবি ভাষায় পড়ানো হয়।"
