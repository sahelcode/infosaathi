about: ১৯৬২ সালে প্রতিষ্ঠিত রাজশাহী শহরের প্রথম মহিলা কলেজ। এখানে উচ্চ মাধ্যমিক (একাদশ–দ্বাদশ) শ্রেণির পাশাপাশি জাতীয় বিশ্ববিদ্যালয়ের অধীনে ডিগ্রি (পাস), অনার্স ও মাস্টার্স কোর্স পড়ানো হয়। কলেজের ওয়েবসাইট অনুযায়ী এখানে কলা, বিজ্ঞান, সামাজিক বিজ্ঞান ও ব্যবসায় শিক্ষা অনুষদ রয়েছে।

