about: "সিলেট সরকারি আলিয়া মাদ্রাসা সিলেট শহরের চৌহাট্টায় মেডিকেল কলেজ রোডে অবস্থিত একটি সরকারি মাদ্রাসা। এর EIIN নম্বর ১৩০৪৩৯। বাংলাপিডিয়া অনুযায়ী শুরুতে নাইওরপুলে আঞ্জুমানে ইসলামিয়া নামে একটি ছোট বেসরকারি মাদ্রাসা ছিল। ১৯১৩ সালে সরকার সিলেট শহরে একটি সিনিয়র মাদ্রাসা নতুন করে প্রতিষ্ঠা করে। মাদ্রাসার লোগোতেও প্রতিষ্ঠার সাল ১৯১৩ লেখা আছে। আসাম সরকারের তখনকার শিক্ষামন্ত্রী খান বাহাদুর আবদুল মজিদ মাদ্রাসাটির উন্নয়নে উদ্যোগ নেন। ১৯৩৩ সালে এটি ঢাকা মাধ্যমিক শিক্ষা বোর্ডের অধীনে নিউ স্কিম হাই মাদ্রাসা হয়। পরে এর নাম হয় সিলেট আলিয়া মাদ্রাসা। ১৯৩৫ সালে আবু নসর ওহীদের উদ্যোগে এটি কামিল (হাদিস) মান পায়। বাংলাপিডিয়া একে দেশের প্রথম কামিল মাদ্রাসা বলেছে। এখন এখানে দাখিল, আলিম, ফাজিল ও কামিল স্তরে পড়ানো হয়। অনার্সে চারটি বিষয় আছে: আল-হাদিস ও ইসলামিক স্টাডিজ, আল-কুরআন ও ইসলামিক স্টাডিজ, আরবি ভাষা ও সাহিত্য এবং দাওয়াহ। ক্যাম্পাসের আয়তন প্রায় ৯ একর। এখানে তিনটি একাডেমিক ভবন, একটি ছাত্রাবাস ও একটি খেলার মাঠ আছে। লাইব্রেরিতে প্রায় ১১,০০০ বই আছে। মাদ্রাসায় পদার্থবিজ্ঞান, রসায়ন, জীববিজ্ঞান, আইসিটি ও গণিত ল্যাব আছে।"
