about: "সিলেট সরকারি আলিয়া মাদ্রাসা ১৯১৩ সালে প্রতিষ্ঠিত হয়। এটি সিলেট শহরের চৌহাট্টায় ৯ একর জায়গার ওপর। উইকিপিডিয়া অনুযায়ী এখানে ৬৫০-এর বেশি শিক্ষার্থী ও ১৮ জন কর্মী আছেন। ক্যাম্পাসে ৩টি ভবন, ছাত্রাবাস, খেলার মাঠ ও লাইব্রেরি আছে।"
