about: ১৯১৬ সালে তৎকালীন বাংলার গভর্নর লর্ড কারমাইকেলের নামে রংপুর শহরের লালবাগে কারমাইকেল কলেজ প্রতিষ্ঠিত হয়; ১৯৬৩ সালের ১ জানুয়ারি কলেজটি সরকারি করা হয়। ১৯৯২ সাল পর্যন্ত রাজশাহী বিশ্ববিদ্যালয়ের অধীনে থাকার পর এটি এখন জাতীয় বিশ্ববিদ্যালয়ের অধিভুক্ত। কলেজে উচ্চ মাধ্যমিক ও স্নাতক (অনার্স) পর্যায়ে কলা, সামাজিক বিজ্ঞান, ব্যবসায় প্রশাসন ও বিজ্ঞান অনুষদে পড়ানো হয়।
