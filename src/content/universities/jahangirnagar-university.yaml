detail:
  open: ২০২৬–২৭-এর আবেদনের তারিখ এখনো ঘোষণা হয়নি; গত বছর আবেদন শুরু হয়েছিল ২২ নভেম্বর।
  close: ২০২৬–২৭-এর শেষ তারিখ এখনো জানা যায়নি; গত বছর আবেদনের শেষ দিন ছিল ৭ ডিসেম্বর।
  exam: জাবির ২০২৬–২৭ ভর্তি পরীক্ষা ১০ থেকে ২১ জানুয়ারি ২০২৭, শুধু ক্যাম্পাসে, বিভাগীয় কেন্দ্রে নয়।
  elig: ২০২৬–২৭-এর জিপিএ যোগ্যতা এইচএসসির ফলের পর ঠিক হবে; গত বছর এসএসসি ২০২২ বা পরে লাগত।
  app_fee: ২০২৬–২৭-এর ফি এখনো ঠিক হয়নি; গত বছর A–D ইউনিটে ৮০০, E-তে ৭০০, C1 ও আইবিএতে ৬০০ টাকা।
  seats: গত বছর (২০২৫–২৬) সাতটি ইউনিটে মোট ১,৮৪২টি আসন ছিল; সবচেয়ে বেশি C ইউনিটে ৪৬৬টি।
  competition: গত বছর ২,১৯,৩৯৯ জন আবেদন করেন ১,৮৪২ আসনে; আসনপ্রতি প্রায় ১১৯ জন (আমাদের হিসাব)।
  rank: কিউএস (QS) বিশ্ব র‍্যাংকিং ২০২৭-এ জাহাঙ্গীরনগর বিশ্ববিদ্যালয় ১৪০১+ ধাপে, দেশে পঞ্চম।
  programs: ছয়টি অনুষদের ৩৪টি বিভাগ ও চারটি ইনস্টিটিউটে স্নাতক; ভর্তি হয় ইউনিটভিত্তিক পরীক্ষায়।
