about: জাহাঙ্গীরনগর বিশ্ববিদ্যালয় ১৯৭০ সালে প্রতিষ্ঠিত একটি আবাসিক সরকারি বিশ্ববিদ্যালয়, ঢাকার সাভারে ৬৯৭.৫৬ একরের ক্যাম্পাসে অবস্থিত। এখানে ছয়টি অনুষদের ৩৪টি বিভাগ ও চারটি ইনস্টিটিউটে ১৫ হাজারের বেশি শিক্ষার্থী পড়েন। স্নাতক প্রথম বর্ষে ভর্তি হয় ইউনিটভিত্তিক নিজস্ব ভর্তি পরীক্ষায়।
