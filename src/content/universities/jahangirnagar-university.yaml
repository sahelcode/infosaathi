admission:
  intake: ২০২৬–২৭ শিক্ষাবর্ষ (স্নাতক প্রথম বর্ষ)
  requirement: "২০২৬–২৭-এর ন্যূনতম যোগ্যতা এখনো ঠিক হয়নি; এইচএসসির ফল প্রকাশের পর সভায় ঠিক হবে। গত বছর (২০২৫–২৬) ২০২২ বা পরে এসএসসি এবং ২০২৪ বা ২০২৫ সালে এইচএসসি বা সমমান পাস শিক্ষার্থীরা আবেদন করতে পেরেছিলেন; জিপিএ হিসাব হয় চতুর্থ বিষয়সহ।"
  exam: "১০ থেকে ২১ জানুয়ারি ২০২৭, শুক্র-শনি ও সরকারি ছুটির দিন ছাড়া। পরীক্ষা হবে শুধু জাবি ক্যাম্পাসে, বিভাগীয় কেন্দ্রে নয়। ইউনিট কাঠামো গত বছরের মতোই, তবে আইন বিভাগ এবার সমাজবিজ্ঞান অনুষদের ইউনিটে পরীক্ষা নেবে।"
  steps:
    - title: অনলাইনে আবেদন
      text: ju-admission.org-এ আবেদন; গত বছর আবেদন চলেছিল ২২ নভেম্বর থেকে ৭ ডিসেম্বর রাত ১১টা ৫৯ মিনিট পর্যন্ত।
    - title: আবেদন ফি জমা
      text: গত বছর ফি ছিল A, B, C ও D ইউনিটে ৮০০, E ইউনিটে ৭০০, C1 ও আইবিএ-জেইউতে ৬০০ টাকা, সঙ্গে ১.২% সার্ভিস চার্জ; ডেবিট/ক্রেডিট কার্ড বা মোবাইল ব্যাংকিংয়ে।
    - title: ভর্তি পরীক্ষা
      text: ১০ থেকে ২১ জানুয়ারি ২০২৭, জাবি ক্যাম্পাসে; ইউনিটভিত্তিক সময়সূচি পরে ju-admission.org-এ জানানো হবে।
    - title: ফল ও বিষয় বরাদ্দ
      text: ইউনিটভিত্তিক মেধাতালিকা প্রকাশের পর বিষয় পছন্দ ও ভর্তি।
  documents:
    - এসএসসি ও এইচএসসির রোল, রেজিস্ট্রেশন ও বোর্ডের তথ্য
    - আবেদনের জন্য সাম্প্রতিক রঙিন ছবি
    - ভর্তির সময় মূল মার্কশিট ও সনদ

