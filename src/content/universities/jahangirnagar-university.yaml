faq:
  - q: জাহাঙ্গীরনগর বিশ্ববিদ্যালয় ভর্তি পরীক্ষা ২০২৬–২৭ কবে?
    a: "২০২৬–২৭ শিক্ষাবর্ষের স্নাতক প্রথম বর্ষের ভর্তি পরীক্ষা ১০ থেকে ২১ জানুয়ারি ২০২৭, শুক্র-শনি ও সরকারি ছুটির দিন বাদে। পরীক্ষা হবে শুধু জাবি ক্যাম্পাসে; ইউনিটভিত্তিক তারিখ পরে জানানো হবে।"
  - q: জাবিতে ভর্তির আবেদন কবে শুরু?
    a: "২০২৬–২৭-এর আবেদনের তারিখ এখনো ঘোষণা হয়নি। গত বছর (২০২৫–২৬) আবেদন চলেছিল ২২ নভেম্বর থেকে ৭ ডিসেম্বর পর্যন্ত, ju-admission.org-এ।"
  - q: জাহাঙ্গীরনগর বিশ্ববিদ্যালয়ে ভর্তির যোগ্যতা কত জিপিএ?
    a: "২০২৬–২৭-এর ন্যূনতম জিপিএ এখনো ঠিক হয়নি; এইচএসসির ফল প্রকাশের পর সভায় ঠিক হবে। গত বছর ২০২২ বা পরে এসএসসি এবং ২০২৪ বা ২০২৫ সালে এইচএসসি পাস শিক্ষার্থীরা আবেদন করতে পেরেছিলেন।"
  - q: জাবি ভর্তির আবেদন ফি কত?
    a: "২০২৬–২৭-এর আবেদন ফি এখনো ঠিক হয়নি। গত বছর (২০২৫–২৬) A, B, C ও D ইউনিটে ৮০০ টাকা, E ইউনিটে ৭০০ টাকা এবং C1 ও আইবিএ-জেইউতে ৬০০ টাকা ছিল, সঙ্গে ১.২% সার্ভিস চার্জ।"
  - q: জাহাঙ্গীরনগর বিশ্ববিদ্যালয়ের আসন সংখ্যা কত?
    a: "২০২৬–২৭-এর আসন এখনো জানা যায়নি। গত বছর (২০২৫–২৬) সাতটি ইউনিটে মোট ১,৮৪২টি আসন ছিল: A ৪২৬, B ৩২৬, C ৪৬৬, C1 ৬৪, D ৩১০, E ২০০ এবং আইবিএ-জেইউ ৫০টি।"
  - q: জাহাঙ্গীরনগর বিশ্ববিদ্যালয়ের যোগাযোগ নম্বর কী?
    a: "বিশ্ববিদ্যালয়ের ওয়েবসাইটে দেওয়া অফিস ফোন ০২২২৪৪৯১০৪০ এবং পিএবিএক্স ০২২২৪৪৯১০৪৫ (এক্সটেনশন ১২০৪)। রেজিস্ট্রার অফিসের ইমেইল registrar@juniv.edu।"
  - q: জাহাঙ্গীরনগর বিশ্ববিদ্যালয় কোথায় অবস্থিত?
    a: "জাহাঙ্গীরনগর বিশ্ববিদ্যালয় ঢাকা জেলার সাভারে, ঠিকানা সাভার, ঢাকা-১৩৪২।"

