detail:
  open: স্প্রিং ২০২৬–২৭ সেমিস্টারের অনলাইন আবেদন ১৮ অক্টোবর ২০২৬ থেকে শুরু হয়েছে।
  close: আবেদনের শেষ সময় ২৩ নভেম্বর ২০২৬ দুপুর ২টা, ফি জমা ২৪ নভেম্বর দুপুর ২টা পর্যন্ত।
  exam: লিখিত ভর্তি পরীক্ষা ২৬ নভেম্বর ২০২৬ দুপুর ১২টায় ক্যাম্পাসে, ভাইভা ৩ ডিসেম্বর।
  elig: SSC ও HSC মিলিয়ে GPA ৫.০০, প্রতিটিতে ২.৫০; ইঞ্জিনিয়ারিং ও CSE-তে HSC গণিত লাগবে।
  app_fee: AIUB-তে স্নাতক ভর্তির আবেদন ফি ১,০০০ টাকা, যা ফেরতযোগ্য নয় (অফিসিয়াল বিজ্ঞপ্তি)।
  admission_fee: এককালীন ভর্তি ফি ২৫,০০০ টাকা ও ভেরিফিকেশন ফি ২,০০০ টাকা (ফল ২০২৬–২৭ থেকে)।
  cost: আমাদের হিসাবে EEE-তে মোট প্রায় ১২.৩৭ লাখ ও CSE-তে ১৩.৮৫ লাখ টাকা, ওয়েভার ছাড়া।
  rank: QS ওয়ার্ল্ড র‍্যাংকিং ২০২৭-এ ১৪০১+ ব্যান্ডে; দেশে বেসরকারিতে ৪র্থ, সব মিলিয়ে ৬ষ্ঠ।
  classes: নতুন শিক্ষার্থীদের ক্লাস শুরু ২৪ জানুয়ারি ২০২৭ (সম্ভাব্য), অফিসিয়াল বিজ্ঞপ্তি অনুযায়ী।
  programs: পাঁচ অনুষদে ১৬টি স্নাতক প্রোগ্রাম; CSE, ডেটা সায়েন্স, EEE, আর্কিটেকচার, BBA, আইনসহ।
quick:
  open: ১৮ অক্টোবর ২০২৬
  close: ২৩ নভেম্বর ২০২৬, দুপুর ২টা
  exam: ২৬ নভেম্বর ২০২৬, দুপুর ১২টা
  elig: মোট GPA ৫.০০ (প্রতিটিতে ২.৫০)
  app_fee: ১,০০০ টাকা
  admission_fee: ২৫,০০০ টাকা
  cost: ১২.৩৭–১৩.৮৫ লাখ (EEE/CSE, আমাদের হিসাব)
  rank: "QS ২০২৭: ১৪০১+, দেশে ৬ষ্ঠ"
  classes: ২৪ জানুয়ারি ২০২৭ (সম্ভাব্য)
cost_note: AIUB শুধু প্রতি ক্রেডিট ফি প্রকাশ করে, তাই CSE ও EEE-র মোট খরচ আমরা হিসাব করেছি — মোট ক্রেডিট × প্রতি ক্রেডিট ফি (CSE ৮,৫০০ টাকা, EEE ৭,৫০০ টাকা) + ভর্তি ফি ২৫,০০০ + ভেরিফিকেশন ফি ২,০০০ + ৮ সেমিস্টারে প্রতি সেমিস্টারে স্টুডেন্ট অ্যাক্টিভিটিজ ও ফ্যাসিলিটিজ ফি ১২,৫০০ টাকা। কারিকুলাম অনুযায়ী ল্যাব ফি (কম্পিউটার/ল্যাঙ্গুয়েজ ল্যাব ২,৫০০, সায়েন্স ল্যাব ২,০০০ টাকা ইত্যাদি) ও ওয়েভার ধরা হয়নি, তাই আসল খরচ কিছুটা বেশি হতে পারে। অন্য প্রোগ্রামের প্রতি ক্রেডিট ফি অফিসিয়াল টিউশন ফি পাতায় আছে।

about: আমেরিকান ইন্টারন্যাশনাল ইউনিভার্সিটি-বাংলাদেশ (AIUB) ১৯৯৪ সালে ড. আনোয়ারুল আবেদীন প্রতিষ্ঠা করেন; ৬ নভেম্বর ১৯৯৫ সরকারের প্রাথমিক অনুমোদন এবং ২৫ অক্টোবর ২০২৩ স্থায়ী অনুমোদন পায়। ঢাকার খিলক্ষেতের কুড়াতলীতে এর ক্যাম্পাস। আর্টস ও সোশ্যাল সায়েন্সেস, বিজনেস, ইঞ্জিনিয়ারিং, হেলথ ও লাইফ সায়েন্সেস এবং সায়েন্স ও টেকনোলজি — পাঁচটি অনুষদে স্নাতক প্রোগ্রাম আছে।
good:
  - সরকারের স্থায়ী অনুমোদনপ্রাপ্ত (২০২৩)
  - স্নাতক ভর্তিতে ন্যূনতম GPA শর্ত তুলনামূলক সহজ (SSC ও HSC মিলিয়ে ৫.০০, প্রতিটিতে কমপক্ষে ২.৫০)
  - আবেদন ফি ১,০০০ টাকা
  - QS ওয়ার্ল্ড র‍্যাংকিং ২০২৭-এ দেশে বেসরকারিতে ৪র্থ
think:
  - প্রতি ক্রেডিট ফি প্রোগ্রামভেদে ৫,০০০ থেকে ৮,৫০০ টাকা; CSE-তে খরচ বেশি
  - মেধাবৃত্তি ও ওয়েভারের শতাংশ নির্দিষ্ট করে প্রকাশিত নয়, কমিটি ঠিক করে

faq:
  - q: AIUB ভর্তি পরীক্ষা কবে?
    a: "স্প্রিং ২০২৬–২৭ সেমিস্টারের লিখিত ভর্তি পরীক্ষা ২৬ নভেম্বর ২০২৬ দুপুর ১২টায় ক্যাম্পাসে। লিখিত ফল ৩০ নভেম্বর, ভাইভা ৩ ডিসেম্বর এবং চূড়ান্ত ফল ৭ ডিসেম্বর ২০২৬।"
  - q: AIUB-তে আবেদনের শেষ তারিখ কবে?
    a: "অনলাইন আবেদন ১৮ অক্টোবর ২০২৬ শুরু হয়েছে, ফর্ম জমার শেষ সময় ২৩ নভেম্বর ২০২৬ দুপুর ২টা এবং আবেদন ফি ১,০০০ টাকা জমার শেষ সময় ২৪ নভেম্বর দুপুর ২টা।"
  - q: AIUB-তে ভর্তি হতে কত জিপিএ লাগে?
    a: "বেশিরভাগ স্নাতক প্রোগ্রামে SSC ও HSC মিলিয়ে GPA ৫.০০, প্রতিটিতে কমপক্ষে ২.৫০। ইঞ্জিনিয়ারিং, আর্কিটেকচার ও CSE-তে HSC-তে গণিত লাগবে; বি.ফার্ম-এ মোট ৮.০০ ও প্রতিটিতে ৩.৫০।"
  - q: AIUB-তে ভর্তি ফি কত?
    a: "এককালীন ভর্তি ফি ২৫,০০০ টাকা ও ভেরিফিকেশন ফি ২,০০০ টাকা। এর বাইরে প্রতি সেমিস্টারে স্টুডেন্ট অ্যাক্টিভিটিজ ও ফ্যাসিলিটিজ ফি ১২,৫০০ টাকা এবং প্রোগ্রামভেদে প্রতি ক্রেডিট ৫,০০০–৮,৫০০ টাকা।"
  - q: AIUB-তে CSE পড়তে মোট কত খরচ?
    a: "প্রতি ক্রেডিট ৮,৫০০ টাকা ধরে ১৪৮ ক্রেডিটের CSE-তে আমাদের হিসাবে মোট প্রায় ১৩,৮৫,০০০ টাকা (ভর্তি, ভেরিফিকেশন ও ৮ সেমিস্টারের অ্যাক্টিভিটি ফিসহ), ল্যাব ফি ও ওয়েভার ছাড়া।"
  - q: AIUB কোথায় অবস্থিত?
    a: "ঢাকার খিলক্ষেতের কুড়াতলীতে, ৪০৮/১ (পুরাতন কেএ ৬৬/১), ঢাকা-১২২৯ ঠিকানায় AIUB-এর স্থায়ী ক্যাম্পাস।"

