detail:
  open: জানুয়ারি ২০২৬ সেশন থেকে ইউজিসি পরবর্তী নির্দেশ না দেওয়া পর্যন্ত নতুন ভর্তি বন্ধ রেখেছে।
  close: নতুন ভর্তি বন্ধ থাকায় আবেদনের কোনো শেষ তারিখ নেই; চালু হলে ফোনে জেনে নিন।
  elig: স্নাতকে এসএসসি ও এইচএসসি দুটোতেই জিপিএ ২.৫০, বা দুটো মিলিয়ে ৬.০০ লাগে।
  rank: uniRank-এর বাংলাদেশ তালিকায় গ্লোবাল ইউনিভার্সিটি বাংলাদেশ ১৫২তম অবস্থানে আছে।
  classes: "বছরে তিন সেমিস্টার: স্প্রিং (জানুয়ারি–এপ্রিল), সামার (মে–আগস্ট), ফল (সেপ্টেম্বর–ডিসেম্বর)।"
  programs: আইন, সিএসই, ইইই, ইংরেজি, লাইব্রেরি সায়েন্স, বিবিএ, এমবিএ ও ইএমবিএ পড়ানো হয়।
