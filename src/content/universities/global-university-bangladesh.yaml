  requirement: "স্নাতকে এসএসসি ও এইচএসসি দুটোতেই জিপিএ ২.৫০ (বা দ্বিতীয় বিভাগ), অথবা যেকোনো একটিতে কমপক্ষে ২.০০ এবং দুটো মিলিয়ে ৬.০০। সিএসই-তে এসএসসি ও এইচএসসিতে পদার্থ, রসায়ন ও গণিত লাগে। O Level-এ ৫ বিষয়ে গড় ২.৫০ ও A Level-এ ২ বিষয়ে গড় ২.০০ হলেও চলে। পড়াশোনায় দুই বছরের বেশি বিরতি চলে না। এলএলএম-এ এলএলবি (অনার্স), এমবিএ-তে স্নাতক লাগে।"
  steps:
    - title: আগে নিশ্চিত হোন
