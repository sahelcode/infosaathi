about: গ্লোবাল ইউনিভার্সিটি বাংলাদেশ বরিশাল বিভাগের প্রথম বেসরকারি বিশ্ববিদ্যালয়। ২০১৩ সালে ইউজিসির অনুমোদন পায় এবং ২০১৫ সালে বেসরকারি বিশ্ববিদ্যালয় আইন ২০১০-এর অধীনে চালু হয়। আইন, বিজ্ঞান ও প্রযুক্তি, কলা ও সামাজিক বিজ্ঞান এবং ব্যবসায় প্রশাসন অনুষদ আছে। তদন্ত কমিটির সুপারিশে ইউজিসি জানুয়ারি ২০২৬ সেশন থেকে নতুন শিক্ষার্থী ভর্তি বন্ধ করেছে।
good:
  - বরিশাল শহরের নথুল্লাবাদে, শহরের মধ্যেই ক্লাস
  - আইন (এলএলবি ও এলএলএম) পড়ার সুযোগ
  - বর্তমান শিক্ষার্থীদের ক্লাস ও পরীক্ষা স্বাভাবিকভাবে চলছে
think:
  - ইউজিসি জানুয়ারি ২০২৬ সেশন থেকে নতুন ভর্তি বন্ধ রেখেছে; ভর্তির আগে অবশ্যই নিশ্চিত হোন
  - ইউজিসি প্রয়োজনীয় শিক্ষক, কর্মকর্তা ও ল্যাব সুবিধা নিশ্চিত করার নির্দেশ দিয়েছে
  - টিউশন ফি ও মোট খরচ অনলাইনে প্রকাশিত নেই

faq:
  - q: গ্লোবাল ইউনিভার্সিটি বাংলাদেশের যোগাযোগ নম্বর কত?
    a: "ভর্তি হেল্পলাইন ০১৭০০৫৬৯০৩০ এবং অফিসের ল্যান্ডফোন ০২৪৭৮৮৬৩৩৩২। ইমেইল info@globaluniversity.edu.bd।"
  - q: গ্লোবাল ইউনিভার্সিটি বাংলাদেশে কি এখন ভর্তি হওয়া যায়?
    a: "না, ইউজিসি জানুয়ারি ২০২৬ সেশন থেকে পরবর্তী নির্দেশ না দেওয়া পর্যন্ত সব প্রোগ্রামে নতুন ভর্তি বন্ধ রেখেছে। বর্তমান শিক্ষার্থীদের পড়াশোনা চলছে। ভর্তি চালু হয়েছে কি না ০১৭০০৫৬৯০৩০ নম্বরে ফোন করে জেনে নিন।"
  - q: গ্লোবাল ইউনিভার্সিটি বাংলাদেশে ভর্তি ফি কত?
    a: "ভর্তি ফি ও টিউশন ফির তালিকা বিশ্ববিদ্যালয় অনলাইনে প্রকাশ করেনি। সঠিক অঙ্ক জানতে ০১৭০০৫৬৯০৩০ নম্বরে ফোন করুন।"
  - q: গ্লোবাল ইউনিভার্সিটি বাংলাদেশে ভর্তি হতে কত জিপিএ লাগে?
    a: "স্নাতকে এসএসসি ও এইচএসসি দুটোতেই জিপিএ ২.৫০ লাগে, অথবা যেকোনো একটিতে ২.০০ ও দুটো মিলিয়ে ৬.০০। সিএসই-তে পদার্থ, রসায়ন ও গণিত থাকতে হয়।"
  - q: গ্লোবাল ইউনিভার্সিটি বাংলাদেশ কোথায়?
    a: "বরিশাল শহরের নথুল্লাবাদে, মল্লিক টাওয়ারে।"
  - q: গ্লোবাল ইউনিভার্সিটি বাংলাদেশে কোন কোন বিষয় পড়ানো হয়?
    a: "স্নাতকে এলএলবি, সিএসই, ইইই, বিবিএ ও ইংরেজি পড়ানো হয়, আছে লাইব্রেরি ও তথ্যবিজ্ঞান। স্নাতকোত্তরে আছে এলএলএম, এমবিএ ও এক্সিকিউটিভ এমবিএ।"
  - q: গ্লোবাল ইউনিভার্সিটি বাংলাদেশ কি ইউজিসি অনুমোদিত?
    a: "হ্যাঁ, ২০১৩ সালে ইউজিসি অনুমোদন দেয়। তবে জানুয়ারি ২০২৬ থেকে ইউজিসি এর নতুন ভর্তি বন্ধ রেখেছে।"

