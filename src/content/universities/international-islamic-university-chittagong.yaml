cost_note: শুধু কুরআনিক সায়েন্সেস ও ইসলামিক স্টাডিজের মোট খরচ অফিসিয়াল ফি পাতায় পাওয়া গেছে (টিউশন ফি মওকুফ; ভর্তি, সেমিস্টার, পরীক্ষা, এস্টাবলিশমেন্ট, ডেভেলপমেন্ট ও অন্যান্য ফি মিলিয়ে)। অন্য প্রোগ্রামের খরচ বিশ্ববিদ্যালয়ের ফি পাতায় দেখে নিন।

