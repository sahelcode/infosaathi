about: ইন্টারন্যাশনাল ইসলামিক ইউনিভার্সিটি চট্টগ্রাম (আইআইইউসি) ১৯৯৫ সালে প্রতিষ্ঠিত চট্টগ্রামের কুমিরায় অবস্থিত একটি বেসরকারি বিশ্ববিদ্যালয়। এখানে ইসলামিক স্টাডিজ, প্রকৌশল, ফার্মেসি, ব্যবসায়, অর্থনীতি, ভাষা ও আইন বিষয়ে স্নাতক ও স্নাতকোত্তর প্রোগ্রাম রয়েছে। ছাত্রীদের জন্য আলাদা ক্যাম্পাস আছে।
good:
  - ছাত্রীদের জন্য আলাদা ক্যাম্পাস
  - SSC ও HSC-তে GPA ৫.০০ থাকলে ভর্তি ফি পুরো মওকুফ
think:
  - বেশিরভাগ প্রোগ্রামের মোট খরচ ওয়েবসাইটে সহজে পাওয়া যায় না; ভর্তি অফিস থেকে নিশ্চিত হোন
  - বছরে নির্দিষ্ট সেমিস্টারে ভর্তি হয়; আবেদনের শেষ তারিখ খেয়াল রাখুন

