cost_note: মোট খরচ অটাম ২০২৬ ভর্তি নির্দেশিকায় আইআইইউসির ছাপানো অঙ্ক, কোনো ওয়েভার ছাড়া। ভর্তির সময় প্রথম কিস্তি দিতে হয়, যেমন CSE-তে ১,১০,৯২৫ টাকা, ইসলামিক স্টাডিজে ৩১,৩২৫ টাকা। ইসলামিক স্টাডিজে টিউশন ফি মওকুফ। ফার্মেসি, BBA (ফিন্যান্স) ও আইনের মোট খরচ নির্দেশিকায় নেই।

