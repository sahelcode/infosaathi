detail:
  open: স্প্রিং ২০২৭ সেমিস্টারের ভর্তি বিজ্ঞপ্তি আইআইইউসি এখনো প্রকাশ করেনি।
  close: গত সেমিস্টারে (অটাম ২০২৬) অনলাইনে আবেদন ও ফি জমার শেষ তারিখ ছিল ২৭ জুলাই ২০২৬।
  exam: গত সেমিস্টারে (অটাম ২০২৬) এমসিকিউ ভর্তি পরীক্ষা হয় ২৯ ও ৩০ জুলাই ২০২৬, সকাল ১০টায়।
  elig: ইঞ্জিনিয়ারিংয়ে SSC ও HSC-তে ৩.০০ করে মোট ৬.৫০; অন্য প্রোগ্রামে ২.৫০ করে মোট ৬.০০।
  app_fee: আইআইইউসিতে স্নাতক ভর্তির আবেদন ফি ১,০০০ টাকা, বিকাশ বা ক্যাম্পাসে জমা দেওয়া যায়।
  admission_fee: ভর্তি ফি বেশিরভাগ প্রোগ্রামে ৩০,০০০ টাকা; ইসলামিক স্টাডিজ ও আরবিতে ১০,০০০ টাকা।
  cost: অটাম ২০২৬-এর হিসাবে মোট খরচ ১,৩৬,০২৫ (আরবি) থেকে ৭,১৭,৭২৫ টাকা (CSE) পর্যন্ত।
  rank: QS ওয়ার্ল্ড র‍্যাংকিং ২০২৭-এর বাংলাদেশি তালিকায় আইআইইউসির নাম নেই।
  programs: ছয় অনুষদে ১৫টি স্নাতক প্রোগ্রাম; CSE, EEE, সিভিল, ফার্মেসি, BBA, আইন, ইসলামিক স্টাডিজসহ।
