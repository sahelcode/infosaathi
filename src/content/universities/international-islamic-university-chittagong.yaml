about: ইন্টারন্যাশনাল ইসলামিক ইউনিভার্সিটি চট্টগ্রাম (আইআইইউসি) ১৯৯৫ সালে প্রতিষ্ঠিত চট্টগ্রামের কুমিরায় অবস্থিত একটি বেসরকারি বিশ্ববিদ্যালয়। এখানে ইসলামিক স্টাডিজ, প্রকৌশল, ফার্মেসি, ব্যবসায়, অর্থনীতি, ভাষা ও আইন বিষয়ে স্নাতক ও স্নাতকোত্তর প্রোগ্রাম রয়েছে। ছাত্রীদের জন্য আলাদা ক্যাম্পাস আছে।
good:
  - ছাত্রীদের জন্য আলাদা ক্যাম্পাস
  - SSC ও HSC-তে GPA ৫.০০ থাকলে ভর্তি ফি পুরো মওকুফ
  - ইসলামিক স্টাডিজে টিউশন ফি নেই, মোট খরচ প্রায় ১.৩৮ লাখ টাকা
  - প্রতিটি প্রোগ্রামের মোট খরচ ভর্তি নির্দেশিকায় ছাপানো থাকে
think:
  - অটাম ২০২৬ নির্দেশিকায় CSE, CCE, EEE, ETE, BBA ও ইংরেজি "Male Only" লেখা; ছাত্রীরা কোন প্রোগ্রামে পড়তে পারে ভর্তি অফিসে জেনে নিন
  - HSC/আলিম ২০২১-এর আগে পাস হলে আবেদন করা যায় না
  - বছরে নির্দিষ্ট সেমিস্টারে ভর্তি হয়; আবেদনের শেষ তারিখ খেয়াল রাখুন

faq:
  - q: আইআইইউসির যোগাযোগ নম্বর ও ভর্তি হটলাইন নাম্বার কী?
    a: "প্রধান নম্বর ০৯৬১৩২৩০৫০৫। ভর্তি তথ্যের জন্য ০১৭২০৪৭৮৬২১ ও ০১৮৯৪৭৯৮৯৯৪, অফিস সময়ে সকাল ৮:৩০ থেকে বিকাল ৪টা পর্যন্ত।"
  - q: আইআইইউসিতে ভর্তি ফি কত?
    a: "ভর্তি ফি বেশিরভাগ প্রোগ্রামে ৩০,০০০ টাকা; কুরআনিক সায়েন্সেস, দাওয়াহ, হাদিস ও আরবিতে ১০,০০০ টাকা। আবেদন ফি আলাদা, ১,০০০ টাকা।"
  - q: আইআইইউসিতে ভর্তি হতে কত জিপিএ লাগে?
    a: "CSE, CCE, EEE ও ETE-তে SSC ও HSC-তে আলাদাভাবে ৩.০০ ও মোট ৬.৫০ লাগে। BBA, অর্থনীতি, ইংরেজি, ইসলামিক স্টাডিজ ও আরবিতে আলাদাভাবে ২.৫০ ও মোট ৬.০০। HSC বা আলিম ২০২১ বা পরে পাস হতে হবে।"
  - q: আইআইইউসিতে CSE পড়তে মোট কত খরচ?
    a: "অটাম ২০২৬ নির্দেশিকা অনুযায়ী CSE-তে মোট ৭,১৭,৭২৫ টাকা, ভর্তির সময় প্রথম কিস্তি ১,১০,৯২৫ টাকা। ওয়েভার পেলে খরচ কমে।"
  - q: আইআইইউসিতে পরবর্তী ভর্তি কবে?
    a: "স্প্রিং ২০২৭ সেমিস্টারের ভর্তি বিজ্ঞপ্তি এখনো আসেনি। গত সেমিস্টারে (অটাম ২০২৬) আবেদনের শেষ তারিখ ছিল ২৭ জুলাই, পরীক্ষা ২৯–৩০ জুলাই ২০২৬।"
  - q: আইআইইউসি কোথায় অবস্থিত?
    a: "আইআইইউসির স্থায়ী ক্যাম্পাস চট্টগ্রামের কুমিরায়, চট্টগ্রাম-৪৩১৮। ছাত্রীদের জন্য আলাদা ক্যাম্পাস আছে।"

