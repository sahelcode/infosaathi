detail:
  open: ২০২৬–২৭ শিক্ষাবর্ষে চবির স্নাতক ভর্তির অনলাইন আবেদন শুরু ১৫ নভেম্বর ২০২৬।
  close: আবেদনের শেষ দিন ১০ ডিসেম্বর ২০২৬; সব ইউনিট ও উপ-ইউনিটে একই সময়।
  exam: ভর্তি পরীক্ষা ২৯ জানুয়ারি থেকে ৮ ফেব্রুয়ারি ২০২৭; প্রথমে C, শেষে D-1 উপ-ইউনিট।
  elig: ২০২৬–২৭-এর জিপিএ জানা যায়নি; গত বছর A ইউনিটে ৭.৭৫, C-তে ৭.৫০, D-তে ৭.০০ লাগত।
  app_fee: ২০২৬–২৭-এর আবেদন ফি এখনো জানা যায়নি; গত বছর প্রতি ইউনিটে ফি ছিল ১,০০০ টাকা।
  seats: গত বছর (২০২৫–২৬) সাত ইউনিট ও উপ-ইউনিটে মোট সাধারণ আসন ছিল ৩,৫৯৭টি।
  competition: গত বছর ২,৩৩,৩২৭ জন আবেদন করেন; আসনপ্রতি প্রায় ৬৫ জন (আমাদের হিসাব)।
  rank: কিউএস (QS) বিশ্ব র‍্যাংকিং ২০২৭-এ বাংলাদেশের ১৩টি বিশ্ববিদ্যালয়ের মধ্যে চবি নেই।
  programs: ৯টি অনুষদে ৪৮টি বিভাগ ও ৬টি ইনস্টিটিউট; ভর্তি হয় চার ইউনিট ও তিন উপ-ইউনিটে।
quick:
