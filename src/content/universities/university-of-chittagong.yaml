about: চট্টগ্রাম বিশ্ববিদ্যালয় ১৯৬৬ সালের ১৮ নভেম্বর যাত্রা শুরু করা একটি সরকারি বিশ্ববিদ্যালয়, চট্টগ্রামের হাটহাজারীতে ২,৩১২.৩২ একরের পাহাড়ি ক্যাম্পাসে অবস্থিত। এখানে ৪৮টি বিভাগ ও ৬টি ইনস্টিটিউটে প্রায় ২৭ হাজার শিক্ষার্থী ও এক হাজারের বেশি শিক্ষক আছেন। স্নাতক প্রথম বর্ষে ভর্তি হয় ইউনিটভিত্তিক নিজস্ব ভর্তি পরীক্ষায়।
good:
  - আয়তনে দেশের সবচেয়ে বড় ক্যাম্পাস, পাহাড় ও বনে ঘেরা
  - ২০২৬–২৭ ভর্তির আবেদন ও পরীক্ষার তারিখ আগেই ঘোষিত
  - মূল চার ইউনিটের পরীক্ষা ঢাকা ও রাজশাহী বিশ্ববিদ্যালয়েও দেওয়া যায়
think:
  - "প্রতিযোগিতা বেশি: গত বছর (২০২৫–২৬) A ইউনিটে ৮৭,৬৯৪ জন ১,০৯৩ আসনে এবং B ইউনিটে ৬৯,২৮৭ জন ৬৯০ আসনে লড়েছেন"
  - শহর থেকে ক্যাম্পাস প্রায় ২২ কিমি দূরে; হলে আসন কম, অনেককে বাইরে থাকতে হয়
  - ২০২৬–২৭-এর আবেদন ফি, আসন ও ন্যূনতম জিপিএ এখনো জানানো হয়নি; আবেদনের আগে admission.cu.ac.bd দেখে নিন

faq:
  - q: চট্টগ্রাম বিশ্ববিদ্যালয়ে ভর্তির আবেদন কবে শুরু?
    a: "২০২৬–২৭ শিক্ষাবর্ষের স্নাতক প্রথম বর্ষের আবেদন ১৫ নভেম্বর ২০২৬ শুরু হয়ে ১০ ডিসেম্বর শেষ হবে। আবেদন করতে হয় admission.cu.ac.bd-এ।"
  - q: চবি ভর্তি পরীক্ষা ২০২৬–২৭ কবে?
    a: "C ইউনিট ২৯ জানুয়ারি, A ইউনিট ৩০ জানুয়ারি, B-1 ৩ ফেব্রুয়ারি, B-2 ৪ ফেব্রুয়ারি, B ইউনিট ৫ ফেব্রুয়ারি, D ইউনিট ৬ ফেব্রুয়ারি এবং D-1 ৮ ফেব্রুয়ারি ২০২৭। মূল চার ইউনিটের পরীক্ষা চবি, ঢাকা ও রাজশাহী বিশ্ববিদ্যালয়ে একসঙ্গে হবে।"
  - q: চট্টগ্রাম বিশ্ববিদ্যালয়ে ভর্তির যোগ্যতা কত জিপিএ?
    a: "২০২৬–২৭-এর ন্যূনতম জিপিএ এখনো জানানো হয়নি। গত বছর (২০২৫–২৬) এসএসসি-এইচএসসি মিলিয়ে A ইউনিটে ৭.৭৫, B ইউনিটে মানবিকের জন্য ৭.০০ ও অন্যদের ৭.৫০, C ইউনিটে ৭.৫০ এবং D ইউনিটে ৭.০০ লাগত।"
  - q: চবি ভর্তির আবেদন ফি কত?
    a: "২০২৬–২৭-এর আবেদন ফি এখনো জানানো হয়নি। গত বছর (২০২৫–২৬) প্রতিটি ইউনিট বা উপ-ইউনিটে প্রসেসিং ফিসহ ১,০০০ টাকা ছিল।"
  - q: চট্টগ্রাম বিশ্ববিদ্যালয়ের আসন সংখ্যা কত?
    a: "২০২৬–২৭-এর আসন এখনো জানা যায়নি। গত বছর (২০২৫–২৬) মোট ৩,৫৯৭টি সাধারণ আসন ছিল: A ১,০৯৩, B ৬৯০, C ৫১০, D ৮৪৯, B-1 ১৩৫, B-2 ২৮০ এবং D-1 ৪০টি।"
  - q: চট্টগ্রাম বিশ্ববিদ্যালয়ের যোগাযোগ নম্বর কী?
    a: "বিশ্ববিদ্যালয়ের পিএবিএক্স নম্বর ০৩১-২৬০৬০০১ (লাইন ২৬০৬০০১ থেকে ২৬০৬০১০), রেজিস্ট্রার অফিসের এক্সটেনশন ৪২০১। রেজিস্ট্রার অফিসের ইমেইল registrarcu66@cu.ac.bd।"
  - q: চট্টগ্রাম বিশ্ববিদ্যালয় কোথায় অবস্থিত?
    a: "চট্টগ্রাম বিশ্ববিদ্যালয় চট্টগ্রামের হাটহাজারী উপজেলার ফতেপুরে, চট্টগ্রাম শহর থেকে প্রায় ২২ কিলোমিটার উত্তরে।"

