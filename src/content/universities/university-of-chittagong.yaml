admission:
  intake: ২০২৬–২৭ শিক্ষাবর্ষ (স্নাতক প্রথম বর্ষ)
  open: 2026-11-15
  close: 2026-12-10
  requirement: "২০২৬–২৭-এর ন্যূনতম জিপিএ এখনো জানা যায়নি। গত বছর (২০২৫–২৬) চতুর্থ বিষয়সহ এসএসসি ও এইচএসসি মিলিয়ে A ইউনিটে ৭.৭৫ (এসএসসিতে কমপক্ষে ৪.০০, এইচএসসিতে ৩.২৫), B ইউনিটে মানবিকের জন্য ৭.০০ ও বিজ্ঞান-ব্যবসায় শিক্ষার জন্য ৭.৫০, C ইউনিটে ৭.৫০ এবং D ইউনিটে ৭.০০ লাগত।"
  exam: "C ইউনিট ২৯ জানুয়ারি, A ইউনিট ৩০ জানুয়ারি, B-1 উপ-ইউনিট ৩ ফেব্রুয়ারি, B-2 উপ-ইউনিট ৪ ফেব্রুয়ারি, B ইউনিট ৫ ফেব্রুয়ারি, D ইউনিট ৬ ফেব্রুয়ারি এবং D-1 উপ-ইউনিট ৮ ফেব্রুয়ারি ২০২৭। A, B, C ও D ইউনিটের পরীক্ষা একই সময়ে চবি, ঢাকা বিশ্ববিদ্যালয় ও রাজশাহী বিশ্ববিদ্যালয় ক্যাম্পাসে; উপ-ইউনিটগুলো শুধু চবি ক্যাম্পাসে।"
  steps:
    - title: অনলাইনে আবেদন
      text: ১৫ নভেম্বর থেকে ১০ ডিসেম্বর ২০২৬ পর্যন্ত admission.cu.ac.bd-এ এসএসসি ও এইচএসসির তথ্য দিয়ে আবেদন।
    - title: আবেদন ফি জমা
      text: গত বছর (২০২৫–২৬) প্রতিটি ইউনিট বা উপ-ইউনিটে ফি ছিল ১,০০০ টাকা (প্রসেসিং ফিসহ), মোবাইল ব্যাংকিংয়ে দেওয়া যেত।
    - title: ভর্তি পরীক্ষা
      text: ২৯ জানুয়ারি থেকে ৮ ফেব্রুয়ারি ২০২৭; মূল চার ইউনিট চট্টগ্রাম, ঢাকা ও রাজশাহীতে, উপ-ইউনিট শুধু চবিতে।
    - title: ফল ও বিষয় বরাদ্দ
      text: ইউনিটভিত্তিক মেধাতালিকা প্রকাশের পর বিষয় পছন্দ, অনলাইনে তথ্য ফরম (SIF) পূরণ ও ভর্তি ফি জমা।
  documents:
    - এসএসসি ও এইচএসসির রোল, রেজিস্ট্রেশন ও বোর্ডের তথ্য
    - নির্ধারিত মাপের রঙিন ছবি ও স্বাক্ষর
    - ভর্তির সময় মূল মার্কশিট ও সনদ

