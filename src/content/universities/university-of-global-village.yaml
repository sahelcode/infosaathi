about: ইউনিভার্সিটি অব গ্লোবাল ভিলেজ (ইউজিভি) বরিশাল শহরের সি অ্যান্ড বি রোডে অবস্থিত একটি বেসরকারি বিশ্ববিদ্যালয়। ২০১৬ সালে সরকার ও ইউজিসি এর অনুমোদন দেয়। ইঞ্জিনিয়ারিং ও টেকনোলজি, বিজনেস ও ইকোনমিক্স, মানবিক ও সামাজিক বিজ্ঞান এবং হেলথ সায়েন্স অনুষদে স্নাতক ও মাস্টার্স প্রোগ্রাম আছে।
good:
  - বরিশাল শহরেই সিএসই, ইইই, সিভিল ও মেকানিক্যাল পড়ার সুযোগ
  - প্রতিটি প্রোগ্রামের মোট খরচ ও জিপিএভিত্তিক ওয়েভার ওয়েবসাইটে প্রকাশিত
  - বছরে দুবার (জানুয়ারি ও জুলাই) ভর্তি
think:
  - ভর্তি পাতায় এসএসসি ও এইচএসসি দুটোতেই জিপিএ ৫.০০ হলে পুরো টিউশন মওকুফের কথা আছে, কিন্তু ফি তালিকায় সর্বোচ্চ ৫০%; ভর্তির আগে ফোনে নিশ্চিত হোন
  - আবেদন ফি ও আসন সংখ্যা অনলাইনে প্রকাশ করা হয়নি

faq:
  - q: ইউনিভার্সিটি অব গ্লোবাল ভিলেজের যোগাযোগ নম্বর কত?
    a: "ভর্তি ও যোগাযোগের জন্য ০১৭৬৩৮৭৭৭৭৭, ০১৮৭৭৭৭৪০২১, ০১৮৭৭৭৭৪০২৭, ০১৮৭৭৭৭৪০৩০ বা ০১৮৭৭৭৭৪০৪০ নম্বরে ফোন করুন। জরুরি প্রয়োজনে ০১৮৭৭৭৭৪০৫০। ইমেইল info@ugv.edu.bd।"
  - q: ইউনিভার্সিটি অব গ্লোবাল ভিলেজের ভর্তি ফি কত?
    a: "স্নাতক ও মাস্টার্সে এককালীন ভর্তি ফি ১৫,০০০ টাকা, সাইবার সিকিউরিটি ডিপ্লোমায় ৫,০০০ টাকা। স্নাতকে ওয়েভার ছাড়া মোট খরচ ৩,০৩,০০০ (বিবিএ, ইংরেজি) থেকে ৪,৭৫,৮০০ টাকা (সিএসই)।"
  - q: ইউনিভার্সিটি অব গ্লোবাল ভিলেজে ভর্তি হতে কত জিপিএ লাগে?
    a: "স্নাতকে এসএসসি ও এইচএসসি দুটোতেই কমপক্ষে জিপিএ ২.৫০ লাগে। একটিতে ২.০০ হলে দুটো মিলিয়ে কমপক্ষে ৬.০০ লাগবে। মুক্তিযোদ্ধার সন্তানদের মিলিয়ে ৫.০০ হলেই চলে।"
  - q: ইউনিভার্সিটি অব গ্লোবাল ভিলেজে ভর্তির শেষ তারিখ কবে?
    a: "উইন্টার সেমিস্টারে ভর্তির শেষ সময় ৩০ ডিসেম্বর, ক্লাস শুরু ১–১০ জানুয়ারি। সামার সেমিস্টারে শেষ সময় ৩০ জুন, ক্লাস ১–১০ জুলাই।"
  - q: ইউনিভার্সিটি অব গ্লোবাল ভিলেজ কোথায়?
    a: "বরিশাল শহরের সি অ্যান্ড বি রোডে (৮৭৪/৩২২ সি অ্যান্ড বি রোড, বরিশাল-৮২০০)।"
  - q: ইউনিভার্সিটি অব গ্লোবাল ভিলেজে কোন কোন বিষয় পড়ানো হয়?
    a: "স্নাতকে সিএসই, ইইই, সিভিল, মেকানিক্যাল, বিবিএ, ইংরেজি ও ইসলামিক স্টাডিজ। মাস্টার্সে এমবিএ, ইএমবিএ, এমএ ইন ইংলিশ, এমএসসি ইন সিএসই ও এমপিএইচ। সাইবার সিকিউরিটিতে ৬ মাসের ডিপ্লোমাও আছে।"
  - q: ইউনিভার্সিটি অব গ্লোবাল ভিলেজ কি UGC অনুমোদিত?
    a: "হ্যাঁ, ২০১৬ সালে সরকার ও ইউজিসি এর অনুমোদন দেয়। এটি বরিশাল বিভাগের প্রথম বেসরকারি বিশ্ববিদ্যালয়।"

