cost_note: মোট খরচ অফিসিয়াল ফি তালিকা অনুযায়ী, ওয়েভার ছাড়া। এতে ১৫,০০০ টাকা ভর্তি ফি ও প্রতি সেমিস্টারের টিউশন ফি ধরা আছে (ডিপ্লোমায় ভর্তি ফি ৫,০০০)। ল্যাব, পরীক্ষা বা রেজিস্ট্রেশন ফি তালিকায় আলাদা করে দেওয়া নেই।

