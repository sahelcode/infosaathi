  close: 2026-12-30
  requirement: "স্নাতকে এসএসসি ও এইচএসসি দুটোতেই কমপক্ষে জিপিএ ২.৫০। একটিতে জিপিএ ২.০০ হলে দুটো মিলিয়ে কমপক্ষে ৬.০০ লাগে। O Level-এ ৫ বিষয়ে জিপিএ ২.৫০ ও A Level-এ ২ বিষয়ে জিপিএ ২.০০ হলেও চলে। মুক্তিযোদ্ধার সন্তানদের দুটো মিলিয়ে জিপিএ ৫.০০ হলেই চলে। মাস্টার্সে স্নাতকে কমপক্ষে জিপিএ ২.০০ (বা তৃতীয় বিভাগ) লাগে।"
