detail:
  open: ওয়েবসাইটে "Admissions are now open" লেখা আছে, উইন্টার সেমিস্টারে ভর্তি চলছে।
  close: উইন্টার সেমিস্টারে ভর্তির শেষ সময় ৩০ ডিসেম্বর, সামারে ৩০ জুন।
  elig: স্নাতকে এসএসসি ও এইচএসসি দুটোতেই কমপক্ষে জিপিএ ২.৫০, বা মিলিয়ে ৬.০০ লাগে।
  admission_fee: স্নাতক ও মাস্টার্সে এককালীন ভর্তি ফি ১৫,০০০ টাকা, ডিপ্লোমায় ৫,০০০ টাকা।
  cost: স্নাতকে মোট খরচ ৩,০৩,০০০ (বিবিএ, ইংরেজি) থেকে ৪,৭৫,৮০০ টাকা (সিএসই), ওয়েভার ছাড়া।
  rank: uniRank-এর বাংলাদেশ তালিকায় ইউনিভার্সিটি অব গ্লোবাল ভিলেজ ১০৯তম অবস্থানে আছে।
  classes: উইন্টার সেমিস্টারের ক্লাস শুরু ১–১০ জানুয়ারি, সামারের ক্লাস ১–১০ জুলাই।
  programs: চার অনুষদে সিএসই, ইইই, সিভিল, মেকানিক্যাল, বিবিএ, ইংরেজিসহ স্নাতক ও মাস্টার্স।
