about: লিডিং ইউনিভার্সিটি ২০০১ সালে প্রতিষ্ঠিত সিলেটের একটি বেসরকারি বিশ্ববিদ্যালয়, যার প্রতিষ্ঠাতা শিল্পপতি রাগীব আলী। ২০১৬ সালের ফেব্রুয়ারি থেকে দক্ষিণ সুরমার রাগিবনগরে স্থায়ী ক্যাম্পাসে কার্যক্রম চলছে। ইঞ্জিনিয়ারিং, আর্কিটেকচার, ব্যবসায় প্রশাসন, আইন ও কলা মিলিয়ে ১০টির বেশি বিভাগ আছে।
good:
  - নিজস্ব স্থায়ী ক্যাম্পাস
  - ফলাফলভিত্তিক সর্বোচ্চ ৬০% টিউশন ওয়েভার
  - ওয়েবসাইটে প্রতিটি প্রোগ্রামের মোট খরচ প্রকাশিত
think:
  - একাধিক ওয়েভারের যোগ্য হলেও শুধু সবচেয়ে বড়টি পাওয়া যায়
  - ফি তালিকায় কোন সেশনের জন্য প্রযোজ্য তা লেখা নেই, ভর্তির আগে অফিসে মিলিয়ে নিন

