detail:
  open: অফিসিয়াল সাইটে "Admission Going On" লেখা আছে, তবে কোন সেমিস্টার তা উল্লেখ নেই।
  close: আবেদনের শেষ তারিখ অফিসিয়াল সাইটে দেওয়া নেই; ভর্তি হটলাইনে ফোন করে জেনে নিন।
  exam: ভর্তি পরীক্ষার তারিখ বা পদ্ধতি লিডিংয়ের অফিসিয়াল সাইটে উল্লেখ নেই।
  elig: স্নাতকে SSC ও HSC দুটোতেই GPA ২.৫০ অথবা মোট ৬.০০, কোনো বিষয়ে ২.০০-এর কম নয়।
  app_fee: স্নাতক ও স্নাতকোত্তর দুই ক্ষেত্রেই আবেদন ফর্মের দাম ১,০০০ টাকা (অফিসিয়াল সাইট)।
  admission_fee: স্নাতকে এককালীন ভর্তি ফি ২২,০০০ টাকা, স্নাতকোত্তরে ১০,০০০ টাকা।
  cost: স্নাতকে মোট খরচ ১,৬৫,৭৬৪ (ইসলামিক স্টাডিজ) থেকে ৭,০১,১৬৪ টাকা, ওয়েভার ছাড়া।
  programs: স্নাতকে ১০টি ও স্নাতকোত্তরে ৮টি প্রোগ্রাম; সিএসই, ইইই, আর্কিটেকচার, বিবিএ, আইনসহ।
quick:
  open: চলছে (সেমিস্টার উল্লেখ নেই)
  elig: GPA ২.৫০ করে বা মোট ৬.০০
  app_fee: ১,০০০ টাকা
  admission_fee: ২২,০০০ টাকা (স্নাতক)
  cost: ১.৬৬–৭.০১ লাখ টাকা (স্নাতক)
cost_note: মোট খরচ অফিসিয়াল টিউশন ফি পাতায় ছাপানো মোট অঙ্ক (ভর্তি ফি, ক্রেডিট ফি, সেমিস্টার, ট্রান্সপোর্ট, ল্যাব, অ্যাক্টিভিটি ও লাইব্রেরি ফিসহ), কোনো ওয়েভার ছাড়া। স্নাতকে ভর্তি ফি ২২,০০০ টাকা (এককালীন)।

