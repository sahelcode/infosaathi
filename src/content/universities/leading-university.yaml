about: লিডিং ইউনিভার্সিটি ২০০১ সালে প্রতিষ্ঠিত সিলেটের একটি বেসরকারি বিশ্ববিদ্যালয়, যার প্রতিষ্ঠাতা শিল্পপতি রাগীব আলী। ২০১৬ সালের ফেব্রুয়ারি থেকে দক্ষিণ সুরমার রাগিবনগরে স্থায়ী ক্যাম্পাসে কার্যক্রম চলছে। ইঞ্জিনিয়ারিং, আর্কিটেকচার, ব্যবসায় প্রশাসন, আইন ও কলা মিলিয়ে ১০টির বেশি বিভাগ আছে।
good:
  - নিজস্ব স্থায়ী ক্যাম্পাস
  - ফলাফলভিত্তিক সর্বোচ্চ ৬০% টিউশন ওয়েভার
  - ওয়েবসাইটে প্রতিটি প্রোগ্রামের মোট খরচ প্রকাশিত
think:
  - একাধিক ওয়েভারের যোগ্য হলেও শুধু সবচেয়ে বড়টি পাওয়া যায়
  - ফি তালিকায় কোন সেশনের জন্য প্রযোজ্য তা লেখা নেই, ভর্তির আগে অফিসে মিলিয়ে নিন

faq:
  - q: লিডিং ইউনিভার্সিটিতে ভর্তি হতে কত জিপিএ লাগে?
    a: "স্নাতকে SSC ও HSC দুটোতেই কমপক্ষে GPA ২.৫০ অথবা দুটো মিলিয়ে ৬.০০ লাগে, কোনো পরীক্ষায় ২.০০-এর কম চলবে না। O/A Level হলে O Level-এ ৫টি ও A Level-এ ২টি বিষয়, অন্তত ৪টিতে B গ্রেড।"
  - q: লিডিং ইউনিভার্সিটির ভর্তি ফি কত?
    a: "অফিসিয়াল ফি তালিকা অনুযায়ী স্নাতকে এককালীন ভর্তি ফি ২২,০০০ টাকা এবং স্নাতকোত্তরে ১০,০০০ টাকা। আবেদন ফর্মের দাম ১,০০০ টাকা।"
  - q: লিডিং ইউনিভার্সিটিতে সিএসই পড়তে মোট কত খরচ?
    a: "অফিসিয়াল টিউশন ফি পাতায় ১৬০ ক্রেডিটের বিএসসি ইন সিএসই-র মোট খরচ ৫,১৫,৭৬৪ টাকা, কোনো ওয়েভার ছাড়া। ফলাফলভিত্তিক সর্বোচ্চ ৬০% ওয়েভার আছে।"
  - q: লিডিং ইউনিভার্সিটিতে এখন ভর্তি চলছে কি?
    a: "অফিসিয়াল সাইটে \"Admission Going On\" লেখা আছে, তবে সেমিস্টারের নাম ও আবেদনের শেষ তারিখ দেওয়া নেই। ভর্তি হটলাইন ০১৩১৮-২৪৭১৯৪ বা ০১৭৫৫-৮৪১৮৬৪ নম্বরে ফোন করে নিশ্চিত হোন।"
  - q: লিডিং ইউনিভার্সিটি কোথায়?
    a: "সিলেটের দক্ষিণ সুরমায় কামাল বাজারের কাছে রাগিবনগরে, বিশ্ববিদ্যালয়ের নিজস্ব স্থায়ী ক্যাম্পাসে।"
  - q: লিডিং ইউনিভার্সিটির যোগাযোগ নম্বর ও ভর্তি হটলাইন নাম্বার কী?
    a: "ভর্তি হটলাইন ০১৩১৮২৪৭১৯৪ ও ০১৭৫৫৮৪১৮৬৪, প্রধান নম্বর (PABX) ০১৩১৩০৮৪৪৯৯; ভর্তি শাখার এক্সটেনশন ১৭০। সূত্র: বিশ্ববিদ্যালয়ের অফিসিয়াল যোগাযোগ পাতা।"

