cost_note: মোট খরচ NSU-র অফিসিয়াল টিউশন ফি তালিকার আনুমানিক হিসাব (প্রতি ক্রেডিট ৮,০০০ টাকা, স্প্রিং ২০২৬ থেকে প্রযোজ্য, সাথে প্রতি সেমিস্টারের ফি)। এর বাইরে ভর্তির সময় একবার ভর্তি ফি ২৫,০০০ টাকা, ফেরতযোগ্য কশন মানি ১০,০০০ টাকা ও RFID কার্ড ১,০০০ টাকা লাগে। ওয়েভার ধরা হয়নি; কোর্স রিটেক বা দেরিতে শেষ করলে খরচ বাড়ে।

