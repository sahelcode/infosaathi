  exam: আড়াই ঘণ্টার লিখিত ভর্তি পরীক্ষা (ইংরেজি, গাণিতিক দক্ষতা, রিডিং কম্প্রিহেনশন ও রচনা), ২৮ নভেম্বর ২০২৬ (সম্ভাব্য); আর্কিটেকচারে অতিরিক্ত ৩০ মিনিটের ড্রয়িং পরীক্ষা
  app_fee: 2000
