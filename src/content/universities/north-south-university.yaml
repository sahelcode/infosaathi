    - { title: আবেদন ফি, text: ব্যাংকে ২,০০০ টাকা বা বিকাশে ২,০৩১ টাকা }
    - { title: ভর্তি পরীক্ষা, text: লিখিত পরীক্ষায় অংশ নেওয়া, ফল পরে জানানো হবে }
  documents: [SSC/O লেভেল ও HSC/A লেভেলের মার্কশিট ও সনদ, পাসপোর্ট সাইজ ছবি, শিক্ষার্থী ও অভিভাবকের NID/পাসপোর্টের কপি]

