about: নর্থ সাউথ ইউনিভার্সিটি ১৯৯২ সালে বেসরকারি বিশ্ববিদ্যালয় আইন-১৯৯২-এর অধীনে প্রতিষ্ঠিত বাংলাদেশের প্রথম বেসরকারি বিশ্ববিদ্যালয়, আনুষ্ঠানিক উদ্বোধন ১০ ফেব্রুয়ারি ১৯৯৩। ঢাকার বসুন্ধরা আবাসিক এলাকায় এর ক্যাম্পাস। চারটি স্কুলের অধীনে আর্কিটেকচার, ইঞ্জিনিয়ারিং, বিজনেস, ফার্মেসি, আইনসহ বিভিন্ন বিষয়ে স্নাতক প্রোগ্রাম রয়েছে।
good:
  - দেশের প্রথম বেসরকারি বিশ্ববিদ্যালয়, প্রোগ্রামের সংখ্যা অনেক
  - প্রোগ্রামভিত্তিক আনুমানিক মোট খরচ অফিসিয়ালি প্রকাশিত
  - ভর্তি পরীক্ষায় প্রথম ১০ জনের জন্য পূর্ণ টিউশন ওয়েভার
think:
  - খরচ বেশি; বেশিরভাগ প্রোগ্রামে মোট ১০ লাখ টাকার ওপরে
  - ভর্তির জন্য SSC ও HSC দুটোতেই ভালো GPA ও লিখিত পরীক্ষা লাগে

