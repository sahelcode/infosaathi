detail:
  open: খুবির ২০২৬–২৭ আবেদনের তারিখ এখনো জানানো হয়নি; গত বছর আবেদন শুরু হয়েছিল ৭ নভেম্বর।
  close: খুবির ২০২৬–২৭ আবেদনের শেষ দিন এখনো জানানো হয়নি; গত বছর শেষ দিন ছিল ২৭ নভেম্বর।
  exam: খুবির ২০২৬–২৭ ভর্তি পরীক্ষা সি ও ডি ইউনিট ১৭ ডিসেম্বর, এ ও বি ইউনিট ১৮ ডিসেম্বর।
  elig: গত বছর (২০২৫–২৬) এ ও বি ইউনিটে মোট জিপিএ ৮.০০, সি ইউনিটে ৭.০০ লাগত; এবারেরটা আসেনি।
  app_fee: ২০২৬–২৭-এর আবেদন ফি এখনো জানানো হয়নি; ২০২৪–২৫-এ এ, বি, সি ১,০০০ ও ডি ৭০০ টাকা ছিল।
  seats: গত বছর (২০২৫–২৬) খুবিতে চার ইউনিটে মোট ১,১০৯টি আসন ছিল; এবারের আসন এখনো জানা যায়নি।
  competition: গত বছর ১,০৮,২৬৬ জন আবেদন করেন ১,১০৯ আসনে; আসনপ্রতি প্রায় ৯৮ জন (আমাদের হিসাব)।
  classes: গত বছর (২০২৫–২৬) প্রথম বর্ষের ওরিয়েন্টেশন ও ক্লাস শুরু হয় ২৫ জানুয়ারি ২০২৬।
  rank: কিউএস (QS) বিশ্ব র‍্যাংকিং ২০২৭-এ বাংলাদেশের বিশ্ববিদ্যালয়ের তালিকায় খুলনা বিশ্ববিদ্যালয় নেই।
  programs: ৮টি স্কুলের ২৯টি ডিসিপ্লিনে স্নাতক; এ, বি, সি ও ডি চার ইউনিটে ভর্তি পরীক্ষা হয়।
