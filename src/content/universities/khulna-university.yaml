admission:
  intake: ২০২৬–২৭ শিক্ষাবর্ষ (স্নাতক প্রথম বর্ষ)
  requirement: "২০২৬–২৭-এর যোগ্যতা এখনো জানানো হয়নি। গত বছর (২০২৫–২৬) এ ও বি ইউনিটে এসএসসি ও এইচএসসি মিলিয়ে জিপিএ ৮.০০, সি ইউনিটে ৭.০০ এবং ডি ইউনিটে দুই পরীক্ষাতেই আলাদাভাবে ৩.৫০ (ইংরেজিতে ৩.০০) লাগত।"
  exam: "সি ও ডি ইউনিট ১৭ ডিসেম্বর এবং এ ও বি ইউনিট ১৮ ডিসেম্বর ২০২৬।"
  steps:
    - title: অনলাইনে আবেদন
      text: admission.ku.ac.bd-এ আবেদন। ২০২৬–২৭-এর তারিখ এখনো জানানো হয়নি; গত বছর আবেদন চলেছিল ৭ থেকে ২৭ নভেম্বর।
    - title: ভর্তি পরীক্ষা
      text: সি ও ডি ইউনিট ১৭ ডিসেম্বর, এ ও বি ইউনিট ১৮ ডিসেম্বর ২০২৬। গত বছর এ, বি ও সি ইউনিটে ৬০ নম্বরের এমসিকিউ ও ৪০ নম্বরের লিখিত ছিল।
    - title: আঁকার পরীক্ষা
      text: স্থাপত্য ও চারুকলায় ভর্তির জন্য লিখিত পরীক্ষার সঙ্গে আলাদা আঁকার পরীক্ষা হয়।
    - title: ফল ও ভর্তি
      text: ইউনিটভিত্তিক মেধাতালিকা প্রকাশের পর ডিসিপ্লিন বরাদ্দ ও ভর্তি। গত বছর ফল দেওয়া হয় ৩০ ডিসেম্বর।
  documents:
    - এসএসসি ও এইচএসসির রোল, রেজিস্ট্রেশন ও বোর্ডের তথ্য
    - আবেদনের জন্য সাম্প্রতিক রঙিন ছবি
    - ভর্তির সময় মূল মার্কশিট ও সনদ

