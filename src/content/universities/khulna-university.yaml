about: খুলনা বিশ্ববিদ্যালয় ১৯৯০ সালের আইনে গঠিত সরকারি বিশ্ববিদ্যালয়, ১৯৯১ সালে চারটি ডিসিপ্লিন ও ৮০ জন শিক্ষার্থী নিয়ে যাত্রা শুরু করে। খুলনার গল্লামারীতে ময়ূর নদীর পাশের ক্যাম্পাসে এখন ৮টি স্কুলের ২৯টি ডিসিপ্লিনে ৮,২৩১ জন শিক্ষার্থী ও ৫২০ জন শিক্ষক আছেন। স্নাতক প্রথম বর্ষে ভর্তি হয় এ, বি, সি ও ডি ইউনিটের নিজস্ব ভর্তি পরীক্ষায়।
