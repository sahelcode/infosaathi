  - বিশ্ববিদ্যালয়ের দাবি, শুরু থেকে কোনো সেশনজট নেই
  - স্থাপত্য, নগর পরিকল্পনা, ফরেস্ট্রি, মেরিন ফিশারিজের মতো বিশেষ বিষয় আছে
