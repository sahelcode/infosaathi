faq:
  - q: খুলনা বিশ্ববিদ্যালয় ভর্তি পরীক্ষা ২০২৬–২৭ কবে?
    a: "সি ও ডি ইউনিটের পরীক্ষা ১৭ ডিসেম্বর এবং এ ও বি ইউনিটের পরীক্ষা ১৮ ডিসেম্বর ২০২৬।"
  - q: খুবিতে ভর্তির আবেদন কবে শুরু?
    a: "২০২৬–২৭-এর আবেদনের তারিখ এখনো জানানো হয়নি। গত বছর (২০২৫–২৬) আবেদন চলেছিল ৭ থেকে ২৭ নভেম্বর, admission.ku.ac.bd-এ।"
  - q: খুলনা বিশ্ববিদ্যালয়ে ভর্তির যোগ্যতা কত জিপিএ?
    a: "২০২৬–২৭-এর যোগ্যতা এখনো আসেনি। গত বছর এ ও বি ইউনিটে এসএসসি ও এইচএসসি মিলিয়ে জিপিএ ৮.০০, সি ইউনিটে ৭.০০ এবং ডি ইউনিটে দুই পরীক্ষাতেই আলাদাভাবে ৩.৫০ (ইংরেজিতে ৩.০০) লাগত।"
  - q: খুবি ভর্তির আবেদন ফি কত?
    a: "২০২৬–২৭-এর আবেদন ফি এখনো জানানো হয়নি। ২০২৪–২৫-এ এ, বি ও সি ইউনিটে ১,০০০ টাকা এবং ডি ইউনিটে ৭০০ টাকা ছিল; স্থাপত্য ও চারুকলায় আরও ২০০ টাকা লাগত।"
  - q: খুলনা বিশ্ববিদ্যালয়ের আসন সংখ্যা কত?
    a: "গত বছর (২০২৫–২৬) মোট ১,১০৯টি আসন ছিল। ২০২৬–২৭-এর আসন এখনো জানানো হয়নি।"
  - q: খুলনা বিশ্ববিদ্যালয়ের যোগাযোগ নম্বর কী?
    a: "রেজিস্ট্রার অফিসের ফোন নম্বর ০২৪৭৭৭৩৪১৪০। ইমেইল office@registrar.ku.ac.bd।"
  - q: খুলনা বিশ্ববিদ্যালয় কোথায় অবস্থিত?
    a: "খুলনা বিশ্ববিদ্যালয় খুলনা শহরের গল্লামারীতে, খুলনা-চুকনগর-সাতক্ষীরা সড়কের পাশে, ময়ূর নদীর তীরে। ঠিকানা খুলনা-৯২০৮।"

