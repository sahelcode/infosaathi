detail:
  open: ২০২৬–২৭ শিক্ষাবর্ষে ঢাবির স্নাতক ভর্তির আবেদন শুরু ১১ নভেম্বর দুপুর ১২টায়।
  close: আবেদনের শেষ সময় ২৫ নভেম্বর ২০২৬ রাত ১১টা ৫৯ মিনিট; পাঁচ ইউনিটেই একই সময়।
  exam: ভর্তি পরীক্ষা ৫ থেকে ২৬ ডিসেম্বর ২০২৬; প্রথমে আইবিএ, শেষে ব্যবসায় শিক্ষা ইউনিট।
  elig: এসএসসি-এইচএসসি মিলিয়ে বিজ্ঞানে জিপিএ ৮.০, কলা ও ব্যবসায় ৭.৫, চারুকলায় ৬.৫।
  app_fee: ২০২৬–২৭-এর আবেদন ফি এখনো জানা যায়নি; গত বছর (২০২৫–২৬) ফি ছিল ১,০৫০ টাকা।
  seats: গত বছর আসন ছিল কলা ইউনিটে ২,৯৩৪, বিজ্ঞানে ১,৮৯১ ও ব্যবসায় শিক্ষায় ১,০৫০টি।
  competition: গত বছর আসনপ্রতি বিজ্ঞানে প্রায় ৬০, কলায় ৩৭, ব্যবসায় ৩২ জন (আমাদের হিসাব)।
  rank: কিউএস (QS) বিশ্ব র‍্যাংকিং ২০২৭-এ ঢাকা বিশ্ববিদ্যালয় যৌথভাবে ৬০০তম, দেশে প্রথম।
  classes: ২০২৬–২৭ শিক্ষাবর্ষের স্নাতক প্রথম বর্ষের ক্লাস শুরু হবে ২৮ মার্চ ২০২৭ থেকে।
  programs: ১৩টি অনুষদে ৮৪টি বিভাগ ও ১৩টি ইনস্টিটিউট; ভর্তি হয় পাঁচটি ইউনিটের পরীক্ষায়।
quick:
  open: ১১ নভেম্বর ২০২৬
  close: ২৫ নভেম্বর ২০২৬
  exam: ৫–২৬ ডিসেম্বর ২০২৬
  elig: বিজ্ঞান ৮.০ · কলা ও ব্যবসায় ৭.৫
  app_fee: ১,০৫০ টাকা (গত বছর)
  seats: ৫,৮৭৫টি, ৩ ইউনিটে (গত বছর)
  competition: ২,৫৫,৮৭৭ জন আবেদন · গত বছর
  rank: "QS ২০২৭: ৬০০"
  classes: ২৮ মার্চ ২০২৭
about: ঢাকা বিশ্ববিদ্যালয় ১৯২১ সালে প্রতিষ্ঠিত দেশের সবচেয়ে পুরোনো সরকারি বিশ্ববিদ্যালয়, ঢাকার রমনায় অবস্থিত। এখানে ১৩টি অনুষদ, ৮৪টি বিভাগ ও ১৩টি ইনস্টিটিউটে প্রায় ৩৭ হাজার শিক্ষার্থী ও প্রায় ২ হাজার শিক্ষক আছেন। স্নাতক প্রথম বর্ষে ভর্তি হয় পাঁচটি ইউনিটের নিজস্ব ভর্তি পরীক্ষায়।
good:
  - দেশের সবচেয়ে পুরোনো বিশ্ববিদ্যালয়; কিউএস ২০২৭-এ দেশে প্রথম
  - ২০২৬–২৭ ভর্তির আবেদন, পরীক্ষা ও ক্লাস শুরুর তারিখ আগেই ঘোষিত
  - বিজ্ঞান, কলা ও ব্যবসায় শিক্ষা ইউনিটের পরীক্ষা ৮টি বিভাগীয় কেন্দ্রে দেওয়া যায়
think:
  - "প্রতিযোগিতা খুব বেশি: গত বছর (২০২৫–২৬) বিজ্ঞানে ১,১৪,১১৪ জন ১,৮৯১ আসনে, কলায় ১,০৭,৭০১ জন ২,৯৩৪ আসনে এবং ব্যবসায় শিক্ষায় ৩৪,০৬২ জন ১,০৫০ আসনে লড়েছেন"
  - ২০২৬–২৭-এর আবেদন ফি ও আসন সংখ্যা এখনো জানা যায়নি; আবেদনের আগে ভর্তি পোর্টাল দেখে নিন
  - চারুকলা ও আইবিএর পরীক্ষা শুধু ঢাকায় হয়

faq:
  - q: ঢাকা বিশ্ববিদ্যালয়ে ভর্তির আবেদন কবে শুরু?
    a: "২০২৬–২৭ শিক্ষাবর্ষের স্নাতক প্রথম বর্ষের আবেদন ১১ নভেম্বর ২০২৬ দুপুর ১২টায় শুরু হয়ে ২৫ নভেম্বর রাত ১১টা ৫৯ মিনিটে শেষ হবে। আবেদন করতে হয় admission.eis.du.ac.bd-এ।"
  - q: ঢাবি ভর্তি পরীক্ষা ২০২৬–২৭ কবে?
    a: "আইবিএ ইউনিট ৫ ডিসেম্বর, বিজ্ঞান ১২ ডিসেম্বর, কলা-আইন-সামাজিক বিজ্ঞান ১৯ ডিসেম্বর, চারুকলা ২২ ডিসেম্বর এবং ব্যবসায় শিক্ষা ইউনিট ২৬ ডিসেম্বর ২০২৬।"
  - q: ঢাকা বিশ্ববিদ্যালয়ে ভর্তির যোগ্যতা কত জিপিএ?
    a: "চতুর্থ বিষয়সহ এসএসসি ও এইচএসসি মিলিয়ে বিজ্ঞান ইউনিটে ন্যূনতম ৮.০ (প্রতিটিতে ৩.৫), কলা-আইন-সামাজিক বিজ্ঞান ও ব্যবসায় শিক্ষায় ৭.৫ (প্রতিটিতে ৩.০) এবং চারুকলায় ৬.৫ (প্রতিটিতে ৩.০) লাগে। এসএসসি ২০২১–২০২৪ এবং এইচএসসি ২০২৬ সালে পাস হতে হবে।"
  - q: ঢাবি ভর্তির আবেদন ফি কত?
    a: "২০২৬–২৭-এর আবেদন ফি এখনো জানা যায়নি। গত বছর (২০২৫–২৬) আবেদন ফি ছিল ১,০৫০ টাকা।"
  - q: ঢাকা বিশ্ববিদ্যালয়ের আসন সংখ্যা কত?
    a: "২০২৬–২৭-এর আসন এখনো জানা যায়নি। গত বছর (২০২৫–২৬) কলা-আইন-সামাজিক বিজ্ঞান ইউনিটে ২,৯৩৪, বিজ্ঞানে ১,৮৯১ এবং ব্যবসায় শিক্ষা ইউনিটে ১,০৫০টি আসন ছিল।"
  - q: ঢাকা বিশ্ববিদ্যালয়ের যোগাযোগ নম্বর কী?
    a: "বিশ্ববিদ্যালয়ের ওয়েবসাইটে দেওয়া ফোন নম্বর ০৯৬৬৬৯১১৪৬৩ ও ০২-৯৬৬৭২২২। রেজিস্ট্রার অফিসের ইমেইল registrar@du.ac.bd।"
  - q: ঢাকা বিশ্ববিদ্যালয় কোথায় অবস্থিত?
    a: "ঢাকা বিশ্ববিদ্যালয় ঢাকা শহরের রমনা এলাকায়, ঠিকানা ঢাকা-১০০০।"

