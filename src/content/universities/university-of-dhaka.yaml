admission:
  intake: ২০২৬–২৭ শিক্ষাবর্ষ (স্নাতক প্রথম বর্ষ)
  open: 2026-11-11
  close: 2026-11-25
  requirement: "২০২১ থেকে ২০২৪ সালের মধ্যে এসএসসি এবং ২০২৬ সালে এইচএসসি বা সমমান পাস। চতুর্থ বিষয়সহ এসএসসি ও এইচএসসির জিপিএ মিলিয়ে বিজ্ঞান ইউনিটে ন্যূনতম ৮.০ (প্রতিটিতে ৩.৫), কলা-আইন-সামাজিক বিজ্ঞান ও ব্যবসায় শিক্ষা ইউনিটে ৭.৫ (প্রতিটিতে ৩.০), চারুকলায় ৬.৫ (প্রতিটিতে ৩.০)। মানবিক বা ব্যবসায় শাখা থেকে বিজ্ঞান ইউনিটে আবেদন করলে ৭.৫ (প্রতিটিতে ৩.০) লাগে।"
  exam: "আইবিএ ইউনিট ৫ ডিসেম্বর (সকাল ১০টা–দুপুর ১২টা), বিজ্ঞান ১২ ডিসেম্বর, কলা-আইন-সামাজিক বিজ্ঞান ১৯ ডিসেম্বর, চারুকলা ২২ ডিসেম্বর এবং ব্যবসায় শিক্ষা ২৬ ডিসেম্বর ২০২৬; আইবিএ ছাড়া সব পরীক্ষা সকাল ১১টা–দুপুর ১২টা ৩০ মিনিট। বিজ্ঞান, কলা ও ব্যবসায় শিক্ষা ইউনিটে ৬০ নম্বরের এমসিকিউ ও ৪০ নম্বরের লিখিত; চারুকলায় ৪০ এমসিকিউ ও ৬০ অঙ্কন; আইবিএতে ৭০ এমসিকিউ ও ৩০ বর্ণনামূলক। মোট ১২০ নম্বরের মধ্যে ২০ নম্বর এসএসসি-এইচএসসির ফল থেকে।"
  classes_start: ২৮ মার্চ ২০২৭
  steps:
    - title: অনলাইনে আবেদন
      text: ১১ নভেম্বর দুপুর ১২টা থেকে ২৫ নভেম্বর রাত ১১টা ৫৯ মিনিট পর্যন্ত admission.eis.du.ac.bd-এ আবেদন।
    - title: আবেদন ফি জমা
      text: গত বছর ফি ছিল ১,০৫০ টাকা; সোনালী, জনতা, অগ্রণী, রূপালী ব্যাংক বা অনলাইনে (কার্ড, মোবাইল ব্যাংকিং) দেওয়া যেত।
    - title: ভর্তি পরীক্ষা
      text: বিজ্ঞান, কলা ও ব্যবসায় শিক্ষা ইউনিটের পরীক্ষা ঢাকাসহ ৮টি বিভাগীয় কেন্দ্রে; চারুকলা ও আইবিএ শুধু ঢাকায়।
    - title: ফল ও বিষয় বরাদ্দ
      text: মেধাক্রম অনুযায়ী বিষয় পছন্দ ও ভর্তি; ক্লাস শুরু ২৮ মার্চ ২০২৭।
  documents:
    - এসএসসি ও এইচএসসির রোল, রেজিস্ট্রেশন ও বোর্ডের তথ্য
    - আবেদনের জন্য সাম্প্রতিক রঙিন ছবি
    - ভর্তির সময় মূল মার্কশিট ও সনদ

