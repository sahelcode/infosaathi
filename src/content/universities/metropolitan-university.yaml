about: মেট্রোপলিটন ইউনিভার্সিটি ২০০৩ সালে প্রতিষ্ঠিত সিলেটের একটি বেসরকারি বিশ্ববিদ্যালয়, যার প্রতিষ্ঠাতা তৌফিক রহমান চৌধুরী। বটেশ্বরে নিজস্ব স্থায়ী ক্যাম্পাসে কার্যক্রম চলে, এবং বিশ্ববিদ্যালয়ের ভাষ্য অনুযায়ী ২০২৪ সালের ৩ অক্টোবর সরকারের স্থায়ী সনদ পেয়েছে। প্রকৌশল, ব্যবসায়, অর্থনীতি, আইন ও ইংরেজিতে স্নাতক এবং কয়েকটি স্নাতকোত্তর প্রোগ্রাম আছে।
good:
  - সরকারের স্থায়ী সনদপ্রাপ্ত, নিজস্ব স্থায়ী ক্যাম্পাস
  - ক্রেডিট ফি মাসিক কিস্তিতে দেওয়া যায়
  - ফলাফলভিত্তিক মেধা বৃত্তি ৪ বছর পর্যন্ত বহাল
think:
  - ওয়েবসাইটে প্রোগ্রামের মোট খরচ দেওয়া নেই, ভর্তি অফিস থেকে জেনে নিন
  - মেধা বৃত্তি আর ভাইবোন ওয়েভার একসাথে পাওয়া যায় না

