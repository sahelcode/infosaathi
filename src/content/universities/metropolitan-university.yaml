  rank: QS ২০২৭ তালিকায় নেই
  classes: গত সেমিস্টারে ৬ অক্টোবর ২০২৬
cost_note: অফিসিয়াল ফি তালিকায় পুরো কোর্সের মোট খরচ দেওয়া নেই। স্নাতকে ভর্তি ফি ২০,০০০ টাকা (এককালীন), রেজিস্ট্রেশন ফি প্রতি টার্মে ১০,০০০ টাকা, ক্যাম্পাস অ্যাক্টিভিটি মাসে ২,০০০ টাকা, আর ক্রেডিট ফির মাসিক কিস্তি প্রোগ্রামভেদে ৪,০০০ থেকে ৭,০০০ টাকা (CSE, সফটওয়্যার, ডেটা সায়েন্স ও LLB ৭,০০০; EEE ও BBA ৬,০০০; ইংরেজি ৫,০০০; অর্থনীতি ৪,০০০)। ভর্তি ফর্ম ৫০০ টাকা।

