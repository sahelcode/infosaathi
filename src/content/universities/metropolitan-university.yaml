  exam: ভর্তি পরীক্ষা হয় (তারিখ ঘোষণা হয়নি)
  elig: GPA ২.৫০ করে বা মোট ৬.০০
  app_fee: ৫০০ টাকা
  admission_fee: ২০,০০০ টাকা
