about: মেট্রোপলিটন ইউনিভার্সিটি ২০০৩ সালে প্রতিষ্ঠিত সিলেটের একটি বেসরকারি বিশ্ববিদ্যালয়, যার প্রতিষ্ঠাতা তৌফিক রহমান চৌধুরী। বটেশ্বরে নিজস্ব স্থায়ী ক্যাম্পাসে কার্যক্রম চলে, এবং বিশ্ববিদ্যালয়ের ভাষ্য অনুযায়ী ২০২৪ সালের ৩ অক্টোবর সরকারের স্থায়ী সনদ পেয়েছে। প্রকৌশল, ব্যবসায়, অর্থনীতি, আইন ও ইংরেজিতে স্নাতক এবং কয়েকটি স্নাতকোত্তর প্রোগ্রাম আছে।
good:
  - সরকারের স্থায়ী সনদপ্রাপ্ত, নিজস্ব স্থায়ী ক্যাম্পাস
  - ক্রেডিট ফি মাসিক কিস্তিতে দেওয়া যায়
  - ফলাফলভিত্তিক মেধা বৃত্তি ৪ বছর পর্যন্ত বহাল
think:
  - ওয়েবসাইটে প্রোগ্রামের মোট খরচ দেওয়া নেই, ভর্তি অফিস থেকে জেনে নিন
  - মেধা বৃত্তি আর ভাইবোন ওয়েভার একসাথে পাওয়া যায় না

faq:
  - q: মেট্রোপলিটন ইউনিভার্সিটির যোগাযোগ নম্বর কত?
    a: "ভর্তি ও সাধারণ তথ্যের জন্য ০১৩১৩০৫০০৪৪ ও ০১৩১৩০৫০০৬৬ নম্বরে ফোন করুন। ইমেইল info@metrouni.edu.bd।"
  - q: মেট্রোপলিটন ইউনিভার্সিটির ভর্তি ফি কত?
    a: "অফিসিয়াল ফি তালিকা অনুযায়ী সব প্রোগ্রামে এককালীন ভর্তি ফি ২০,০০০ টাকা। এর সাথে প্রতি টার্মে রেজিস্ট্রেশন ফি ১০,০০০ টাকা, আর ভর্তি ফর্ম ৫০০ টাকা।"
  - q: মেট্রোপলিটন ইউনিভার্সিটিতে ভর্তি হতে কত জিপিএ লাগে?
    a: "স্নাতকে SSC ও HSC দুটোতেই কমপক্ষে GPA ২.৫০ লাগে, অথবা একটিতে কমপক্ষে ২.০০ ও দুটো মিলিয়ে ৬.০০। CSE ও EEE-তে বিজ্ঞান বিভাগ থেকে আসতে হয়।"
  - q: মেট্রোপলিটন ইউনিভার্সিটিতে সিএসই পড়তে কত খরচ?
    a: "CSE-তে ক্রেডিট ফির মাসিক কিস্তি ৭,০০০ টাকা, সাথে মাসে ২,০০০ টাকা ক্যাম্পাস অ্যাক্টিভিটি ফি। ভর্তি ফি ২০,০০০ ও প্রতি টার্মে রেজিস্ট্রেশন ১০,০০০ টাকা; পুরো কোর্সের মোট খরচ অফিসিয়াল সাইটে নেই।"
  - q: মেট্রোপলিটন ইউনিভার্সিটিতে এখন ভর্তি চলছে কি?
    a: "স্প্রিং ২০২৭ টার্মের ভর্তি বিজ্ঞপ্তি এখনো অফিসিয়াল সাইটে আসেনি। স্প্রিং টার্ম জানুয়ারিতে শুরু হয়; তারিখ জানতে ০১৩১৩০৫০০৪৪ নম্বরে ফোন করুন।"
  - q: মেট্রোপলিটন ইউনিভার্সিটি কোথায়?
    a: "সিলেট শহরের কাছে বটেশ্বরে (সিলেট-৩১০৪), বিশ্ববিদ্যালয়ের নিজস্ব স্থায়ী ক্যাম্পাসে।"

