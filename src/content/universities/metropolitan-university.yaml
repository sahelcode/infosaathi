detail:
  open: স্প্রিং ২০২৭ টার্মের ভর্তি বিজ্ঞপ্তি মেট্রোপলিটন ইউনিভার্সিটি এখনো প্রকাশ করেনি।
  close: আবেদনের শেষ তারিখ অফিসিয়াল সাইটে নেই; ভর্তি অফিসে ফোন করে জেনে নিন।
  exam: যোগ্য প্রার্থীদের ভর্তি পরীক্ষায় ডাকা হয়, স্প্রিং, সামার ও অটাম তিন টার্মেই হয়।
  elig: স্নাতকে SSC ও HSC দুটোতেই GPA ২.৫০, অথবা একটিতে কমপক্ষে ২.০০ ও মোট ৬.০০।
  app_fee: মেট্রোপলিটন ইউনিভার্সিটিতে স্নাতক ও স্নাতকোত্তর দুই ক্ষেত্রেই ভর্তি ফর্ম ৫০০ টাকা।
  admission_fee: সব প্রোগ্রামে এককালীন ভর্তি ফি ২০,০০০ টাকা, আর প্রতি টার্মে রেজিস্ট্রেশন ১০,০০০।
  cost: ক্রেডিট ফির মাসিক কিস্তি ৪,০০০ (অর্থনীতি) থেকে ৭,০০০ টাকা (CSE, LLB); মোট খরচ নেই।
  rank: QS ওয়ার্ল্ড র‍্যাংকিং ২০২৭-এর বাংলাদেশি তালিকায় মেট্রোপলিটন ইউনিভার্সিটির নাম নেই।
  classes: গত সেমিস্টারে (অটাম ২০২৬) নতুন শিক্ষার্থীদের নিয়মিত ক্লাস শুরু হয় ৬ অক্টোবর ২০২৬।
  programs: স্নাতকে ৮টি ও স্নাতকোত্তরে ৫টি প্রোগ্রাম; CSE, সফটওয়্যার, ডেটা সায়েন্স, BBA, আইনসহ।
