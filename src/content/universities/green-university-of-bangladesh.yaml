detail:
  open: গ্রীন ইউনিভার্সিটি স্প্রিং ২০২৭ সেমিস্টারের ভর্তির বিজ্ঞপ্তি এখনো অফিসিয়াল সাইটে দেয়নি।
  close: আবেদনের শেষ তারিখ ঘোষণা হয়নি; ০১৩২৪৭১৩৫০৩ নম্বরে ফোন করে জেনে নিন।
  exam: ৫০ নম্বরের লিখিত পরীক্ষা ও ভাইভা; SSC-HSC মিলিয়ে GPA ৭.০০ হলে লিখিত পরীক্ষা লাগে না।
  elig: SSC ও HSC দুটোতেই GPA ২.৫০ লাগে, বা একটিতে ২.০০ হলে মিলিয়ে ৬.০০ থাকতে হবে।
  app_fee: গ্রীন ইউনিভার্সিটিতে আবেদন ফি ১,০০০ টাকা, যা ফেরত দেওয়া হয় না।
  admission_fee: ভর্তি ফি একবার ২০,০০০ টাকা (ফেরতযোগ্য নয়), সাথে লাইব্রেরি কশন ২,০০০ টাকা।
  cost: ওয়েভার ছাড়া মোট খরচ সমাজবিজ্ঞানে প্রায় ৩.৮৯ লাখ, CSE-তে প্রায় ৭.২৯ লাখ টাকা।
  rank: THE ইমপ্যাক্ট র‍্যাংকিং ২০২৫-এ গ্রীন ইউনিভার্সিটি বাংলাদেশে দ্বিতীয় হয়েছে।
  classes: বছরে তিন সেমিস্টার; স্প্রিং জানুয়ারিতে, সামার মে-তে, ফল সেপ্টেম্বরে শুরু হয়।
  programs: চারটি ফ্যাকাল্টিতে ১০টি স্নাতক প্রোগ্রাম; CSE, EEE, টেক্সটাইল, BBA, আইনসহ।
quick:
  open: স্প্রিং ২০২৭-এর বিজ্ঞপ্তি আসেনি
  exam: লিখিত (৫০) ও ভাইভা
  elig: SSC ও HSC-তে GPA ২.৫০
  app_fee: ১,০০০ টাকা
  admission_fee: ২০,০০০ টাকা
  cost: প্রায় ৩.৮৯–৭.৪৭ লাখ টাকা
  rank: "THE ইমপ্যাক্ট ২০২৫: দেশে ২য়"
  classes: স্প্রিং সেমিস্টার জানুয়ারিতে
cost_note: মোট খরচ গ্রীন ইউনিভার্সিটির অফিসিয়াল টিউশন ফি তালিকার "Regular" অংশ থেকে, SSC-HSC মিলিয়ে GPA ৮.০০-এর নিচে ধরে (ওয়েভার ছাড়া)। এতে ক্রেডিট ফি, প্রতি সেমিস্টারের রেজিস্ট্রেশন (৬,৫০০ টাকা) ও লাইব্রেরি-ল্যাব-আইটি ফি (৪,০০০ টাকা), ভর্তি ফি ২০,০০০ টাকা ও নন-ক্রেডিট কোর্স ফি ধরা আছে। এলএলবিতে প্রতি সেমিস্টারে রেজিস্ট্রেশন ৯,৭২৫ ও লাইব্রেরি-ল্যাব-আইটি ৬,০০০ টাকা। ভালো GPA থাকলে খরচ অনেক কমে।

