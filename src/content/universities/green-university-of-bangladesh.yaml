about: গ্রীন ইউনিভার্সিটি অব বাংলাদেশ ২০০৩ সালে বেসরকারি বিশ্ববিদ্যালয় আইন-১৯৯২-এর অধীনে প্রতিষ্ঠিত একটি বেসরকারি বিশ্ববিদ্যালয়। এর ক্যাম্পাস পূর্বাচল আমেরিকান সিটি, কাঞ্চন, রূপগঞ্জে। চারটি ফ্যাকাল্টিতে CSE, EEE, টেক্সটাইল, BBA, আইন, ইংরেজিসহ ১০টি স্নাতক প্রোগ্রাম আছে।
good:
  - SSC-HSC ফল ভালো হলে বড় ওয়েভার, সর্বোচ্চ ১০০%
  - প্রোগ্রামভিত্তিক মোট খরচ অফিসিয়াল সাইটে দেওয়া আছে
  - মিলিয়ে GPA ৭.০০ হলে লিখিত ভর্তি পরীক্ষা লাগে না
think:
  - ক্যাম্পাস ঢাকা শহর থেকে দূরে, পূর্বাচল-কাঞ্চন এলাকায়
  - বিশ্ববিদ্যালয়ের নিজস্ব হল বা হোস্টেল নেই

faq:
  - q: গ্রীন ইউনিভার্সিটির যোগাযোগ নম্বর কত?
    a: "ভর্তি অফিসের নম্বর ০১৩২৪৭১৩৫০৩ ও ০১৩২৪৭১৩৫০৪। বিদেশি শিক্ষার্থীদের জন্য ০১৩২৪৭১৩৫০২, মূল নম্বর ০৯৬১৪৪৮২৪৮২। ইমেইল admission@green.edu.bd।"
  - q: গ্রীন ইউনিভার্সিটির ভর্তি ফি কত?
    a: "ভর্তি ফি একবার ২০,০০০ টাকা, যা ফেরত দেওয়া হয় না। আবেদন ফি ১,০০০ টাকা। সাথে ফেরতযোগ্য লাইব্রেরি কশন ২,০০০ টাকা লাগে।"
  - q: গ্রীন ইউনিভার্সিটিতে ভর্তি হতে কত জিপিএ লাগে?
    a: "SSC ও HSC দুটোতেই কমপক্ষে GPA ২.৫০ লাগে। একটিতে ২.০০ থাকলে দুটো মিলিয়ে ৬.০০ হতে হবে। এলএলবিতে মিলিয়ে GPA ৭.০০ লাগে।"
  - q: গ্রীন ইউনিভার্সিটিতে সিএসই পড়তে কত খরচ?
    a: "ওয়েভার ছাড়া CSE-তে ১৪৪ ক্রেডিটের মোট খরচ প্রায় ৭,২৮,৭৫০ টাকা। প্রতি ক্রেডিট ৪,০০০ টাকা। SSC-HSC ফল ভালো হলে খরচ অনেক কমে।"
  - q: গ্রীন ইউনিভার্সিটিতে ভর্তি পরীক্ষা কেমন হয়?
    a: "৪৫ মিনিটের ৫০ নম্বরের লিখিত পরীক্ষা ও ৫০ নম্বরের ভাইভা হয়। লিখিত অংশে ইংরেজি, সাধারণ জ্ঞান ও গণিত থাকে; ইঞ্জিনিয়ারিংয়ে পদার্থ ও রসায়নও। SSC-HSC মিলিয়ে GPA ৭.০০ হলে লিখিত পরীক্ষা লাগে না।"
  - q: গ্রীন ইউনিভার্সিটিতে এখন ভর্তি চলছে কি?
    a: "স্প্রিং ২০২৭ সেমিস্টারের ভর্তির বিজ্ঞপ্তি এখনো অফিসিয়াল সাইটে আসেনি। স্প্রিং সেমিস্টার সাধারণত জানুয়ারিতে শুরু হয়; তারিখ জানতে ০১৩২৪৭১৩৫০৩ নম্বরে ফোন করুন।"
  - q: গ্রীন ইউনিভার্সিটি কোথায়?
    a: "পূর্বাচল আমেরিকান সিটি, কাঞ্চন, রূপগঞ্জ, নারায়ণগঞ্জ-১৪৬১, ঢাকা।"

