about: রণদা প্রসাদ সাহা বিশ্ববিদ্যালয় (আরপিএসইউ) নারায়ণগঞ্জের একটি বেসরকারি বিশ্ববিদ্যালয়, কুমুদিনী ওয়েলফেয়ার ট্রাস্ট অব বেঙ্গল (বিডি) লিমিটেডের একটি প্রতিষ্ঠান। নারায়ণগঞ্জ শহরের শীতলক্ষ্যায় নিজস্ব ক্যাম্পাসে ক্লাস হয়। ব্যবসায়, ইঞ্জিনিয়ারিং, ফার্মেসি, আইন, ইংরেজি, ফ্যাশন ডিজাইন ও জনস্বাস্থ্যে পড়ানো হয়।
good:
  - নারায়ণগঞ্জ শহরে নিজস্ব ক্যাম্পাস
  - ওয়েবসাইটে প্রতিটি প্রোগ্রামের মোট খরচ প্রকাশিত
  - ট্রান্সপোর্ট ফি নেই
  - HSC ফলাফলে সর্বোচ্চ ৪০% টিউশন ওয়েভার
think:
  - ওয়েভার শুধু টিউশন ফিতে, আর প্রতি সেমিস্টারে কোর্সে GPA ৩.০০ ও ৮০% উপস্থিতি রাখতে হয়
  - একাধিক ওয়েভারের যোগ্য হলেও একটিই পাওয়া যায়
  - ফি তালিকায় কোন সেশনের জন্য তা লেখা নেই, ভর্তির আগে মিলিয়ে নিন

faq:
  - q: রণদা প্রসাদ সাহা বিশ্ববিদ্যালয়ের যোগাযোগ বা ভর্তি অফিসের ফোন নম্বর কত?
    a: "ভর্তি অফিসারের নম্বর ০১৭০৯৬৬৭১০০। সূত্র: বিশ্ববিদ্যালয়ের অফিসিয়াল ভর্তি পাতা।"
  - q: আরপিএসইউতে ভর্তি ফি কত?
    a: "স্নাতকে এককালীন ভর্তি ফি ২০,০০০ টাকা, স্নাতকোত্তরে ১৫,০০০ টাকা। এর সাথে স্নাতকে প্রতি সেমিস্টারে ১০,০০০ টাকা সেমিস্টার ফি দিতে হয়।"
  - q: আর পি সাহা বিশ্ববিদ্যালয়ে ভর্তি হতে কত জিপিএ লাগে?
    a: "ন্যূনতম জিপিএ অফিসিয়াল সাইটে প্রকাশ করা নেই, HSC বা সমমান পাস লাগে। প্রোগ্রামভেদে শর্ত জানতে ভর্তি অফিসারকে ০১৭০৯৬৬৭১০০ নম্বরে ফোন করুন।"
  - q: আরপিএসইউতে সিএসই পড়তে মোট কত খরচ?
    a: "অফিসিয়াল ফি তালিকায় ১৬০ ক্রেডিটের বিএসসি ইন সিএসই-র মোট খরচ ৬,৯২,০০০ টাকা, কোনো ওয়েভার ছাড়া। HSC-তে GPA ৫.০০ হলে টিউশন ফিতে ৪০% ওয়েভার আছে।"
  - q: রণদা প্রসাদ সাহা বিশ্ববিদ্যালয়ে এখন ভর্তি চলছে কি?
    a: "স্প্রিং ২০২৭-এর ভর্তি বিজ্ঞপ্তি এখনো আসেনি। গত সেমিস্টারে (ফল ২০২৬) আবেদন চলে ২ মে থেকে ২৪ জুন ২০২৬, ভর্তি পরীক্ষা হয় ২ জুলাই।"
  - q: রণদা প্রসাদ সাহা বিশ্ববিদ্যালয় কোথায়?
    a: "নারায়ণগঞ্জ শহরের শীতলক্ষ্যায়, ২৫ সুলতান গিয়াসউদ্দিন রোডে বিশ্ববিদ্যালয়ের নিজস্ব ক্যাম্পাসে।"

