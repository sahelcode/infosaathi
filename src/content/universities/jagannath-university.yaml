detail:
  open: ২০২৬–২৭ শিক্ষাবর্ষে জবির স্নাতক ভর্তির আবেদন শুরু ১৫ নভেম্বর ২০২৬ দুপুর ১২টায়।
  close: আবেদনের শেষ সময় ১০ ডিসেম্বর ২০২৬ রাত ১১টা ৫৯ মিনিট; পাঁচ ইউনিটেই একই সময়সীমা।
  exam: ভর্তি পরীক্ষা ১ থেকে ২৩ জানুয়ারি ২০২৭; প্রথমে A ইউনিট, শেষে D ইউনিট, সব ঢাকায়।
  elig: এসএসসি-এইচএসসি মিলিয়ে A ইউনিটে জিপিএ ৭.০০, C-তে ৬.৫০, B ও D-তে ৬.০০, E-তে ৫.৫০।
  app_fee: ২০২৬–২৭-এর আবেদন ফি এখনো জানা যায়নি; গত বছর A–D ইউনিটে ১,০০০, E-তে ১,২০০ টাকা।
  rank: কিউএস (QS) বিশ্ব র‍্যাংকিং ২০২৭-এর তালিকায় জগন্নাথ বিশ্ববিদ্যালয়ের নাম নেই।
  classes: ২০২৬–২৭ শিক্ষাবর্ষের স্নাতক প্রথম বর্ষের ক্লাস শুরু হবে ৪ এপ্রিল ২০২৭ থেকে।
  programs: সাতটি অনুষদের ৩৮টি বিভাগে স্নাতক; ভর্তি হয় পাঁচটি ইউনিটের নিজস্ব ভর্তি পরীক্ষায়।
