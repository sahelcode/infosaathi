about: জগন্নাথ বিশ্ববিদ্যালয় পুরান ঢাকার চিত্তরঞ্জন অ্যাভিনিউতে অবস্থিত একটি সরকারি বিশ্ববিদ্যালয়। এর শুরু ১৮৫৮ সালের ঢাকা ব্রাহ্ম স্কুল থেকে; পরে জগন্নাথ কলেজ হয়ে ২০০৫ সালে আইনের মাধ্যমে বিশ্ববিদ্যালয় হয়। এখানে সাতটি অনুষদের ৩৮টি বিভাগ ও দুটি ইনস্টিটিউট আছে, স্নাতকে ভর্তি হয় পাঁচটি ইউনিটের নিজস্ব পরীক্ষায়।
good:
  - ঢাকার কেন্দ্রে সরকারি বিশ্ববিদ্যালয়, পড়ার খরচ কম
  - ২০২৬–২৭ ভর্তির আবেদন, পরীক্ষা ও ক্লাস শুরুর তারিখ আগেই ঘোষিত
  - গুচ্ছ পদ্ধতি ছেড়ে নিজস্ব পরীক্ষা; পাঁচ ইউনিটের পরীক্ষা আলাদা দিনে
think:
  - পুরান ঢাকার ঘনবসতি এলাকায় ছোট ক্যাম্পাস, যানজট বেশি
  - ২০২৬–২৭-এর আবেদন ফি ও আসন সংখ্যা এখনো জানা যায়নি; আবেদনের আগে ভর্তি পোর্টাল দেখে নিন
  - সব ইউনিটের পরীক্ষা শুধু ঢাকায়, বিভাগীয় কেন্দ্র নেই

faq:
  - q: জগন্নাথ বিশ্ববিদ্যালয়ে ভর্তির আবেদন কবে শুরু?
    a: "২০২৬–২৭ শিক্ষাবর্ষের স্নাতক সম্মান ও বিবিএ প্রথম বর্ষের আবেদন ১৫ নভেম্বর ২০২৬ দুপুর ১২টায় শুরু হয়ে ১০ ডিসেম্বর রাত ১১টা ৫৯ মিনিটে শেষ হবে। আবেদন অনলাইনে, admission.jnu.ac.bd-এ।"
  - q: জবি ভর্তি পরীক্ষা ২০২৬–২৭ কবে?
    a: "A ইউনিট ১ জানুয়ারি, E ইউনিট ৮ জানুয়ারি, B ইউনিট ১৫ জানুয়ারি, C ইউনিট ২২ জানুয়ারি এবং D ইউনিট ২৩ জানুয়ারি ২০২৭। সব পরীক্ষা সকাল ১০টা থেকে ১১টা, ঢাকায়।"
  - q: জগন্নাথ বিশ্ববিদ্যালয়ে ভর্তির যোগ্যতা কত জিপিএ?
    a: "এসএসসি ও এইচএসসি মিলিয়ে A ইউনিটে ন্যূনতম ৭.০০ (প্রতিটিতে ৩.০০), C ইউনিটে ৬.৫০ (প্রতিটিতে ৩.০০), B ও D ইউনিটে ৬.০০ (প্রতিটিতে ২.৭৫) এবং E ইউনিটে ৫.৫০ (প্রতিটিতে ২.৫০) লাগে। এসএসসি ২০২৩ বা ২০২৪ এবং এইচএসসি ২০২৬ সালে পাস হতে হবে।"
  - q: জবি ভর্তির আবেদন ফি কত?
    a: "২০২৬–২৭-এর আবেদন ফি এখনো জানা যায়নি। গত বছর (২০২৫–২৬) A, B, C ও D ইউনিটে ১,০০০ টাকা এবং E (চারুকলা) ইউনিটে ১,২০০ টাকা ছিল।"
  - q: জগন্নাথ বিশ্ববিদ্যালয়ের যোগাযোগ নম্বর কী?
    a: "বিশ্ববিদ্যালয়ের ওয়েবসাইটে দেওয়া ফোন নম্বর ০২-৯৫৩৪২৫৫। ইমেইল info@jnu.ac.bd।"
  - q: জগন্নাথ বিশ্ববিদ্যালয় কোথায় অবস্থিত?
    a: "জগন্নাথ বিশ্ববিদ্যালয় দক্ষিণ ঢাকার পুরান ঢাকায়, বুড়িগঙ্গার কাছে; ঠিকানা ৯-১০ চিত্তরঞ্জন অ্যাভিনিউ, ঢাকা-১১০০।"
  - q: জগন্নাথ বিশ্ববিদ্যালয়ে কয়টি ইউনিট?
    a: "পাঁচটি: A (বিজ্ঞান এবং জীব ও ভূবিজ্ঞান), B (কলা ও আইন), C (ব্যবসায় শিক্ষা), D (সামাজিক বিজ্ঞান) এবং E (চারুকলা)।"

