admission:
  intake: ২০২৬–২৭ শিক্ষাবর্ষ (স্নাতক সম্মান ও বিবিএ প্রথম বর্ষ)
  open: 2026-11-15
  close: 2026-12-10
  requirement: "২০২৩ বা ২০২৪ সালে এসএসসি এবং ২০২৬ সালে এইচএসসি বা সমমান পাস। এসএসসি ও এইচএসসি মিলিয়ে ন্যূনতম জিপিএ: A ইউনিট (বিজ্ঞান এবং জীব ও ভূবিজ্ঞান) ৭.০০, প্রতিটিতে ৩.০০; B (কলা ও আইন) এবং D (সামাজিক বিজ্ঞান) ৬.০০, প্রতিটিতে ২.৭৫; C (ব্যবসায় শিক্ষা) ৬.৫০, প্রতিটিতে ৩.০০; E (চারুকলা) ৫.৫০, প্রতিটিতে ২.৫০।"
  exam: "A ইউনিট ১ জানুয়ারি, E ইউনিট ৮ জানুয়ারি, B ইউনিট ১৫ জানুয়ারি, C ইউনিট ২২ জানুয়ারি এবং D ইউনিট ২৩ জানুয়ারি ২০২৭; সব পরীক্ষা সকাল ১০টা থেকে ১১টা, এমসিকিউ পদ্ধতিতে, শুধু ঢাকায়। গত বছর (২০২৫–২৬) মোট ১০০ নম্বরের মধ্যে এমসিকিউ ৭২, এসএসসির ফল ১০ ও এইচএসসির ফল ১৮ নম্বর ছিল; প্রতিটি ভুল উত্তরে ০.২৫ কাটা যেত।"
  classes_start: ৪ এপ্রিল ২০২৭
  steps:
    - title: অনলাইনে আবেদন
      text: ১৫ নভেম্বর দুপুর ১২টা থেকে ১০ ডিসেম্বর ২০২৬ রাত ১১টা ৫৯ মিনিট পর্যন্ত অনলাইনে আবেদন।
    - title: আবেদন ফি জমা
      text: ২০২৬–২৭-এর ফি এখনো জানা যায়নি; গত বছর A–D ইউনিটে ১,০০০ ও E ইউনিটে ১,২০০ টাকা ছিল, বিকাশ, রকেট বা সেলফিনে।
    - title: ভর্তি পরীক্ষা
      text: ১ থেকে ২৩ জানুয়ারি ২০২৭, পাঁচ ইউনিটে আলাদা দিনে, সব কেন্দ্র ঢাকায়।
    - title: ফল ও বিষয় বরাদ্দ
      text: মেধাতালিকা অনুযায়ী বিষয় পছন্দ ও ভর্তি; প্রথম বর্ষের ক্লাস শুরু ৪ এপ্রিল ২০২৭।
  documents:
    - এসএসসি ও এইচএসসির রোল, রেজিস্ট্রেশন ও বোর্ডের তথ্য
    - আবেদনের জন্য সাম্প্রতিক রঙিন ছবি
    - ভর্তির সময় মূল মার্কশিট ও সনদ

