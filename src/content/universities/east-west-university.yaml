about: ইস্ট ওয়েস্ট ইউনিভার্সিটি ১৯৯৬ সালে প্রগতি ফাউন্ডেশন ফর এডুকেশন অ্যান্ড ডেভেলপমেন্টের উদ্যোগে প্রতিষ্ঠিত বেসরকারি বিশ্ববিদ্যালয়; ড. মোহাম্মদ ফরাসউদ্দিনের নেতৃত্বে একদল উদ্যোক্তা এটি গড়েন। মহাখালীতে যাত্রা শুরু হলেও এখন স্থায়ী ক্যাম্পাস ঢাকার আফতাবনগরে। তিন অনুষদে ১৩টি বিভাগে প্রায় ১০,৫০০ শিক্ষার্থী পড়ে।
good:
  - আফতাবনগরে নিজস্ব স্থায়ী ক্যাম্পাস
  - বছরে তিনটি সেমিস্টারে ভর্তি (ফার্মেসি ও আইনে দুটি)
  - ভালো ফলে ১০০% পর্যন্ত টিউশন ওয়েভার
think:
  - ইঞ্জিনিয়ারিং ও ফার্মেসিতে মোট খরচ ১০ লাখ টাকার বেশি
  - বাছাইয়ে ভর্তি পরীক্ষার নম্বর ৭৫% গোনা হয়, তাই পরীক্ষার প্রস্তুতি জরুরি
  - ফার্মেসিতে যোগ্যতা কড়া, HSC তিন বছরের মধ্যে পাস হতে হয়

faq:
  - q: ইস্ট ওয়েস্ট ইউনিভার্সিটির যোগাযোগ নম্বর কত?
    a: "ভর্তি অফিসের নম্বর ০৯৬৬৬৭৭৫৫৭৭ (এক্সটেনশন ২৩৪); ভর্তি হটলাইন ০১৮৫১৯৩৩০৯৪ ও ০১৭৫৫৫৮৭২২৪। ইমেইল admissions@ewubd.edu।"
  - q: ইস্ট ওয়েস্ট ইউনিভার্সিটির ভর্তি ফি কত?
    a: "ভর্তি ফি ২৫,০০০ টাকা, যা একবার দিতে হয় এবং ফেরত দেওয়া হয় না। আবেদন ফি ১,৫০০ টাকা।"
  - q: ইস্ট ওয়েস্ট ইউনিভার্সিটিতে ভর্তি হতে কত জিপিএ লাগে?
    a: "SSC ও HSC দুটোতেই কমপক্ষে GPA ৩.০০ লাগে (ডিপ্লোমা ইঞ্জিনিয়ারিংয়ে ২.৪০)। ফার্মেসিতে বিজ্ঞান বিভাগ থেকে দুই পরীক্ষা মিলিয়ে GPA ৮.০০ এবং প্রতিটিতে কমপক্ষে ৩.৫০ লাগে।"
  - q: ইস্ট ওয়েস্ট ইউনিভার্সিটিতে সিএসই পড়তে কত খরচ?
    a: "CSE-তে ১৪০ ক্রেডিট, প্রতি ক্রেডিট ৬,৫০০ টাকা। অফিসিয়াল তালিকায় টিউশন, ল্যাব ও ভর্তি ফি মিলিয়ে মোট ১০,০৩,৪০০ টাকা; ওয়েভার পেলে কমে।"
  - q: ইস্ট ওয়েস্ট ইউনিভার্সিটির স্প্রিং ২০২৭ ভর্তি পরীক্ষা কবে?
    a: "ভর্তি পরীক্ষা ১১ ডিসেম্বর ২০২৬ শুক্রবার সকাল ১০টায়; আবেদনের শেষ তারিখ ৮ ডিসেম্বর। ফার্মেসির পরীক্ষা ১২ ডিসেম্বর দুপুর ২:৩০-এ, আবেদন ৯ ডিসেম্বর পর্যন্ত।"
  - q: ইস্ট ওয়েস্ট ইউনিভার্সিটিতে কী কী ওয়েভার আছে?
    a: "SSC ও HSC-তে সব বিষয়ে A+ পেলে ৪ বছর ১০০% টিউশন ফ্রি, দুটোতেই GPA ৫.০০ হলে প্রথম বছর ৫০%। ভাইবোন একসঙ্গে পড়লে দ্বিতীয়জন ৫০% ওয়েভার পান।"
  - q: ইস্ট ওয়েস্ট ইউনিভার্সিটি কোথায়?
    a: "ঢাকার আফতাবনগরে, এ/২ জহুরুল ইসলাম অ্যাভিনিউ, জহুরুল ইসলাম সিটি, ঢাকা-১২১২।"

