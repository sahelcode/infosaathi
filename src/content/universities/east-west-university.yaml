detail:
  open: ইস্ট ওয়েস্ট ইউনিভার্সিটিতে স্প্রিং ২০২৭ সেমিস্টারের স্নাতক ভর্তির আবেদন চলছে।
  close: আবেদনের শেষ তারিখ ৮ ডিসেম্বর ২০২৬; ফার্মেসিতে শেষ তারিখ ৯ ডিসেম্বর ২০২৬।
  exam: ভর্তি পরীক্ষা ১১ ডিসেম্বর ২০২৬ সকাল ১০টায়; ফার্মেসির পরীক্ষা ১২ ডিসেম্বর দুপুরে।
  elig: SSC ও HSC দুটোতেই কমপক্ষে GPA ৩.০০ লাগে; ফার্মেসিতে মিলিয়ে GPA ৮.০০ লাগে।
  app_fee: ইস্ট ওয়েস্ট ইউনিভার্সিটিতে আবেদন ফি ১,৫০০ টাকা; বিকাশে দিলে প্রসেসিং ফি লাগে।
  admission_fee: ভর্তি ফি ২৫,০০০ টাকা, একবার দিতে হয় এবং এই টাকা ফেরত দেওয়া হয় না।
  cost: CSE, EEE, ICE-তে অফিসিয়াল তালিকায় মোট খরচ ১০,০৩,৪০০ টাকা; ফার্মেসিতে ১১,৯২,০০০।
  rank: QS ওয়ার্ল্ড র‍্যাংকিং ২০২৭-এ ইস্ট ওয়েস্ট নেই; ২০২৫ সালে ছিল ১,৪০১+ ব্যান্ডে।
  classes: স্প্রিং ২০২৭ সেমিস্টারের ক্লাস শুরু ১০ জানুয়ারি ২০২৭, ওরিয়েন্টেশন ৭ জানুয়ারি।
  programs: তিন অনুষদে ১৫টি স্নাতক প্রোগ্রাম আছে; CSE, EEE, ফার্মেসি, বিবিএ, আইনসহ।
