detail:
  open: চুয়েটের ২০২৬–২৭ আবেদনের তারিখ এখনো জানানো হয়নি; গত বছর আবেদন শুরু হয় ১৫ ডিসেম্বর।
  close: চুয়েটের ২০২৬–২৭ আবেদনের শেষ দিন এখনো আসেনি; গত বছর শেষ দিন ছিল ৩১ ডিসেম্বর ২০২৫।
  exam: চুয়েটের ২০২৬–২৭ স্নাতক ভর্তি পরীক্ষার সম্ভাব্য তারিখ ২৩ জানুয়ারি ২০২৭, ক ও খ গ্রুপে।
  elig: গত বছর এসএসসিতে জিপিএ ৪.০০ ও এইচএসসির গণিত-পদার্থ-রসায়নে মোট ১৪.০০ লাগত।
  app_fee: ২০২৬–২৭-এর আবেদন ফি এখনো জানানো হয়নি; গত বছর ক গ্রুপে ১,২০০ ও খ গ্রুপে ১,৪০০ টাকা ছিল।
  seats: চুয়েটে ২০২৬–২৭ শিক্ষাবর্ষে ১২টি বিভাগে মোট ৯৩১টি আসন, এর মধ্যে ১১টি সংরক্ষিত।
  competition: গত বছর ৯৩১ আসনে যোগ্য প্রার্থী ছিলেন ১৩,৯৪২ জন; আসনপ্রতি প্রায় ১৫ জন (আমাদের হিসাব)।
  classes: গত বছর (২০২৫–২৬) নবীনদের ওরিয়েন্টেশন হয় ২ জুলাই, ক্লাস শুরু হয় ৫ জুলাই ২০২৬।
  rank: কিউএস (QS) বিশ্ব র‍্যাংকিং ২০২৭-এ চুয়েট ১,৪০১+ ধাপে আছে, গত বছরও একই ধাপে ছিল।
  programs: চারটি অনুষদের ১২টি বিভাগে স্নাতক; প্রকৌশল, নগর ও অঞ্চল পরিকল্পনা এবং স্থাপত্য।
