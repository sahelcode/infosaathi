admission:
  intake: ২০২৬–২৭ শিক্ষাবর্ষ (স্নাতক প্রথম বর্ষ)
  requirement: "২০২৬–২৭-এর যোগ্যতা এখনো প্রকাশ হয়নি। গত বছর (২০২৫–২৬) এসএসসিতে কমপক্ষে জিপিএ ৪.০০ এবং এইচএসসিতে গণিত, পদার্থবিজ্ঞান ও রসায়ন মিলিয়ে কমপক্ষে ১৪.০০ গ্রেড পয়েন্ট লাগত; ইংরেজিতে কমপক্ষে বি গ্রেড। বায়োমেডিকেল ইঞ্জিনিয়ারিংয়ে জীববিজ্ঞানে কমপক্ষে ৪.০০ লাগত। চার বিষয়ের গ্রেড পয়েন্টে মেধাক্রমে প্রথম ১৬,০০০ জন পরীক্ষা দেওয়ার সুযোগ পেতেন।"
  exam: "সম্ভাব্য তারিখ ২৩ জানুয়ারি ২০২৭, ক ও খ দুই গ্রুপে। গত বছর দুই গ্রুপেই গণিত, পদার্থবিজ্ঞান, রসায়ন ও ইংরেজিতে ৫০০ নম্বরের এমসিকিউ ছিল; স্থাপত্যের জন্য খ গ্রুপে আরও ২০০ নম্বরের ফ্রিহ্যান্ড ড্রয়িং।"
  steps:
    - title: অনলাইনে আবেদন
      text: admissioncuet.ac.bd-এ আবেদন। ২০২৬–২৭-এর তারিখ এখনো জানানো হয়নি; গত বছর আবেদন চলেছিল ১৫ থেকে ৩১ ডিসেম্বর ২০২৫।
    - title: আবেদন ফি জমা
      text: গত বছর ক গ্রুপে (প্রকৌশল ও নগর পরিকল্পনা) ১,২০০ টাকা, খ গ্রুপে (স্থাপত্যসহ) ১,৪০০ টাকা ছিল।
    - title: যোগ্য প্রার্থীর তালিকা
      text: এইচএসসির গণিত, পদার্থবিজ্ঞান, রসায়ন ও ইংরেজির গ্রেড পয়েন্টে বাছাই। গত বছর তালিকা প্রকাশ হয় ৬ জানুয়ারি ২০২৬।
    - title: ভর্তি পরীক্ষা
      text: সম্ভাব্য তারিখ ২৩ জানুয়ারি ২০২৭। গত বছর পরীক্ষা হয় ১৭ জানুয়ারি ২০২৬, ক্যাম্পাস ও চট্টগ্রাম শহরের দুটি উপকেন্দ্রে।
    - title: ফল, বিভাগ বরাদ্দ ও ভর্তি
      text: মেধাতালিকার পর কয়েক ধাপে বিভাগ বরাদ্দ ও ভর্তি হয়। গত বছর ফল দেওয়া হয় ৩১ জানুয়ারি ২০২৬।
  documents:
    - এসএসসি ও এইচএসসির রোল, রেজিস্ট্রেশন ও বোর্ডের তথ্য
    - আবেদনের জন্য সাম্প্রতিক রঙিন ছবি
    - ভর্তির সময় মূল মার্কশিট ও সনদ

