about: চট্টগ্রাম প্রকৌশল ও প্রযুক্তি বিশ্ববিদ্যালয় (চুয়েট) চট্টগ্রামের রাউজানের পাহাড়তলীতে অবস্থিত সরকারি প্রকৌশল বিশ্ববিদ্যালয়। ১৯৬৮ সালে চট্টগ্রাম প্রকৌশল কলেজ হিসেবে যাত্রা শুরু, পরে বিআইটি চট্টগ্রাম হয় এবং ২০০৩ সালে পূর্ণ বিশ্ববিদ্যালয় হয়। চারটি অনুষদের ১২টি বিভাগে স্নাতক পড়ানো হয়; ভর্তি হয় চুয়েটের নিজস্ব ভর্তি পরীক্ষায়।
good:
  - দেশের পুরোনো প্রকৌশল বিশ্ববিদ্যালয়গুলোর একটি
  - নিজস্ব ভর্তি পরীক্ষা, গুচ্ছে নয়
  - পেট্রোলিয়াম ও মাইনিং, বায়োমেডিকেল, মেকাট্রনিক্সের মতো বিশেষ বিষয় আছে
think:
  - ক্যাম্পাস চট্টগ্রাম শহর থেকে দূরে, রাউজানে
  - গণিত, পদার্থ ও রসায়নে ভালো ফল না থাকলে আবেদনই করা যায় না
  - ২০২৬–২৭-এর পুরো বিজ্ঞপ্তি এখনো আসেনি; admissioncuet.ac.bd দেখে নিন

faq:
  - q: চুয়েট ভর্তি পরীক্ষা ২০২৬–২৭ কবে?
    a: "সম্ভাব্য তারিখ ২৩ জানুয়ারি ২০২৭, ক ও খ দুই গ্রুপে। আবেদনের তারিখসহ পুরো বিজ্ঞপ্তি এখনো প্রকাশ হয়নি।"
  - q: চুয়েটে ভর্তির যোগ্যতা কত জিপিএ?
    a: "২০২৬–২৭-এর যোগ্যতা এখনো আসেনি। গত বছর এসএসসিতে জিপিএ ৪.০০ এবং এইচএসসিতে গণিত, পদার্থবিজ্ঞান ও রসায়ন মিলিয়ে ১৪.০০ গ্রেড পয়েন্ট লাগত; ইংরেজিতে কমপক্ষে বি গ্রেড।"
  - q: চুয়েট ভর্তির আবেদন ফি কত?
    a: "২০২৬–২৭-এর ফি এখনো জানানো হয়নি। গত বছর ক গ্রুপে ১,২০০ টাকা এবং খ গ্রুপে (স্থাপত্যসহ) ১,৪০০ টাকা ছিল।"
  - q: চুয়েটের আসন সংখ্যা কত?
    a: "২০২৬–২৭ শিক্ষাবর্ষে ১২টি বিভাগে মোট ৯৩১টি আসন, এর মধ্যে ১১টি বিভিন্ন কোটায় সংরক্ষিত।"
  - q: চুয়েটে কোন কোন বিষয় আছে?
    a: "সিভিল, ইইই, সিএসই, মেকানিক্যালসহ ১২টি বিভাগ: সিভিল, ওয়াটার রিসোর্সেস, ইইই, সিএসই, ইটিই, বায়োমেডিকেল, মেকানিক্যাল, পেট্রোলিয়াম অ্যান্ড মাইনিং, মেকাট্রনিক্স, ম্যাটেরিয়ালস, স্থাপত্য এবং নগর ও অঞ্চল পরিকল্পনা।"
  - q: চুয়েটের যোগাযোগ নম্বর কী?
    a: "চুয়েটের অফিসিয়াল ফোন নম্বর ০৩১৭১৪৯৪৬। ইমেইল registrar@cuet.ac.bd।"
  - q: চুয়েট কোথায় অবস্থিত?
    a: "চুয়েট চট্টগ্রাম জেলার রাউজান উপজেলার পাহাড়তলীতে। ঠিকানা পাহাড়তলী, রাউজান, চট্টগ্রাম-৪৩৪৯।"

