  exam: ভর্তি পরীক্ষা (ফার্মেসি ও আইনে ভাইভাও)
  admission_fee: ২৫,০০০ টাকা
  rank: "QS ২০২৭: তালিকায় নেই"

about: ইন্ডিপেন্ডেন্ট ইউনিভার্সিটি, বাংলাদেশ (আইইউবি) ১৯৯৩ সালে প্রতিষ্ঠিত একটি বেসরকারি বিশ্ববিদ্যালয়। স্থায়ী ক্যাম্পাস ঢাকার বসুন্ধরা আবাসিক এলাকায়। বছরে স্প্রিং, সামার ও অটাম তিন সেমিস্টারে স্নাতকে ভর্তি নেয়।
good:
  - বসুন্ধরায় নিজস্ব স্থায়ী ক্যাম্পাস
  - বছরে তিনবার স্নাতকে ভর্তির সুযোগ
  - ভর্তি পরীক্ষায় ভালো করলে মেধা বৃত্তি
think:
  - ভর্তি পরীক্ষায় উত্তীর্ণ হতে হয়, শুধু জিপিএ দিয়ে ভর্তি হয় না
  - ফার্মেসি ও আইনে পরীক্ষার পর আলাদা ভাইভা দিতে হয়
  - ভর্তি ফি ২৫,০০০ টাকা নির্দিষ্ট সময়ের মধ্যে দিতে হয়

faq:
  - q: ইন্ডিপেন্ডেন্ট ইউনিভার্সিটি (আইইউবি) এর যোগাযোগ নম্বর কত?
    a: "হটলাইন ০৯৬১২৯৩৯৩৯৩; ভর্তি অফিস ০১৭৮০১৮৫০০৬। ফার্মেসি ভাইভা ০১৯৭৩৬০২৬২৬, আইন ভাইভা ০১৭০৮৮০৮৬৩৮ ও ০১৭০৮৮০৮৬৩৯। ইমেইল admission@iub.edu.bd।"
  - q: আইইউবিতে ভর্তি ফি কত?
    a: "ভর্তি ফি ২৫,০০০ টাকা। ভর্তি পরীক্ষায় বাছাই হলে ইমেইলে পাঠানো লিংক থেকে নির্ধারিত সময়ের মধ্যে দিতে হয়।"
  - q: আইইউবিতে ভর্তি হতে কত জিপিএ লাগে?
    a: "ন্যূনতম জিপিএ কত তা আমরা অফিসিয়াল পাতায় যাচাই করতে পারিনি। বাছাই হয় ভর্তি পরীক্ষায়; নিশ্চিত হতে ভর্তি অফিসে (০১৭৮০১৮৫০০৬) জেনে নিন।"
  - q: আইইউবিতে ভর্তি পরীক্ষা হয় কি?
    a: "হ্যাঁ, স্নাতকে ভর্তি পরীক্ষা দিয়ে বাছাই হয়। ফার্মেসি ও আইনে বাছাই হওয়া প্রার্থীদের চূড়ান্ত বাছাইয়ের জন্য ভাইভা দিতে হয়।"
  - q: আইইউবিতে কোন কোন বিষয় পড়ানো হয়?
    a: "সিএসই, ইইই, কম্পিউটার ইঞ্জিনিয়ারিং, বিবিএর বিভিন্ন মেজর, অর্থনীতি, ফার্মেসি, আইন, মাইক্রোবায়োলজি, মিডিয়া অ্যান্ড কমিউনিকেশন, ইংরেজিসহ ২৭টি স্নাতক মেজর আছে।"
  - q: ইন্ডিপেন্ডেন্ট ইউনিভার্সিটি কোথায়?
    a: "ঢাকার বসুন্ধরা আবাসিক এলাকায়, প্লট ১৬, ব্লক বি, আফতাবউদ্দিন আহমেদ রোড, ঢাকা-১২৪৫।"

