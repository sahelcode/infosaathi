detail:
  open: স্প্রিং ২০২৭-এর তারিখ পাইনি; গত সেমিস্টারে (অটাম ২০২৬) ফল প্রকাশ হয় ২৯ জুলাই ২০২৬।
  exam: আইইউবিতে ভর্তি পরীক্ষা দিয়ে বাছাই হয়; ফার্মেসি ও আইনে পরীক্ষার পর ভাইভাও দিতে হয়।
  admission_fee: আইইউবিতে ভর্তি ফি ২৫,০০০ টাকা; অটাম ২০২৬-এ শেষ তারিখ ছিল ১৩ আগস্ট।
  rank: QS ওয়ার্ল্ড র‍্যাংকিং ২০২৭-এ বাংলাদেশের ১৩টি বিশ্ববিদ্যালয়ের মধ্যে আইইউবি নেই।
  programs: ছয়টি স্কুলে ২৭টি স্নাতক মেজর আছে; সিএসই, ইইই, বিবিএ মেজর, ফার্মেসি, আইনসহ।
quick:
