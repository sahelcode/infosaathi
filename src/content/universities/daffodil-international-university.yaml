about: ড্যাফোডিল ইন্টারন্যাশনাল ইউনিভার্সিটি ২০০২ সালে বেসরকারি বিশ্ববিদ্যালয় আইনে প্রতিষ্ঠিত একটি বেসরকারি বিশ্ববিদ্যালয়। এর স্থায়ী ক্যাম্পাস ঢাকার সাভারের বিরুলিয়ায় ড্যাফোডিল স্মার্ট সিটিতে। ছয়টি ফ্যাকাল্টিতে CSE, সফটওয়্যার ইঞ্জিনিয়ারিং, BBA, ফার্মেসি, আইনসহ ৩৪টি স্নাতক প্রোগ্রাম আছে।
good:
  - সব প্রোগ্রামের মোট খরচ অফিসিয়াল সাইটে প্রকাশিত
  - স্নাতকের সব শিক্ষার্থী বিনা মূল্যে একটি ল্যাপটপ পায়
  - বেশিরভাগ প্রোগ্রামে ভর্তির ন্যূনতম যোগ্যতা GPA ২.৫০
think:
  - ক্যাম্পাস ঢাকা শহরের বাইরে, সাভারের বিরুলিয়ায়
  - CSE, ফার্মেসি ও এলএলবি-তে মোট খরচ ১০ লাখ টাকার ওপরে

faq:
  - q: ড্যাফোডিল ইন্টারন্যাশনাল ইউনিভার্সিটির যোগাযোগ নম্বর কত?
    a: "ভর্তির হেল্পলাইন ০৯৬১৭৯০১২১২। ভর্তি অফিসের মোবাইল ০১৮৪৭১৪০০৯৪ ও ০১৭১৩৪৯৩০৫০। ইমেইল admission@daffodilvarsity.edu.bd।"
  - q: ড্যাফোডিল ইউনিভার্সিটিতে ভর্তি ফি কত?
    a: "ভর্তির সময় প্রোগ্রামভেদে একসাথে প্রায় ৬২,৬৫০ থেকে ৮৫,৫৭৫ টাকা দিতে হয়; এলএলবি-তে ১,৭৩,৬২৫ টাকা। আবেদন ফর্মের দাম ১,০০০ টাকা।"
  - q: ড্যাফোডিল ইউনিভার্সিটিতে ভর্তি হতে কত জিপিএ লাগে?
    a: "বেশিরভাগ প্রোগ্রামে SSC ও HSC দুটোতেই কমপক্ষে GPA ২.৫০ লাগে। CSE ও ইঞ্জিনিয়ারিংয়ে বিজ্ঞান বিভাগ এবং পদার্থ, গণিত ও ইংরেজিতে কমপক্ষে C লাগে। ফার্মেসিতে SSC ও HSC মিলিয়ে GPA ৮.০০ লাগে।"
  - q: ড্যাফোডিল ইউনিভার্সিটিতে সিএসই পড়তে কত খরচ?
    a: "অফিসিয়াল তালিকা অনুযায়ী CSE-তে ১৫৪.৫ ক্রেডিটের মোট খরচ ১০,৮০,৮০০ টাকা, ওয়েভার ছাড়া। ভর্তির সময় দিতে হয় ৬৬,৯৫০ টাকা।"
  - q: ড্যাফোডিল ইউনিভার্সিটিতে এখন ভর্তি চলছে কি?
    a: "হ্যাঁ, স্প্রিং ২০২৭ সেমিস্টারের ভর্তি চলছে। আবেদনের শেষ তারিখ ২২ ডিসেম্বর ২০২৬, ভর্তি পরীক্ষা ২৬ ডিসেম্বর ২০২৬।"
  - q: ড্যাফোডিল ইউনিভার্সিটির র‍্যাংকিং কত?
    a: "QS ওয়ার্ল্ড ইউনিভার্সিটি র‍্যাংকিং ২০২৭-এ ড্যাফোডিল ইন্টারন্যাশনাল ইউনিভার্সিটি ১,০০১–১,২০০ ব্যান্ডে আছে।"
  - q: ড্যাফোডিল ইন্টারন্যাশনাল ইউনিভার্সিটি কোথায়?
    a: "ঢাকার সাভারে, ড্যাফোডিল স্মার্ট সিটি, বিরুলিয়া, সাভার, ঢাকা-১২১৬।"

