detail:
  open: ড্যাফোডিল ইন্টারন্যাশনাল ইউনিভার্সিটিতে স্প্রিং ২০২৭ সেমিস্টারের স্নাতক ভর্তির আবেদন চলছে।
  close: স্প্রিং ২০২৭-এ আবেদনের শেষ তারিখ ২২ ডিসেম্বর ২০২৬; আবেদন হয় admission.daffodilvarsity.edu.bd-তে।
  exam: স্প্রিং ২০২৭ সেমিস্টারের ভর্তি পরীক্ষা হবে ২৬ ডিসেম্বর ২০২৬ তারিখে, অফিসিয়াল ভর্তি পাতা অনুযায়ী।
  elig: বেশিরভাগ প্রোগ্রামে SSC ও HSC দুটোতেই GPA ২.৫০ লাগে; ফার্মেসিতে মিলিয়ে GPA ৮.০০ লাগে।
  app_fee: ড্যাফোডিল ইন্টারন্যাশনাল ইউনিভার্সিটিতে স্নাতক ভর্তির আবেদন ফর্মের দাম ১,০০০ টাকা।
  admission_fee: ভর্তির সময় একসাথে দিতে হয় প্রায় ৬২,৬৫০–৮৫,৫৭৫ টাকা; এলএলবি-তে ১,৭৩,৬২৫ টাকা।
  cost: মোট খরচ BBA-তে ৮,৫১,৫৫০, CSE-তে ১০,৮০,৮০০ আর ফার্মেসিতে ১২,৫০,৬৫০ টাকা (ওয়েভার ছাড়া)।
  rank: QS ওয়ার্ল্ড ইউনিভার্সিটি র‍্যাংকিং ২০২৭-এ ড্যাফোডিল ১,০০১–১,২০০ ব্যান্ডে আছে।
  programs: ছয়টি ফ্যাকাল্টিতে ৩৪টি স্নাতক প্রোগ্রাম; CSE, সফটওয়্যার, BBA, ফার্মেসি, আইনসহ।
quick:
