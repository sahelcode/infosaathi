admission:
  intake: বছরে দুই সেশন, জানুয়ারি–জুন ও জুলাই–ডিসেম্বর
  requirement: "স্নাতকে এসএসসি ও এইচএসসি (বা সমমান) দুটোতেই কমপক্ষে জিপিএ ২.৫০। সিএসই-তে ডিপ্লোমা পাসও আবেদন করতে পারেন (জিপিএ ২.৫০)। ইইই-তে পলিটেকনিকের ইলেকট্রিক্যাল বা ইলেকট্রনিক টেকনোলজিতে ডিপ্লোমা (জিপিএ ২.৫০) চলে। বিবিএ ও ইংরেজিতে O Level-এ ৫ বিষয়ে গড় ২.৫ ও A Level-এ ২ বিষয়ে গড় ২.০ হলেও চলে। এমবিএ-তে যেকোনো স্বীকৃত বিশ্ববিদ্যালয় থেকে স্নাতক লাগে।"
  steps:
    - title: অনলাইনে আবেদন
      text: teestauniversity.ac.bd/admission/apply পাতায় ব্যক্তিগত, অভিভাবক ও শিক্ষাগত তথ্য দিয়ে ফর্ম পূরণ করুন।
    - title: সেশন বাছাই
      text: ফর্মে জানুয়ারি–জুন বা জুলাই–ডিসেম্বর ব্যাচ বেছে নিন।
    - title: যোগাযোগ
      text: তারিখ ও ফি নিশ্চিত হতে ০১৮৯৪৪০২২২২ নম্বরে ফোন করুন।
  documents:
    - এসএসসি ও এইচএসসির তথ্য (ডিপ্লোমা হলে তার কাগজ)
    - জাতীয় পরিচয়পত্র বা জন্ম নিবন্ধন নম্বর
    - ছবি

