about: তিস্তা বিশ্ববিদ্যালয় রংপুরের মডার্ন মোড়ে অবস্থিত একটি বেসরকারি বিশ্ববিদ্যালয়। ২০২৩ সালের এপ্রিলে সরকার এর অনুমোদন দেয় এবং ২০২৪ সালের জানুয়ারিতে ক্লাস শুরু হয়। বিজ্ঞান ও প্রকৌশল, ব্যবসায় প্রশাসন, কৃষি ও ভেটেরিনারি, জীববিজ্ঞান এবং কলা মিলিয়ে পাঁচটি অনুষদ আছে।
good:
  - রংপুর শহরেই কৃষি ও ভেটেরিনারি পড়ার বেসরকারি সুযোগ
  - ওয়েবসাইটে প্রতিটি প্রোগ্রামের মোট খরচ প্রকাশিত
  - বছরে দুবার (জানুয়ারি ও জুলাই) ভর্তি
think:
  - ২০২৩ সালে প্রতিষ্ঠিত নতুন বিশ্ববিদ্যালয়, এখনো কোনো ব্যাচ পাস করে বের হয়নি
  - আবেদনের তারিখ, আবেদন ফি ও আসন সংখ্যা জানতে ভর্তির আগে ফোন করুন
  - একাধিক ওয়েভারের যোগ্য হলেও শুধু সবচেয়ে বড়টি পাওয়া যায়; পরের সেমিস্টারে রাখতে জিপিএ ৩.৬০ লাগে

faq:
  - q: তিস্তা বিশ্ববিদ্যালয়ের যোগাযোগ নম্বর কত?
    a: "তিস্তা বিশ্ববিদ্যালয়ের যোগাযোগ নম্বর ০১৮৯৪৪০২২২২। অফিস খোলা শনি থেকে বৃহস্পতিবার, সকাল ৯টা থেকে বিকেল ৫টা।"
  - q: তিস্তা বিশ্ববিদ্যালয়ে ভর্তি ফি কত?
    a: "স্নাতকে এককালীন ভর্তি ফি ১৫,০০০ টাকা এবং এমবিএ-তে ১০,০০০ টাকা (অফিসিয়াল টিউশন ফি তালিকা অনুযায়ী)।"
  - q: তিস্তা বিশ্ববিদ্যালয়ে ভর্তি হতে কত জিপিএ লাগে?
    a: "স্নাতকে এসএসসি ও এইচএসসি (বা সমমান) দুটোতেই কমপক্ষে জিপিএ ২.৫০ লাগে। সিএসই ও ইইই-তে ডিপ্লোমা পাসরাও জিপিএ ২.৫০ নিয়ে আবেদন করতে পারেন।"
  - q: তিস্তা বিশ্ববিদ্যালয়ে সিএসই পড়তে মোট কত খরচ?
    a: "১৫৫ ক্রেডিটের বিএসসি ইন সিএসই-র মোট খরচ ৪,৮৬,৫০০ টাকা, কোনো ওয়েভার ছাড়া। প্রতি ক্রেডিট ২,৫০০ টাকা।"
  - q: তিস্তা বিশ্ববিদ্যালয়ে কোন কোন বিষয় পড়ানো হয়?
    a: "স্নাতকে কৃষি, ভেটেরিনারি সায়েন্স ও অ্যানিমেল হাজবেন্ড্রি, সিএসই, ইইই, বায়োকেমিস্ট্রি, বিবিএ ও ইংরেজি পড়ানো হয়। স্নাতকোত্তরে আছে এমবিএ।"
  - q: তিস্তা বিশ্ববিদ্যালয় কোথায় অবস্থিত?
    a: "তিস্তা বিশ্ববিদ্যালয় রংপুর শহরের মডার্ন মোড়ে, রংপুর ক্যাডেট কলেজের পাশে। ঠিকানা মডার্ন মোড়, আর কে রোড, রংপুর-৫৪০৪।"

