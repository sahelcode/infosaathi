detail:
  open: ওয়েবসাইটে "Admissions Open" লেখা আছে, তবে আবেদন শুরুর তারিখ প্রকাশ হয়নি।
  close: আবেদনের শেষ তারিখ প্রকাশ হয়নি; ০১৮৯৪৪০২২২২ নম্বরে ফোন করে জেনে নিন।
  exam: তিস্তা বিশ্ববিদ্যালয়ের ভর্তি পরীক্ষার তারিখ বা পদ্ধতি আমরা খুঁজে পাইনি।
  elig: স্নাতকে এসএসসি ও এইচএসসি দুটোতেই কমপক্ষে জিপিএ ২.৫০ লাগে, ডিপ্লোমাও চলে।
  admission_fee: স্নাতকে এককালীন ভর্তি ফি ১৫,০০০ টাকা, এমবিএ-তে ১০,০০০ টাকা।
  cost: স্নাতকে মোট খরচ ৩,৫৯,০০০ (বিবিএ) থেকে ৬,৯০,০০০ টাকা (ভেটেরিনারি), ওয়েভার ছাড়া।
  programs: কৃষি, ভেটেরিনারি, সিএসই, ইইই, বায়োকেমিস্ট্রি, বিবিএ, ইংরেজি ও এমবিএ মিলিয়ে ৯টি প্রোগ্রাম।
quick:
  open: চলছে (তারিখ প্রকাশ হয়নি)
  elig: এসএসসি ও এইচএসসিতে জিপিএ ২.৫০
  admission_fee: ১৫,০০০ টাকা (স্নাতক)
  cost: ৩.৫৯–৬.৯০ লাখ টাকা (স্নাতক)
  classes: জানুয়ারি ও জুলাইয়ে সেশন শুরু
cost_note: মোট খরচ অফিসিয়াল টিউশন ফি তালিকা (২০২৫ সালে প্রকাশিত) অনুযায়ী, ওয়েভার ছাড়া। এতে ভর্তি ফি, ক্রেডিট ফি এবং প্রতি সেমিস্টারের রেজিস্ট্রেশন (৫,০০০), স্টুডেন্ট অ্যাক্টিভিটি (২,০০০), লাইব্রেরি (১,০০০) ও বিজ্ঞান-প্রকৌশলে ল্যাব ফি (২,৫০০) ধরা আছে।

