about: বাংলাদেশ প্রকৌশল বিশ্ববিদ্যালয় (বুয়েট) ঢাকার পলাশীতে অবস্থিত দেশের সবচেয়ে পুরোনো প্রকৌশল বিশ্ববিদ্যালয়; ১৯৬২ সালে বিশ্ববিদ্যালয় হিসেবে যাত্রা শুরু করে। পাঁচটি অনুষদের ১৩টি বিভাগে স্নাতক পড়ানো হয়। স্নাতক প্রথম বর্ষে ভর্তি হয় বুয়েটের নিজস্ব লিখিত পরীক্ষা ও ভাইভার মাধ্যমে।
good:
  - দেশের শীর্ষ প্রকৌশল বিশ্ববিদ্যালয়; কিউএস ২০২৭-এ দেশে দ্বিতীয়
  - ২০২৬–২৭ ভর্তি পরীক্ষার তারিখ আগেই ঘোষিত (১৬ জানুয়ারি ২০২৭)
  - প্রাথমিক বাছাই পরীক্ষা বাদ, সরাসরি লিখিত পরীক্ষা
