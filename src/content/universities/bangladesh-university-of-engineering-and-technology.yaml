faq:
  - q: বুয়েট ভর্তি পরীক্ষা ২০২৬–২৭ কবে?
    a: "বুয়েটের ২০২৬–২৭ শিক্ষাবর্ষের স্নাতক ভর্তি পরীক্ষা হবে ১৬ জানুয়ারি ২০২৭। গত বছরের মতো প্রাথমিক বাছাই পরীক্ষা নেই, সরাসরি লিখিত পরীক্ষা হবে।"
  - q: বুয়েটে ভর্তির আবেদন কবে শুরু?
    a: "২০২৬–২৭-এর আবেদনের তারিখ এখনো ঘোষণা হয়নি। গত বছর (২০২৫–২৬) আবেদন চলেছিল ১৬ নভেম্বর থেকে ২ ডিসেম্বর পর্যন্ত, ugadmission.buet.ac.bd-এ।"
  - q: বুয়েটে ভর্তির যোগ্যতা কত জিপিএ?
    a: "গত বছর (২০২৫–২৬) এইচএসসিতে জিপিএ ৫.০০ এবং উচ্চতর গণিত, পদার্থবিজ্ঞান ও রসায়নে জিপিএ ৫ লাগত; এসএসসিতে কমপক্ষে জিপিএ ৪.০০। ২০২৬–২৭-এর যোগ্যতা বিজ্ঞপ্তিতে জানানো হবে।"
  - q: বুয়েট ভর্তির আবেদন ফি কত?
    a: "২০২৬–২৭-এর আবেদন ফি এখনো জানা যায়নি। গত বছর ক গ্রুপে (প্রকৌশল ও নগর-অঞ্চল পরিকল্পনা) ১,৩০০ টাকা এবং খ গ্রুপে (স্থাপত্যসহ) ১,৫০০ টাকা ছিল।"
  - q: বুয়েটের আসন সংখ্যা কত?
    a: "গত বছর (২০২৫–২৬) বুয়েটের ১৩টি বিভাগে সংরক্ষিত ৪টিসহ মোট ১,৩০৯টি আসন ছিল। ২০২৬–২৭-এর আসন বিজ্ঞপ্তিতে জানা যাবে।"
  - q: বুয়েটের যোগাযোগ নম্বর কী?
    a: "বুয়েটের পিএবিএক্স নম্বর ০২-৫৫১৬৭১০০; ভর্তি শাখার এক্সটেনশন ৭৩৬৮।"
  - q: বুয়েট কোথায় অবস্থিত?
    a: "বুয়েট ঢাকার পলাশী এলাকায়, ঠিকানা ঢাকা-১০০০।"

