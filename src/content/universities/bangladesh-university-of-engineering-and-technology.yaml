  close: ২০২৬–২৭-এর শেষ তারিখ এখনো জানা যায়নি; গত বছর আবেদনের শেষ দিন ছিল ২ ডিসেম্বর।
  exam: বুয়েটের ২০২৬–২৭ স্নাতক ভর্তি পরীক্ষা ১৬ জানুয়ারি ২০২৭; প্রাথমিক বাছাই পরীক্ষা নেই।
  elig: গত বছর এইচএসসিতে জিপিএ ৫.০০ এবং উচ্চতর গণিত, পদার্থ ও রসায়নে জিপিএ ৫ লাগত।
  app_fee: ২০২৬–২৭-এর ফি এখনো জানা যায়নি; গত বছর ক গ্রুপে ১,৩০০ ও খ গ্রুপে ১,৫০০ টাকা ছিল।
  seats: গত বছর (২০২৫–২৬) বুয়েটের ১৩টি বিভাগে সংরক্ষিত ৪টিসহ মোট ১,৩০৯টি আসন ছিল।
  competition: গত বছর ৯,০৫১ জন পরীক্ষা দেন ১,৩০৯ আসনে; আসনপ্রতি প্রায় ৭ জন (আমাদের হিসাব)।
  rank: কিউএস (QS) বিশ্ব র‍্যাংকিং ২০২৭-এ বুয়েট ৭১১–৭২০ ধাপে, দেশে দ্বিতীয় অবস্থানে।
  programs: পাঁচটি অনুষদের ১৩টি বিভাগে স্নাতক; প্রকৌশল, স্থাপত্য ও নগর-অঞ্চল পরিকল্পনা।
