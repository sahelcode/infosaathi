admission:
  intake: ২০২৬–২৭ শিক্ষাবর্ষ (স্নাতক প্রথম বর্ষ)
  requirement: "২০২৬–২৭-এর যোগ্যতা এখনো প্রকাশ হয়নি। গত বছর (২০২৫–২৬) এইচএসসি বা সমমানে বিজ্ঞান বিভাগ থেকে জিপিএ ৫.০০ এবং উচ্চতর গণিত, পদার্থবিজ্ঞান ও রসায়নে জিপিএ ৫ লাগত; এসএসসিতে বিজ্ঞান বিভাগ থেকে কমপক্ষে জিপিএ ৪.০০। আগে বুয়েটের ভর্তি পরীক্ষা দেওয়া প্রার্থী আবেদন করতে পারেন না।"
  exam: "১৬ জানুয়ারি ২০২৭। প্রাথমিক বাছাই পরীক্ষা নেই, সরাসরি লিখিত পরীক্ষা, এরপর ভাইভা। মডিউল A (প্রকৌশল ও নগর-অঞ্চল পরিকল্পনা): উচ্চতর গণিত, পদার্থবিজ্ঞান ও রসায়ন; মডিউল B (স্থাপত্যসহ): ফ্রিহ্যান্ড ড্রয়িং ও দৃশ্য-স্থানিক দক্ষতা।"
  steps:
    - title: অনলাইনে আবেদন
      text: ugadmission.buet.ac.bd-এ ফর্ম পূরণ; গত বছর আবেদন চলেছিল ১৬ নভেম্বর থেকে ২ ডিসেম্বর।
    - title: আবেদন ফি জমা
      text: গত বছর ফি ছিল ক গ্রুপে ১,৩০০ ও খ গ্রুপে (স্থাপত্যসহ) ১,৫০০ টাকা; মোবাইল বা ইন্টারনেট ব্যাংকিংয়ে।
    - title: যোগ্য প্রার্থীর তালিকা ও প্রবেশপত্র
      text: মেধাক্রম অনুযায়ী যোগ্য প্রার্থীর তালিকা প্রকাশের পর প্রবেশপত্র ডাউনলোড।
    - title: লিখিত পরীক্ষা ও ভাইভা
      text: ভর্তি পরীক্ষা ১৬ জানুয়ারি ২০২৭, বুয়েট ক্যাম্পাসে; নির্বাচিতদের ভাইভা দিতে হয়।

