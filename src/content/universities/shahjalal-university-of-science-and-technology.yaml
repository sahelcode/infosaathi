cost_note: "ভর্তির সময় ভর্তি ফি ১৪,৯০০ টাকা ছিল (২০২৫–২৬)। সেমিস্টার ফি ও ক্রেডিট ফির সঠিক অঙ্ক বিভাগভেদে আলাদা এবং বিশ্ববিদ্যালয় সম্প্রতি এসব ফি কমিয়েছে; হালনাগাদ অঙ্ক এখানে নিশ্চিত করা যায়নি, ভর্তি পোর্টাল বা বিভাগ থেকে জেনে নিন।"
about: শাহজালাল বিজ্ঞান ও প্রযুক্তি বিশ্ববিদ্যালয় (শাবিপ্রবি) ১৯৮৬ সালে প্রতিষ্ঠিত সিলেটের কুমারগাঁওয়ে অবস্থিত একটি সরকারি বিশ্ববিদ্যালয়, যার শিক্ষা কার্যক্রম শুরু হয় ১৯৯১ সালে। বিশ্ববিদ্যালয়ে ৭টি স্কুল ও ২৭টি বিভাগ রয়েছে। স্নাতক প্রথম বর্ষে ভর্তি হয় বিশ্ববিদ্যালয়ের নিজস্ব এ ও বি ইউনিটের ভর্তি পরীক্ষার মাধ্যমে।
good:
  - বিজ্ঞান ও প্রকৌশলের অনেক বিভাগ এক ক্যাম্পাসে
  - নিজস্ব ভর্তি পরীক্ষা; ২০২৬–২৭ সালের পরীক্ষার তারিখ আগেই ঘোষিত
think:
  - ২০২৬–২৭ ভর্তির আবেদনের সময়, ফি ও যোগ্যতা এখনো ঘোষণা হয়নি; অফিসিয়াল বিজ্ঞপ্তির জন্য ভর্তি পোর্টাল দেখুন
  - "গত বছর (২০২৫–২৬) প্রায় ৭৫ হাজার (৭৫,০২৩) জন আবেদন করেছিলেন, আসন ছিল ১,৫৬৬টি (এ ইউনিট ৯৮৫, বি ইউনিট ৫৮১); এর বাইরে ৭৭টি কোটা আসন (ক্ষুদ্র নৃগোষ্ঠী ২৮, প্রতিবন্ধী ১৪, চা-শ্রমিক ৫, ক্রীড়া ১০, শাবিপ্রবি পরিবার ২০)। প্রতিযোগিতা অনেক বেশি"

faq:
  - q: শাবিপ্রবিতে ভর্তি পরীক্ষা কবে হবে?
    a: "২০২৬–২৭ শিক্ষাবর্ষের স্নাতক প্রথম বর্ষের ভর্তি পরীক্ষা ২৬ ও ২৭ জানুয়ারি ২০২৭ তারিখে হবে বলে ঘোষণা এসেছে; ইউনিটভিত্তিক সময়সূচি পরে জানানো হবে।"
  - q: শাবিপ্রবিতে ভর্তির আবেদন ফি কত?
    a: "২০২৬–২৭-এর আবেদন ফি এখনো ঘোষণা হয়নি। গত বছর (২০২৫–২৬) এ-১ (বিজ্ঞান) ১,২৫০ টাকা, এ-২ (স্থাপত্য) ১,৪০০ টাকা এবং বি ইউনিট ১,২০০ টাকা ছিল।"
  - q: শাবিপ্রবিতে ভর্তি হতে কত টাকা লাগে?
    a: "গত বছর (২০২৫–২৬) ভর্তির সময় ভর্তি ফি ছিল ১৪,৯০০ টাকা। এ বছরের অঙ্ক বদলাতে পারে, ভর্তি বিজ্ঞপ্তি দেখে নিন।"
  - q: শাবিপ্রবির আসন সংখ্যা কত?
    a: "গত বছর (২০২৫–২৬) মোট আসন ছিল ১,৫৬৬টি (এ ইউনিট ৯৮৫, বি ইউনিট ৫৮১), এর বাইরে ৭৭টি কোটা আসন।"
  - q: শাবিপ্রবিতে ভর্তির জন্য ন্যূনতম জিপিএ কত লাগে?
    a: "গত বছর এ ইউনিটে এসএসসি ও এইচএসসি প্রতিটিতে ন্যূনতম ৩.০ এবং মোট ৬.৫ (এইচএসসিতে গণিতে ৩.০); বি ইউনিটে প্রতিটিতে ৩.০ এবং মোট ৬.০ লাগত। এ বছরের যোগ্যতা এখনো ঘোষণা হয়নি।"

