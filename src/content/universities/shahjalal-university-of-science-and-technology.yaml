admission:
  intake: ২০২৬–২৭ শিক্ষাবর্ষ (স্নাতক প্রথম বর্ষ)
  requirement: "২০২৬–২৭-এর যোগ্যতা, আবেদনের সময় ও ফি এখনো ঘোষণা হয়নি। গত বছর (২০২৫–২৬) ছিল: এইচএসসি বা সমমান ২০২৪ বা ২০২৫ সালে এবং এসএসসি বা সমমান ২০২২ বা ২০২৩ সালে পাস। এ ইউনিটে এসএসসি ও এইচএসসি প্রতিটিতে ন্যূনতম জিপিএ ৩.০, দুটি মিলিয়ে ন্যূনতম ৬.৫ এবং এইচএসসিতে গণিতে ন্যূনতম ৩.০। বি ইউনিটে প্রতিটিতে ন্যূনতম ৩.০ এবং দুটি মিলিয়ে ন্যূনতম ৬.০।"
  exam: "শাবিপ্রবির নিজস্ব ভর্তি পরীক্ষা, ২৬ ও ২৭ জানুয়ারি ২০২৭ (ইউনিটভিত্তিক সময়সূচি পরে জানানো হবে)। গত বছর এ ইউনিটের পরীক্ষা ১৩ জানুয়ারি ও বি ইউনিটের ১৪ জানুয়ারি, দুটোই বিকেল ৩টা থেকে ৪টা ৩০ মিনিট; ভর্তি পরীক্ষা ৮০ নম্বরে, মেধাক্রম ১০০ নম্বরে (পরীক্ষার নম্বরের সাথে এসএসসি-এইচএসসি জিপিএর হিসাব যোগ হয়)। দ্বিতীয়বার পরীক্ষার্থীদের ৪ নম্বর কাটা যায়।"
  steps:
    - title: অনলাইনে আবেদন
      text: admission.sust.edu.bd-এ আবেদন করে ফি জমা দিন, তারপর প্রবেশপত্র নামান।
    - title: ভর্তি পরীক্ষা
      text: সিলেটে শাবিপ্রবি ক্যাম্পাস ও নির্বাচিত কেন্দ্রে, এবং ঢাকায়।
    - title: মেধাতালিকা ও বিষয় নির্বাচন
      text: মেধাক্রমে ডাকা হয়; ক্যাম্পাসে গিয়ে বিষয় নিতে হয়।
    - title: ভর্তি ফি জমা
      text: গত বছর ১৪,৯০০ টাকা ছিল।
  documents:
    - এসএসসি ও এইচএসসির মূল মার্কশিট
    - রঙিন পাসপোর্ট সাইজ ছবি ১টি
    - রক্তের গ্রুপের প্রমাণ
    - অতিরিক্ত ফটোকপি

