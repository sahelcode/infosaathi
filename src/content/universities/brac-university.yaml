detail:
  open: ব্র্যাক বিশ্ববিদ্যালয় স্প্রিং ২০২৭ সেমিস্টারের স্নাতক ভর্তির বিজ্ঞপ্তি এখনো দেয়নি।
  close: স্প্রিং ২০২৭-এর শেষ তারিখ ঘোষণা হয়নি; গত সেমিস্টারে শেষ তারিখ ছিল ২ আগস্ট ২০২৬।
  exam: গত সেমিস্টারে (ফল ২০২৬) লিখিত পরীক্ষা হয় ৭ আগস্ট ও ১১ সেপ্টেম্বর, পরে ইন্টারভিউ।
  elig: SSC ও HSC দুটোতেই আলাদাভাবে কমপক্ষে GPA ৩.৫০ লাগে; ফার্মেসিতে মিলিয়ে GPA ৮.০০।
  app_fee: ব্র্যাক বিশ্ববিদ্যালয়ে স্নাতক ভর্তির আবেদন ফি ১,৫০০ টাকা, যা ফেরত দেওয়া হয় না।
  admission_fee: ভর্তি ফি ৩৩,৯০০ টাকা; প্রথম সেমিস্টারে সব মিলিয়ে প্রায় ৭০,৫০০–৭৬,৮০০ টাকা লাগে।
  cost: প্রতি ক্রেডিট ৮,২৫০ টাকা (আইনে ৮,৮০০); CSE-তে শুধু টিউশন প্রায় ১১.২২ লাখ টাকা।
  rank: QS ওয়ার্ল্ড র‍্যাংকিং ২০২৭-এ ব্র্যাক বিশ্ববিদ্যালয় ১,০০১–১,২০০ ব্যান্ডে আছে।
  classes: স্প্রিং সেমিস্টারের ক্লাস জানুয়ারিতে শুরু হয়; ফল ২০২৬-এর ক্লাস শুরু হয় ৩ অক্টোবর।
  programs: ১৮টি স্নাতক প্রোগ্রাম আছে; CSE, EEE, BBA, ফার্মেসি, আর্কিটেকচার, আইনসহ।
quick:
  open: স্প্রিং ২০২৭-এর বিজ্ঞপ্তি আসেনি
  close: গত সেমিস্টারে ২ আগস্ট ২০২৬
  exam: গত সেমিস্টারে ৭ আগস্ট ২০২৬
  elig: SSC ও HSC প্রতিটিতে GPA ৩.৫০
  app_fee: ১,৫০০ টাকা
  admission_fee: ৩৩,৯০০ টাকা
  cost: শুধু টিউশন প্রায় ৯.৯–১৩.৫ লাখ টাকা
  rank: "QS ২০২৭: ১,০০১–১,২০০"
  classes: স্প্রিং সেমিস্টার জানুয়ারিতে
cost_note: মোট খরচ শুধু টিউশনের হিসাব (মোট ক্রেডিট × প্রতি ক্রেডিট ফি), স্প্রিং ২০২৫ থেকে নতুন শিক্ষার্থীদের অফিসিয়াল ফি তালিকা অনুযায়ী; প্রতি ক্রেডিট ৮,২৫০ টাকা, আইনে ৮,৮০০ টাকা। এর বাইরে একবার ভর্তি ফি ৩৩,৯০০ টাকা ও লাইব্রেরি সদস্য ফি ২,৫০০ টাকা, প্রতি সেমিস্টারে সেমিস্টার ফি (CSE ও আর্কিটেকচারে ১২,৬০০, ফার্মেসি ও আইনে ১৪,০০০, বাকিগুলোতে ৯,৩৫০ টাকা) এবং সাভারে বাধ্যতামূলক আবাসিক সেমিস্টারের ফি ৮৮,০০০ টাকা লাগে। আর্কিটেকচারে স্টুডিও কোর্সে প্রতি ক্রেডিট ৮,৮০০ টাকা বলে মোট দেখানো হয়নি। ওয়েভার ধরা হয়নি।

about: ব্র্যাক বিশ্ববিদ্যালয় ২০০১ সালে বেসরকারি বিশ্ববিদ্যালয় আইনের অধীনে ব্র্যাকের উদ্যোগে প্রতিষ্ঠিত হয়; প্রতিষ্ঠাতা স্যার ফজলে হাসান আবেদ। এর মূল ক্যাম্পাস ঢাকার মেরুল বাড্ডায়, ২০২৩ সালের নভেম্বর থেকে সেখানে কার্যক্রম চলছে। সব স্নাতক শিক্ষার্থীকে সাভারের আবাসিক ক্যাম্পাসে একটি সেমিস্টার পড়তে হয়।
good:
  - QS ২০২৭ র‍্যাংকিংয়ে ১,০০১–১,২০০ ব্যান্ডে, আগের বছরের চেয়ে এগিয়েছে
  - মেরুল বাড্ডায় নতুন বড় ক্যাম্পাস
  - বছরে তিনটি সেমিস্টারে ভর্তি (স্প্রিং, সামার, ফল)
think:
  - খরচ বেশি; বেশিরভাগ প্রোগ্রামে শুধু টিউশনই ১০ লাখ টাকার কাছাকাছি বা বেশি
  - সাভারে এক সেমিস্টার আবাসিক থাকা বাধ্যতামূলক, ফি আলাদা ৮৮,০০০ টাকা
  - লিখিত পরীক্ষার প্রতিটি অংশে আলাদাভাবে পাস করতে হয়

faq:
  - q: ব্র্যাক বিশ্ববিদ্যালয়ের যোগাযোগ নম্বর কত?
    a: "ব্র্যাক বিশ্ববিদ্যালয়ের মূল নম্বর ০৯৬৩৮৪৬৪৬৪৬; ভর্তি তথ্যের জন্য এক্সটেনশন ১০০১ (অপারেটর) চান। ইমেইল info@bracu.ac.bd।"
  - q: ব্র্যাক বিশ্ববিদ্যালয়ের ভর্তি ফি কত?
    a: "ভর্তি ফি ৩৩,৯০০ টাকা, যা একবার দিতে হয়। ভর্তি ফিসহ প্রথম সেমিস্টারে একটি কোর্স, সেমিস্টার ফি ও লাইব্রেরি ফি মিলিয়ে মোট ৭০,৫০০ টাকা (CSE ও আর্কিটেকচারে ৭৩,৭৫০, আইনে ৭৬,৮০০) লাগে। আবেদন ফি ১,৫০০ টাকা।"
  - q: ব্র্যাক বিশ্ববিদ্যালয়ে ভর্তি হতে কত জিপিএ লাগে?
    a: "SSC ও HSC দুটোতেই আলাদাভাবে কমপক্ষে GPA ৩.৫০ লাগে। ফার্মেসিতে SSC ও HSC মিলিয়ে GPA ৮.০০ লাগে, আর CSE, EEE, ECE-তে HSC-তে পদার্থ ও গণিতে B গ্রেড লাগে।"
  - q: ব্র্যাক বিশ্ববিদ্যালয়ে সিএসই পড়তে কত খরচ?
    a: "CSE-তে ১৩৬ ক্রেডিট, প্রতি ক্রেডিট ৮,২৫০ টাকা; শুধু টিউশন প্রায় ১১,২২,০০০ টাকা। এর বাইরে ভর্তি ফি, প্রতি সেমিস্টারে ১২,৬০০ টাকা সেমিস্টার ফি ও আবাসিক সেমিস্টারের ৮৮,০০০ টাকা লাগে।"
  - q: ব্র্যাক বিশ্ববিদ্যালয়ে এখন ভর্তি চলছে কি?
    a: "স্প্রিং ২০২৭ সেমিস্টারের স্নাতক ভর্তির বিজ্ঞপ্তি এখনো অফিসিয়াল সাইটে আসেনি। স্প্রিং টার্মের পরীক্ষা সাধারণত নভেম্বর ও ডিসেম্বরে হয়; তারিখ জানতে ০৯৬৩৮৪৬৪৬৪৬ নম্বরে ফোন করুন।"
  - q: ব্র্যাক বিশ্ববিদ্যালয়ের র‍্যাংকিং কত?
    a: "QS ওয়ার্ল্ড ইউনিভার্সিটি র‍্যাংকিং ২০২৭-এ ব্র্যাক বিশ্ববিদ্যালয় ১,০০১–১,২০০ ব্যান্ডে আছে। আগের বছর ছিল ১,২০১–১,৪০০ ব্যান্ডে।"
  - q: ব্র্যাক বিশ্ববিদ্যালয় কোথায়?
    a: "ঢাকার মেরুল বাড্ডায়, খ ২২৪ প্রগতি সরণি, ঢাকা-১২১২। আবাসিক সেমিস্টারের ক্যাম্পাস সাভারে।"

