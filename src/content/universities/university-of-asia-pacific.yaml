about: ইউনিভার্সিটি অব এশিয়া প্যাসিফিক (UAP) ১৯৯৬ সালে প্রতিষ্ঠিত ঢাকার একটি বেসরকারি বিশ্ববিদ্যালয়, যা একটি অলাভজনক ফাউন্ডেশন চালায়। ক্যাম্পাস ঢাকার ফার্মগেটের গ্রিন রোডে। আর্কিটেকচার, ইঞ্জিনিয়ারিং, বিজনেস, ফার্মেসি, আইন ও ইংরেজিতে স্নাতক প্রোগ্রাম আছে।
good:
  - শহরের মাঝখানে, ফার্মগেটে ক্যাম্পাস
  - প্রোগ্রামভিত্তিক মোট খরচ অফিসিয়ালি প্রকাশিত
  - SSC ও HSC-তে GPA ৫.০০ হলে প্রথম সেমিস্টারে ৫০–১০০% ওয়েভার
think:
  - ফার্মেসি ও আর্কিটেকচারে খরচ ১১ লাখ টাকার ওপরে
  - আর্কিটেকচার ও ফার্মেসিতে GPA-র শর্ত অন্য বিষয়ের চেয়ে বেশি

faq:
  - q: ইউনিভার্সিটি অব এশিয়া প্যাসিফিকের যোগাযোগ নম্বর কত?
    a: "ভর্তি অফিসের নম্বর ০২৪১০১০৬২৫, PABX ০২৪১০১০৬২৬ (এক্সটেনশন ২১০–২১৫)। মোবাইল ০১৭৩১৬৮১০৮১, ০১৭৬৮৫৪৪২০৮, ০১৭১৪০৮৮৩২১ ও ০১৭৮৯০৫০৩৮৩। ইমেইল admission@uap-bd.edu।"
  - q: ইউনিভার্সিটি অব এশিয়া প্যাসিফিকের ভর্তি ফি কত?
    a: "ভর্তির সময় মোট ২১,৫০০ টাকা লাগে: ভর্তি ফি ১৩,০০০, কো-কারিকুলার ৫,০০০, সনদ যাচাই ও আইডি কার্ড ৫০০ আর ফেরতযোগ্য কশন মানি ৩,০০০ টাকা। আবেদন ফি ১,২০০ টাকা।"
  - q: ইউনিভার্সিটি অব এশিয়া প্যাসিফিকে ভর্তি হতে কত জিপিএ লাগে?
    a: "বেশিরভাগ প্রোগ্রামে SSC ও HSC মিলিয়ে GPA ৬.০০, প্রতিটিতে কমপক্ষে ২.৫০। আর্কিটেকচারে মোট ৭.০০ (প্রতিটিতে ৩.৫০) আর ফার্মেসিতে বিজ্ঞান বিভাগ থেকে মোট ৮.০০ (প্রতিটিতে ৩.৫০) লাগে।"
  - q: ইউনিভার্সিটি অব এশিয়া প্যাসিফিকে সিএসই পড়তে কত খরচ?
    a: "অফিসিয়াল হিসাবে CSE-তে ১৫৩ ক্রেডিট, ৮ সেমিস্টারে মোট খরচ ৮,৩২,৭০০ টাকা। প্রতি সেমিস্টারে রেজিস্ট্রেশন ও টিউশন মিলিয়ে ১,০০,০০০ টাকা।"
  - q: ইউনিভার্সিটি অব এশিয়া প্যাসিফিকে এখন ভর্তি চলছে কি?
    a: "হ্যাঁ, ফল ২০২৬ সেমিস্টারের স্নাতক ভর্তির আবেদন চলছে। বেশিরভাগ প্রোগ্রামে শেষ দিন ৪ ডিসেম্বর ও পরীক্ষা ৭ ডিসেম্বর ২০২৬; ফার্মেসি ও আইনের পরীক্ষা নভেম্বরে।"
  - q: ইউনিভার্সিটি অব এশিয়া প্যাসিফিক কোথায়?
    a: "ঢাকার ফার্মগেটে, ৭৪/এ গ্রিন রোড, ঢাকা-১২০৫।"

