detail:
  open: ইউনিভার্সিটি অব এশিয়া প্যাসিফিকে ফল ২০২৬ সেমিস্টারের স্নাতক ভর্তির আবেদন এখন চলছে।
  close: বেশিরভাগ প্রোগ্রামে আবেদনের শেষ দিন ৪ ডিসেম্বর; ফার্মেসিতে ৬ ও আইনে ৮ নভেম্বর ২০২৬।
  exam: ভর্তি পরীক্ষা ৭ ডিসেম্বর ২০২৬; ফার্মেসির পরীক্ষা ৯ নভেম্বর, আইনের ১০ নভেম্বর।
  elig: বেশিরভাগ প্রোগ্রামে SSC ও HSC মিলিয়ে GPA ৬.০০ লাগে, প্রতিটিতে কমপক্ষে ২.৫০।
  app_fee: ইউনিভার্সিটি অব এশিয়া প্যাসিফিকে স্নাতক ভর্তির আবেদন ফি ১,২০০ টাকা, ফেরত হয় না।
  admission_fee: ভর্তির সময় মোট ২১,৫০০ টাকা লাগে; এর মধ্যে ভর্তি ফি ১৩,০০০ টাকা, ফেরত হয় না।
  cost: অফিসিয়াল হিসাবে মোট খরচ ইংরেজিতে প্রায় ৫.৯৩ লাখ, CSE-তে ৮.৩৩ লাখ, ফার্মেসিতে ১২.৩৩ লাখ।
  rank: QS এশিয়া ইউনিভার্সিটি র‍্যাংকিং ২০২৬-এ ইউনিভার্সিটি অব এশিয়া প্যাসিফিক ৯০১–৯৫০ ব্যান্ডে।
  classes: ফল ২০২৬ সেমিস্টারের ক্লাস শুরুর সম্ভাব্য তারিখ ১০ জানুয়ারি ২০২৭।
  programs: সাতটি স্কুলে ৮টি স্নাতক প্রোগ্রাম; আর্কিটেকচার, CSE, সিভিল, EEE, BBA, ফার্মেসি, আইনসহ।
quick:
  open: ফল ২০২৬-এর আবেদন চলছে
  close: ৪ ডিসেম্বর ২০২৬
  exam: ৭ ডিসেম্বর ২০২৬
  elig: SSC+HSC মিলিয়ে GPA ৬.০০
  app_fee: ১,২০০ টাকা
  admission_fee: ২১,৫০০ টাকা (মোট)
  cost: প্রায় ৫.৯৩–১২.৩৩ লাখ টাকা
  rank: "QS এশিয়া ২০২৬: ৯০১–৯৫০"
  classes: ১০ জানুয়ারি ২০২৭ (সম্ভাব্য)
cost_note: মোট খরচ UAP-এর অফিসিয়াল টিউশন ফি তালিকা থেকে নেওয়া। এতে প্রতি সেমিস্টারের রেজিস্ট্রেশন ও টিউশন ফি, ভর্তির সময়ের ২১,৫০০ টাকা, আবেদন ফি ১,২০০ টাকা ও সমাবর্তন রেজিস্ট্রেশন ফি ১০,০০০ টাকা ধরা আছে। BBA-তে ইন্টার্নশিপ ফি ১০,০০০ ও আইনে IEC-100 কোর্স ফি ৪,০০০ টাকা যোগ আছে। ভর্তির ২১,৫০০ টাকার মধ্যে ফেরতযোগ্য কশন মানি ৩,০০০ টাকা। ওয়েভার ধরা হয়নি।

