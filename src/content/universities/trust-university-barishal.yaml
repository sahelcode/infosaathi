about: ট্রাস্ট ইউনিভার্সিটি, বরিশাল ২০১৮ সালে প্রতিষ্ঠিত একটি অলাভজনক বেসরকারি বিশ্ববিদ্যালয়, UGC অনুমোদিত। রোটারিয়ান অ্যাডভোকেট কাজী শফিকুল আলমের নেতৃত্বে বরিশালের একদল শিক্ষানুরাগী এটি গড়ে তোলেন। বিজ্ঞান ও প্রকৌশল, ব্যবসায় প্রশাসন এবং কলা ও সামাজিক বিজ্ঞান অনুষদে স্নাতক প্রোগ্রাম আছে।
good:
  - UGC অনুমোদিত বেসরকারি বিশ্ববিদ্যালয়
  - বরিশাল শহরের নবগ্রাম রোডে ক্যাম্পাস
think:
  - ভর্তির তারিখ, যোগ্যতা ও ফি অনলাইনে পাওয়া যায় না, ভর্তির আগে অফিসে ফোন করে জেনে নিন
  - তুলনামূলক নতুন বিশ্ববিদ্যালয় (২০১৮)

faq:
  - q: ট্রাস্ট ইউনিভার্সিটি, বরিশালের যোগাযোগ নম্বর কত?
    a: "ভর্তি ও সাধারণ তথ্যের জন্য ০১৮৪৪৯০২০১২ নম্বরে ফোন করুন। ইমেইল info@trustuniversity.edu.bd।"
  - q: ট্রাস্ট ইউনিভার্সিটি, বরিশাল কোথায়?
    a: "বরিশাল শহরের রুইয়া এলাকায়, নবগ্রাম রোডে (বরিশাল-৮২০০)।"
  - q: ট্রাস্ট ইউনিভার্সিটি, বরিশালে কোন কোন বিষয় পড়ানো হয়?
    a: "স্নাতকে ৫টি বিষয়: সিএসই, ইইই, বায়োকেমিস্ট্রি ও মলিকুলার বায়োলজি, বিবিএ এবং ইংরেজি। এগুলো বিজ্ঞান ও প্রকৌশল, ব্যবসায় প্রশাসন এবং কলা ও সামাজিক বিজ্ঞান অনুষদের অধীনে।"
  - q: ট্রাস্ট ইউনিভার্সিটি, বরিশালের ভর্তি ফি কত?
    a: "ভর্তি ফি ও টিউশন ফির তালিকা আমরা অনলাইনে নির্ভরযোগ্য সূত্রে পাইনি। সঠিক অঙ্ক জানতে ০১৮৪৪৯০২০১২ নম্বরে ফোন করুন।"
  - q: ট্রাস্ট ইউনিভার্সিটি, বরিশালে ভর্তি হতে কত জিপিএ লাগে?
    a: "বিশ্ববিদ্যালয়ের নিজস্ব জিপিএ শর্ত আমরা অনলাইনে পাইনি। ভর্তির আগে ০১৮৪৪৯০২০১২ নম্বরে ফোন করে বিষয়ভিত্তিক যোগ্যতা জেনে নিন।"
  - q: ট্রাস্ট ইউনিভার্সিটি, বরিশাল কি UGC অনুমোদিত?
    a: "হ্যাঁ, এটি ২০১৮ সালে প্রতিষ্ঠিত UGC অনুমোদিত একটি বেসরকারি বিশ্ববিদ্যালয়।"

