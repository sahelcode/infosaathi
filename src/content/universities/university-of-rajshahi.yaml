  open: 2026-11-12
  close: 2026-11-27
  requirement: "প্রাথমিক সিদ্ধান্ত (১ নভেম্বর ২০২৬): মানবিকে এসএসসি ও এইচএসসিতে আলাদাভাবে কমপক্ষে জিপিএ ৩.০০, মোট ৬.৫০; বিজ্ঞানে আলাদাভাবে ৩.৫০, মোট ৭.০০; জিপিএ চতুর্থ বিষয়সহ। ব্যবসায় শিক্ষার যোগ্যতা এখনো চূড়ান্ত হয়নি।"
  exam: "বি ইউনিট (ব্যবসায় শিক্ষা) ৮ জানুয়ারি, সি ইউনিট (বিজ্ঞান) ৯ জানুয়ারি এবং এ ইউনিট (মানবিক) ১৬ জানুয়ারি ২০২৭।"
  steps:
    - title: প্রাথমিক আবেদন
      text: admission.ru.ac.bd-এ ১২ থেকে ২৭ নভেম্বর ২০২৬ পর্যন্ত প্রাথমিক আবেদন।
    - title: আবেদন ফি জমা
      text: ২০২৬–২৭-এর ফি এখনো জানানো হয়নি; গত বছর এ ও সি ইউনিটে ১,৩২০ টাকা, বি ইউনিটে ১,১০০ টাকা (সার্ভিস চার্জসহ)।
    - title: ভর্তি পরীক্ষা
      text: বি ইউনিট ৮ জানুয়ারি, সি ইউনিট ৯ জানুয়ারি, এ ইউনিট ১৬ জানুয়ারি ২০২৭। গত বছর পরীক্ষা ছিল ১০০ নম্বরের, ১ ঘণ্টার এমসিকিউ।
    - title: ফল ও বিষয় বরাদ্দ
      text: ইউনিটভিত্তিক মেধাতালিকা প্রকাশের পর ধাপে ধাপে বিষয় বরাদ্দ ও ভর্তি।
  documents:
    - এসএসসি ও এইচএসসির রোল, রেজিস্ট্রেশন ও বোর্ডের তথ্য
    - আবেদনের জন্য সাম্প্রতিক রঙিন ছবি
    - ভর্তির সময় মূল মার্কশিট ও সনদ

