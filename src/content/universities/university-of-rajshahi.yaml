detail:
  open: রাবির ২০২৬–২৭ স্নাতক প্রথম বর্ষের প্রাথমিক আবেদন শুরু ১২ নভেম্বর ২০২৬, admission.ru.ac.bd-এ।
  close: রাবির ২০২৬–২৭ প্রাথমিক আবেদনের শেষ দিন ২৭ নভেম্বর ২০২৬; এরপর আর আবেদন নেওয়া হবে না।
  exam: রাবির ভর্তি পরীক্ষা বি ইউনিট ৮ জানুয়ারি, সি ইউনিট ৯ জানুয়ারি, এ ইউনিট ১৬ জানুয়ারি ২০২৭।
  elig: প্রাথমিক সিদ্ধান্তে মানবিকে মোট জিপিএ ৬.৫০ ও বিজ্ঞানে ৭.০০ লাগবে; ব্যবসায় শিক্ষায় এখনো ঠিক হয়নি।
  app_fee: ২০২৬–২৭-এর আবেদন ফি এখনো জানানো হয়নি; গত বছর এ ও সি ইউনিটে ১,৩২০, বি ইউনিটে ১,১০০ টাকা।
  seats: গত বছর (২০২৫–২৬) রাবিতে মোট ৪,০১৭টি আসন ছিল; শুধু এ ইউনিটে ১,৮৯৭টি আসন।
  competition: গত বছর ২,৭২,৬২৫টি আবেদন পড়ে ৪,০১৭ আসনে; আসনপ্রতি প্রায় ৬৮ জন (আমাদের হিসাব)।
  rank: কিউএস (QS) বিশ্ব র‍্যাংকিং ২০২৭-এ রাজশাহী বিশ্ববিদ্যালয় ১৪০১+ ধাপে; ২০২৬-এ ছিল ১২০১–১৪০০।
  programs: ১২টি অনুষদের ৫৯টি বিভাগে স্নাতক; এ, বি ও সি তিন ইউনিটে ভর্তি পরীক্ষা হয়।
quick:
  open: ১২ নভেম্বর ২০২৬
  close: ২৭ নভেম্বর ২০২৬
  exam: ৮, ৯ ও ১৬ জানুয়ারি ২০২৭
  elig: মানবিক ৬.৫০, বিজ্ঞান ৭.০০ (প্রাথমিক)
  app_fee: গত বছর ১,১০০–১,৩২০ টাকা
  seats: গত বছর ৪,০১৭টি
  competition: গত বছর আসনপ্রতি ~৬৮ জন
  rank: "QS ২০২৭: ১৪০১+"
about: রাজশাহী বিশ্ববিদ্যালয় ১৯৫৩ সালে প্রতিষ্ঠিত সরকারি বিশ্ববিদ্যালয়, রাজশাহীর মতিহারে পদ্মার কাছে ৭৫৩ একরের ক্যাম্পাসে অবস্থিত। এখানে ১২টি অনুষদের ৫৯টি বিভাগ ও ছয়টি ইনস্টিটিউটে ৩০ হাজারের বেশি শিক্ষার্থী পড়েন, শিক্ষক ১,২০০-র বেশি। স্নাতক প্রথম বর্ষে ভর্তি হয় এ, বি ও সি ইউনিটের নিজস্ব ভর্তি পরীক্ষায়।
good:
  - বড় সবুজ ক্যাম্পাস, ৭৫৩ একর
  - ৫৯টি বিভাগে বিষয় বেছে নেওয়ার বড় সুযোগ, সিএসই, ইইই, ফার্মেসি, আইনসহ
  - ২০২৬–২৭-এ জিপিএ শর্ত কিছুটা কমানো হয়েছে, তাই বেশি শিক্ষার্থী আবেদন করতে পারবেন
think:
  - "প্রতিযোগিতা অনেক: গত বছর (২০২৫–২৬) এ ইউনিটে ১,১১,৫১৪ জন ১,৮৯৭ আসনে লড়েছেন"
  - আবেদনের সময় মাত্র ১৬ দিন (১২–২৭ নভেম্বর), দেরি করবেন না
  - জিপিএ শর্ত প্রাথমিক সিদ্ধান্ত; চূড়ান্ত বিজ্ঞপ্তি admission.ru.ac.bd-এ দেখে নিন

faq:
  - q: রাজশাহী বিশ্ববিদ্যালয় ভর্তি পরীক্ষা ২০২৬–২৭ কবে?
    a: "বি ইউনিট (ব্যবসায় শিক্ষা) ৮ জানুয়ারি, সি ইউনিট (বিজ্ঞান) ৯ জানুয়ারি এবং এ ইউনিট (মানবিক) ১৬ জানুয়ারি ২০২৭। পরীক্ষা শুরু হবে বি ইউনিট দিয়ে।"
  - q: রাবিতে ভর্তির আবেদন কবে শুরু ও শেষ?
    a: "প্রাথমিক আবেদন চলবে ১২ থেকে ২৭ নভেম্বর ২০২৬ পর্যন্ত, admission.ru.ac.bd-এ।"
  - q: রাজশাহী বিশ্ববিদ্যালয়ে ভর্তির যোগ্যতা কত জিপিএ?
    a: "১ নভেম্বর ২০২৬-এর প্রাথমিক সিদ্ধান্তে মানবিকে এসএসসি ও এইচএসসিতে আলাদাভাবে কমপক্ষে ৩.০০ ও মোট ৬.৫০, বিজ্ঞানে আলাদাভাবে ৩.৫০ ও মোট ৭.০০ জিপিএ লাগবে, চতুর্থ বিষয়সহ। ব্যবসায় শিক্ষার যোগ্যতা এখনো চূড়ান্ত হয়নি।"
  - q: রাবি ভর্তির আবেদন ফি কত?
    a: "২০২৬–২৭-এর আবেদন ফি এখনো জানানো হয়নি। গত বছর (২০২৫–২৬) এ ও সি ইউনিটে ১,৩২০ টাকা এবং বি ইউনিটে ১,১০০ টাকা ছিল, সার্ভিস চার্জসহ।"
  - q: রাজশাহী বিশ্ববিদ্যালয়ের আসন সংখ্যা কত?
    a: "২০২৬–২৭-এর আসন এখনো জানা যায়নি। গত বছর (২০২৫–২৬) মোট ৪,০১৭টি আসন ছিল, এর মধ্যে এ ইউনিটে ১,৮৯৭টি।"
  - q: রাজশাহী বিশ্ববিদ্যালয়ের যোগাযোগ নম্বর কী?
    a: "বিশ্ববিদ্যালয়ের ওয়েবসাইটে দেওয়া ফোন নম্বর ০২৫৮৮৮৬৫০১১। রেজিস্ট্রার অফিসের ইমেইল registrar@ru.ac.bd।"
  - q: রাজশাহী বিশ্ববিদ্যালয় কোথায় অবস্থিত?
    a: "রাজশাহী বিশ্ববিদ্যালয় রাজশাহী শহরের মতিহারে, শহরের কেন্দ্র থেকে প্রায় ৭ কিলোমিটার পূর্বে। ঠিকানা রাজশাহী-৬২০৫।"

