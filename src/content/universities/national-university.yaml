admission:
  intake: ২০২৬–২৭ শিক্ষাবর্ষ (অনার্স প্রথম বর্ষ)
  requirement: "২০২৬–২৭-এর ভর্তি বিজ্ঞপ্তি এখনো আসেনি। গত বছর (২০২৫–২৬) অধিভুক্ত কলেজে অনার্সে আবেদন করতে পেরেছিলেন ২০২২ বা ২০২৩ সালে এসএসসি এবং ২০২৪ বা ২০২৫ সালে এইচএসসি পাস শিক্ষার্থীরা; মেধাতালিকায় আসতে ভর্তি পরীক্ষায় কমপক্ষে ৩৫ নম্বর লাগত। অন-ক্যাম্পাস স্নাতকে মানবিক ও ব্যবসায় শিক্ষায় এসএসসি ও এইচএসসি প্রতিটিতে ন্যূনতম জিপিএ ৩.০০ এবং মোট ৬.৫০, বিজ্ঞানে প্রতিটিতে ৩.৫০ এবং মোট ৭.৫০ লাগত।"
  exam: "গত বছর (২০২৫–২৬) প্রথমবার অনার্স ভর্তি পরীক্ষা হয় ২৫ এপ্রিল ২০২৬, সকাল ১১টা থেকে ১২টা, ১৩৮টি কেন্দ্রে। মানবিক, বিজ্ঞান ও ব্যবসায় শিক্ষার জন্য আলাদা ১০০ নম্বরের এমসিকিউ, ১০০ প্রশ্ন, সময় ১ ঘণ্টা, ভুল উত্তরে নম্বর কাটা নেই। মেধাতালিকা ২০০ নম্বরে: পরীক্ষার ১০০ এবং এসএসসি-এইচএসসির জিপিএ থেকে ১০০ (এসএসসি ৪০%, এইচএসসি ৬০%)।"
  classes_start: গত বছর (২০২৫–২৬) প্রথম বর্ষের ক্লাস শুরু হয় ২ জুন ২০২৬
  steps:
    - title: অনলাইনে আবেদন
      text: ভর্তি পোর্টালে (app11.nu.edu.bd) ফরম পূরণ করে কলেজ ও বিষয় পছন্দক্রম দিন; গত বছর আবেদন ফি ছিল ১,০০০ টাকা।
    - title: ভর্তি পরীক্ষা
      text: বিভাগ ও জেলা শহরের কেন্দ্রে ১০০ নম্বরের এমসিকিউ পরীক্ষা।
    - title: মেধাতালিকা
      text: প্রতিটি কলেজের জন্য বিষয়ভিত্তিক মেধাতালিকা হয়; ফল ওয়েবসাইট ও এসএমএসে পাওয়া যায়।
    - title: চূড়ান্ত ভর্তি
      text: অনলাইনে চূড়ান্ত ভর্তি ফরম পূরণ করে কলেজে রেজিস্ট্রেশন ফি জমা দিন; গত বছর ছিল ১,১৩০ টাকা।
  documents:
    - এসএসসি ও এইচএসসির মার্কশিট
    - অনলাইন আবেদন ও চূড়ান্ত ভর্তি ফরমের প্রিন্ট কপি
    - পাসপোর্ট সাইজ ছবি

