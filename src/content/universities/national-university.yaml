about: জাতীয় বিশ্ববিদ্যালয় ১৯৯২ সালে সংসদের আইনে প্রতিষ্ঠিত একটি সরকারি বিশ্ববিদ্যালয়, প্রধান কার্যালয় গাজীপুরে। সারা দেশের অধিভুক্ত সরকারি ও বেসরকারি কলেজে এর অনার্স, ডিগ্রি ও মাস্টার্স পড়ানো হয়; ২০২৫–২৬ শিক্ষাবর্ষে ৮৮০টি কলেজে অনার্সে ভর্তি হয়েছে। গাজীপুরের মূল ক্যাম্পাসে চারটি বিষয়ে চার বছরের অন-ক্যাম্পাস স্নাতকও আছে।
good:
  - দেশের প্রায় সব জেলায় অধিভুক্ত কলেজ, বাড়ির কাছে অনার্স পড়া যায়
  - গত বছর আসন ছিল প্রায় আবেদনকারীর সমান
