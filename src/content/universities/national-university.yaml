faq:
  - q: জাতীয় বিশ্ববিদ্যালয়ের যোগাযোগ নম্বর কত?
    a: "রেজিস্ট্রার অফিসের টেলিফোন ০২-৯৯৬৬৯১৫১৬, ইমেইল registrar@nu.ac.bd। ভর্তির তথ্য ভর্তি পোর্টাল app11.nu.edu.bd-এ পাওয়া যায়।"
  - q: জাতীয় বিশ্ববিদ্যালয়ে অনার্সে ভর্তি হতে কত টাকা লাগে?
    a: "গত বছর (২০২৫–২৬) আবেদন ফি ১,০০০ টাকা এবং চূড়ান্ত ভর্তিতে রেজিস্ট্রেশন ফি ১,১৩০ টাকা ছিল; কলেজের নিজস্ব ফি আলাদা। গাজীপুর ক্যাম্পাসের অন-ক্যাম্পাস স্নাতকে মোট ১৫,১৪৫ টাকা লাগত।"
  - q: জাতীয় বিশ্ববিদ্যালয়ে অনার্সে ভর্তির যোগ্যতা কী?
    a: "২০২৬–২৭-এর যোগ্যতা এখনো ঘোষণা হয়নি। গত বছর ২০২২ বা ২০২৩ সালে এসএসসি এবং ২০২৪ বা ২০২৫ সালে এইচএসসি পাস শিক্ষার্থীরা আবেদন করতে পেরেছিলেন, আর ভর্তি পরীক্ষায় কমপক্ষে ৩৫ নম্বর লাগত। অন-ক্যাম্পাস স্নাতকে মানবিক ও ব্যবসায়ে প্রতিটিতে জিপিএ ৩.০০ (মোট ৬.৫০), বিজ্ঞানে ৩.৫০ (মোট ৭.৫০) লাগত।"
  - q: জাতীয় বিশ্ববিদ্যালয়ে অনার্সে আসন কতটি?
    a: "গত বছর (২০২৫–২৬) ৮৮০টি কলেজে মোট ৪,৫২,৮৭৫টি আসন ছিল: ৩৭৫টি সরকারি কলেজে ২,৭০,৫২০টি এবং ৫০৫টি বেসরকারি কলেজে ১,৮২,৩৫৫টি।"
  - q: জাতীয় বিশ্ববিদ্যালয়ের ভর্তি পরীক্ষা কীভাবে হয়?
    a: "১০০ নম্বরের এমসিকিউ পরীক্ষা, ১০০টি প্রশ্ন, সময় ১ ঘণ্টা, ভুল উত্তরে নম্বর কাটা যায় না। গত বছর পরীক্ষা হয় ২৫ এপ্রিল ২০২৬; মেধাতালিকা হয় পরীক্ষার ১০০ ও জিপিএর ১০০ মিলিয়ে ২০০ নম্বরে।"
  - q: জাতীয় বিশ্ববিদ্যালয় কোথায় অবস্থিত?
    a: "জাতীয় বিশ্ববিদ্যালয়ের প্রধান ক্যাম্পাস ও প্রশাসনিক ভবন গাজীপুরের বোর্ড বাজারে, ঠিকানা জাতীয় বিশ্ববিদ্যালয়, গাজীপুর-১৭০৪।"

