faq:
  - q: ইবনে সিনা হাসপাতাল সিলেটে আইসিইউ আছে কি?
    a: "হ্যাঁ, ক্রিটিক্যাল কেয়ার ইউনিট আছে। বেড খালি আছে কি না জানতে ০৯৬১০-০০৯৬৪০ নম্বরে ফোন করুন।"
  - q: ইবনে সিনা হাসপাতাল সিলেটে ডায়ালাইসিস হয় কি?
    a: "হ্যাঁ, ডায়ালাইসিস সেবা আছে। সময় জানতে ০৯৬১০-০০৯৬৪০ নম্বরে ফোন করুন।"
  - q: ইবনে সিনা হাসপাতাল সিলেটে কোন কোন বিভাগে ডাক্তার বসেন?
    a: "মেডিসিন, কার্ডিওলজি, গাইনি ও প্রসূতিসহ বিভিন্ন বিভাগে ডাক্তার বসেন। পুরো তালিকা হাসপাতালের ওয়েবসাইটে আছে। সিরিয়ালের আগে ফোনে সময় জেনে নিন।"
  - q: ইবনে সিনা হাসপাতাল সিলেটে আর কী কী সেবা আছে?
    a: "ডায়াগনস্টিক, কনসালটেশন, ফিজিওথেরাপি, ডেন্টাল, ফ্রি মেডিকেল সেবা ও ২৪ ঘণ্টা ফার্মেসি আছে।"
  - q: ইবনে সিনা হাসপাতাল সিলেটের ইমেইল কী?
    a: "info@ibnsinahospitalsylhet.com.bd"

