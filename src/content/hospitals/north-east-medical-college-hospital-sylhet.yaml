faq:
  - q: নর্থ ইস্ট মেডিকেল কলেজ হাসপাতালে কতটি বেড (শয্যা) আছে?
    a: "৮০০ বেড। আইসিইউ, সিসিইউ, এনআইসিইউ ও পিআইসিইউ ইউনিট আছে। সম্প্রতি নতুন সিসিইউ ব্লক ও কেবিন ব্লক চালু হয়েছে।"
  - q: নর্থ ইস্ট মেডিকেল কলেজ হাসপাতালে এমআরআই ও সিটি স্ক্যান আছে কি?
    a: "হ্যাঁ। রেডিওলজি বিভাগে এমআরআই, সিটি স্ক্যান, এক্স-রে ও আল্ট্রাসনোগ্রাম হয়। ফি জানতে ০১৭১৫-৯৪৪৭৩৩ নম্বরে ফোন করুন।"
  - q: নর্থ ইস্ট মেডিকেল কলেজ হাসপাতালে কোন কোন বিভাগে ডাক্তার বসেন?
    a: "মেডিসিন, সার্জারি, কার্ডিওলজি, নিউরোলজি, নিউরোসার্জারি, নেফ্রোলজি, ক্যান্সারসহ বিভিন্ন বিভাগে ডাক্তার বসেন। হাসপাতালের ওয়েবসাইটে অনলাইনে সিরিয়াল নেওয়া যায়।"
  - q: নর্থ ইস্ট মেডিকেল কলেজ হাসপাতালে অ্যাম্বুলেন্স সেবা আছে কি?
    a: "হ্যাঁ, আইসিইউ অ্যাম্বুলেন্স আছে। ০১৭৯৪-৪৪৮৯০৫ বা হটলাইন ০১৭১৫-৯৪৪৭৩৩ নম্বরে ফোন করুন।"
  - q: নর্থ ইস্ট মেডিকেল কলেজ হাসপাতালে ক্যান্সারের চিকিৎসা হয় কি?
    a: "হ্যাঁ। এখানে আলাদা নর্থ ইস্ট ক্যান্সার হাসপাতাল আছে, রেডিওথেরাপি ও কেমোথেরাপি হয়। তথ্যকেন্দ্র: ০১৭৯৯-৪৫৬৯২৬।"

