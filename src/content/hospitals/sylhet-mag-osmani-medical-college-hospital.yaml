faq:
  - q: ওসমানী মেডিকেল কলেজ হাসপাতালে কতটি বেড (শয্যা) আছে?
    a: "৯০০ বেড। ১৯৬২ সালে ৩০০ বেড নিয়ে শুরু, ১৯৯৮ সালে ৯০০ বেড হয়। আইসিইউ ও সিসিইউ আছে।"
  - q: ওসমানী মেডিকেলে কোন কোন বিভাগে ডাক্তার আছেন?
    a: "মেডিসিন, সার্জারি, গাইনি, শিশু, কার্ডিওলজি, নিউরোমেডিসিন, নিউরোসার্জারি, নেফ্রোলজি, অর্থোপেডিক্স, ইউরোলজি, চর্ম, চক্ষু, মানসিক রোগ, অনকোলজি, বার্ন ও প্লাস্টিক সার্জারি এবং ডেন্টাল বিভাগ আছে।"
  - q: ওসমানী মেডিকেলে ডায়ালাইসিস হয় কি?
    a: "হ্যাঁ, হাসপাতালে আলাদা ডায়ালাইসিস বিভাগ ও নেফ্রোলজি বিভাগ আছে। সিরিয়ালের জন্য ০২৯৯৬৬৩১২১৩ নম্বরে ফোন করুন।"
  - q: ওসমানী মেডিকেলে অ্যাম্বুলেন্স সেবা আছে কি?
    a: "হ্যাঁ, জরুরি রোগীর জন্য অ্যাম্বুলেন্স সেবা আছে। আলাদা নম্বর নেই, ০২৯৯৬৬৩১২১৩ নম্বরে ফোন করুন।"

