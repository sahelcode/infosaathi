about: সিলেটের কাজলশাহে ৯০০ বেডের সরকারি মেডিকেল কলেজ হাসপাতাল। ১৯৬২ সালে ৩০০ বেড নিয়ে যাত্রা শুরু, ১৯৯৮ সালে ৯০০ বেড হয়। ২৪ ঘণ্টা জরুরি বিভাগ, আইসিইউ, সিসিইউ, ডায়ালাইসিস ও অ্যাম্বুলেন্স সেবা আছে।

