faq:
  - q: মাউন্ট এডোরা হাসপাতাল আখালিয়ায় কতটি বেড আছে?
    a: "৩০০ বেড। আইসিইউ, সিসিইউ, এইচডিইউ, এনআইসিইউ ও পিআইসিইউ ইউনিট আছে। নয়াসড়ক শাখায় আরও ১০০ বেড আছে।"
  - q: মাউন্ট এডোরা হাসপাতাল আখালিয়ায় এমআরআই ও সিটি স্ক্যান আছে কি?
    a: "হ্যাঁ। ১.৫ টেসলা এমআরআই ও ১২৮-স্লাইস সিটি স্ক্যান আছে। ফি জানতে ০৯৬১০-৮৪৮৪৮৪ নম্বরে ফোন করুন।"
  - q: মাউন্ট এডোরা হাসপাতালে ডায়ালাইসিস খরচ কত?
    a: "প্রতি সেশন ২,২০০ টাকা (অফিসিয়াল সাইট)। আখালিয়ায় ১১টি ডায়ালাইসিস বেড আছে। জরুরি ডায়ালাইসিস ২৪ ঘণ্টা হয়।"
  - q: মাউন্ট এডোরা হাসপাতালে কোন কোন বিভাগে ডাক্তার বসেন?
    a: "৩২টি বিভাগে ১৩৮ জন কনসালট্যান্ট আছেন (অফিসিয়াল সাইট)। যেমন মেডিসিন, কার্ডিওলজি, নিউরোলজি, নিউরোসার্জারি, শিশু, গাইনি, অর্থোপেডিক্স ও নেফ্রোলজি। সিরিয়ালের আগে ফোনে সময় জেনে নিন।"
  - q: মাউন্ট এডোরা হাসপাতাল আখালিয়ার অ্যাম্বুলেন্স নম্বর কী?
    a: "০১৭১১-৪০৭৪৫৭। অ্যাম্বুলেন্স সেবা ২৪ ঘণ্টা। হটলাইন ০৯৬১০-৮৪৮৪৮৪-এও ফোন করতে পারেন।"
  - q: মাউন্ট এডোরা হাসপাতালের ইমেইল কী?
    a: "info@mountadora.com"

