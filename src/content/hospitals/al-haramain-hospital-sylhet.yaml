faq:
  - q: আল হারামাইন হাসপাতালে কতটি বেড (শয্যা) আছে?
    a: "২৫০ বেড। আইসিইউ, এইচডিইউ, সিসিইউ, এনআইসিইউ ও পিআইসিইউ ইউনিট আছে। ৫০০ বেডে বাড়ানোর পরিকল্পনা আছে।"
  - q: আল হারামাইন হাসপাতালে এমআরআই ও সিটি স্ক্যান আছে কি?
    a: "হ্যাঁ। ৩ টেসলা এমআরআই, ২৫৬-স্লাইস সিটি স্ক্যান, এক্স-রে ও ল্যাব ২৪ ঘণ্টা চালু। ফি জানতে ০১৯৩১-২২৫৫৫৫ নম্বরে ফোন করুন।"
  - q: আল হারামাইন হাসপাতালে কোন কোন বিভাগে ডাক্তার বসেন?
    a: "২৪টি বিভাগে ৫২ জন ডাক্তার আছেন (অফিসিয়াল তালিকা, অক্টোবর ২০২৬)। যেমন মেডিসিন, শিশু, গাইনি, কার্ডিওলজি, নিউরোলজি, অর্থোপেডিক্স, ইউরোলজি, চর্ম, ইএনটি ও চক্ষু। সিরিয়ালের আগে ফোনে সময় জেনে নিন।"
  - q: আল হারামাইন হাসপাতালে অ্যাম্বুলেন্স সেবা আছে কি?
    a: "হ্যাঁ, ২৪ ঘণ্টা। আলাদা নম্বর নেই, ০৮২১-৭২৯৯৮১ বা ০১৯৩১-২২৫৫৫৫-এ ফোন করুন।"

