faq:
  - q: আল হারামাইন হাসপাতালে কতটি শয্যা আছে?
    a: "অফিসিয়াল সাইট অনুযায়ী ২৫০ শয্যা। সাইটে ৫০০ শয্যায় সম্প্রসারণের পরিকল্পনার কথাও আছে। আইসিইউ, এইচডিইউ, সিসিইউ, এনআইসিইউ ও পিআইসিইউ ইউনিট আছে, তবে প্রতি ইউনিটের শয্যা সংখ্যা সাইটে দেওয়া নেই।"
  - q: আল হারামাইন হাসপাতালে এমআরআই ও সিটি স্ক্যান আছে কি?
    a: "হ্যাঁ। অফিসিয়াল সাইটে ৩ টেসলা এমআরআই, ২৫৬-স্লাইস সিটি স্ক্যান, ডিজিটাল এক্স-রে ও প্যাথলজি ল্যাবের কথা আছে, এগুলো ২৪ ঘণ্টা চালু বলা হয়েছে। পরীক্ষার ফি সাইটে দেওয়া নেই, হাসপাতালে জেনে নিন।"
  - q: আল হারামাইন হাসপাতালে কোন কোন বিভাগে ডাক্তার বসেন?
    a: "অফিসিয়াল তালিকায় (অক্টোবর ২০২৬) ২৪টি বিভাগে ৫২ জন চিকিৎসক আছেন: মেডিসিন, শিশু, গাইনি ও প্রসূতি, কার্ডিওলজি, নিউরোলজি, নিউরোসার্জারি, অর্থোপেডিক্স, ইউরোলজি, নেফ্রোলজি, গ্যাস্ট্রোএন্টারোলজি, চর্ম, ইএনটি, চক্ষু, ডেন্টাল ও আরও কয়েকটি। ডাক্তারের সময়সূচি বদলাতে পারে, সিরিয়ালের আগে ফোনে জেনে নিন।"
  - q: আল হারামাইন হাসপাতালে অ্যাম্বুলেন্স সেবা আছে কি?
    a: "হ্যাঁ, অফিসিয়াল সাইট অনুযায়ী ২৪ ঘণ্টা অ্যাম্বুলেন্স সেবা আছে। অ্যাম্বুলেন্সের আলাদা নম্বর সাইটে নেই, তাই প্রধান নম্বর ০৮২১-৭২৯৯৮১ বা ০১৯৩১-২২৫৫৫৫-এ ফোন করুন।"

