faq:
  - q: মাউন্ট এডোরা হাসপাতাল নয়াসড়কে কতটি বেড আছে?
    a: "১০০ বেড (অফিসিয়াল সাইট)। নিউরোলজি উইং ও ইকোনমি ওয়ার্ড আছে। আখালিয়া শাখায় আরও ৩০০ বেড আছে।"
  - q: মাউন্ট এডোরা নয়াসড়কে ডায়ালাইসিস হয় কি? খরচ কত?
    a: "হ্যাঁ। নয়াসড়কে ১০টি ডায়ালাইসিস বেড আছে। প্রতি সেশন ২,২০০ টাকা (অফিসিয়াল সাইট)। জরুরি ডায়ালাইসিস ২৪ ঘণ্টা হয়।"
  - q: মাউন্ট এডোরা হাসপাতাল নয়াসড়কের অ্যাম্বুলেন্স নম্বর কী?
    a: "০১৩৩৪-৯১২৪০৮। অ্যাম্বুলেন্স সেবা ২৪ ঘণ্টা। হটলাইন ০৯৬১০-৮৫৮৫৮৫-এও ফোন করতে পারেন।"
  - q: মাউন্ট এডোরা নয়াসড়কে কি নিউরোলজির ডাক্তার বসেন?
    a: "হ্যাঁ। নয়াসড়ক শাখায় নিউরোলজি উইং আছে। নিউরোলজি বিশেষজ্ঞরা নিয়মিত বসেন। সিরিয়ালের জন্য ০৯৬১০-৮৫৮৫৮৫ নম্বরে ফোন করুন।"
  - q: মাউন্ট এডোরা নয়াসড়কে বাসা থেকে টেস্টের নমুনা নেয় কি?
    a: "হ্যাঁ। হোম স্যাম্পল কালেকশনের জন্য ০১৩১৮-২১০০০২ বা ০১৭১১-৪০৭৬৪২ নম্বরে ফোন করুন।"
  - q: মাউন্ট এডোরা হাসপাতাল নয়াসড়কের ইমেইল কী?
    a: "adorahospital@gmail.com"

