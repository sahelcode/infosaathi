faq:
  - q: রাগীব-রাবেয়া মেডিকেল কলেজ হাসপাতালে কতটি বেড আছে?
    a: "৮০০ বেড। এর ১০% বেড ফ্রি রোগীদের জন্য। আইসিইউ আছে।"
  - q: রাগীব-রাবেয়া হাসপাতালে অ্যাম্বুলেন্স সেবা আছে কি?
    a: "হ্যাঁ, অ্যাম্বুলেন্স সেবা আছে। আলাদা নম্বর নেই, ২৪ ঘণ্টা হটলাইন ০১৭৭৯-৯০০০১৬ নম্বরে ফোন করুন।"
  - q: রাগীব-রাবেয়া হাসপাতালে কোন কোন বিভাগে ডাক্তার বসেন?
    a: "মেডিসিন, সার্জারি, গাইনি ও প্রসূতি, শিশু, কার্ডিওলজি, নিউরোলজি, অর্থোপেডিক্স, ইউরোলজি, অনকোলজি, চক্ষু, নাক-কান-গলা, চর্ম, মানসিক রোগ ও ডেন্টাল বিভাগ আছে। সিরিয়ালের আগে ফোনে সময় জেনে নিন।"
  - q: রাগীব-রাবেয়া হাসপাতালে ব্লাড ব্যাংক আছে কি?
    a: "হ্যাঁ, হাসপাতালের নিজস্ব ব্লাড ব্যাংক ও ট্রান্সফিউশন মেডিসিন বিভাগ আছে।"

