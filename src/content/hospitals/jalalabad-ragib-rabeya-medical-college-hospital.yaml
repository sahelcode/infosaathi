about: সিলেটের পাঠানটুলায় ১৯৯৫ সালে প্রতিষ্ঠিত বেসরকারি মেডিকেল কলেজ হাসপাতাল। ৮০০ বেডের এই হাসপাতালে ২৪ ঘণ্টা জরুরি বিভাগ, আইসিইউ, ব্লাড ব্যাংক ও অ্যাম্বুলেন্স আছে।

