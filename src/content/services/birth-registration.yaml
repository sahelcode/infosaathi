name: "জন্মনিবন্ধন"
name_en: "Birth Registration"
dept: "স্থানীয় সরকার বিভাগ / রেজিস্ট্রার জেনারেল, বিডিআরআইএস"
category: "পরিচয় ও নিবন্ধন"
summary: "বিডিআরআইএস পোর্টালে অনলাইনে ফরম পূরণ করে প্রিন্ট নিয়ে স্থানীয় নিবন্ধন কার্যালয়ে জমা দিলে জন্মনিবন্ধন সনদ পাওয়া যায়।"
portal_url: "https://bdris.gov.bd/"
online: true
time: "৭–১৫ দিন"
fees:
  - { item: "নতুন নিবন্ধন (জন্মের ৪৫ দিনের মধ্যে)", amount: "বিনামূল্যে" }
  - { item: "দেরিতে নিবন্ধন (৪৬ দিন থেকে ৫ বছর)", amount: "২৫ টাকা" }
  - { item: "দেরিতে নিবন্ধন (৫ বছরের পরে)", amount: "৫০ থেকে ৫০০ টাকা" }
  - { item: "জন্মতারিখ সংশোধন", amount: "১০০ টাকা" }
  - { item: "নাম, বাবা-মা বা ঠিকানা সংশোধন ও সনদের অনুলিপি", amount: "৫০ টাকা" }
fee_note: "সূত্রভেদে ভিন্ন, পোর্টালে দেখুন। ফির তালিকা ২০১৭ সালের গেজেট অনুযায়ী প্রকাশিত পুরোনো প্রতিবেদন থেকে নেওয়া; ৫ বছরের পরে দেরিতে নিবন্ধনের ফি এক সূত্রে ৫০ টাকা, অন্য সূত্রে ৫০০ টাকা। সংশোধনে ধরনভেদে ৫০–২০০ টাকা বলেছে একটি ২০২৫ সালের প্রতিবেদন। ইংরেজি কপির আলাদা ফি কোনো সূত্রে পাওয়া যায়নি। সনদ বাংলা ও ইংরেজি দুই ভাষায় পাওয়া যায়।"
documents:
  - "হাসপাতালের ছাড়পত্র অথবা টিকা কার্ড (দুইটির যেকোনো একটি)"
  - "সংশোধনের ক্ষেত্রে যা সংশোধন করা হবে তার প্রমাণপত্রের স্ক্যান কপি"
  - "অনলাইন আবেদনের প্রিন্ট কপি"
steps:
  - { title: "পোর্টালে যান", text: "bdris.gov.bd/br/application ঠিকানায় গিয়ে আবেদন শুরু করুন" }
  - { title: "ফরম পূরণ", text: "স্থায়ী ও বর্তমান ঠিকানাসহ সব তথ্য সঠিকভাবে পূরণ করুন" }
  - { title: "জমা দিন", text: "পূরণ করা ফরম অনলাইনে সাবমিট করুন" }
  - { title: "প্রিন্ট ও কার্যালয়ে জমা", text: "আবেদনের প্রিন্ট কপি ও প্রয়োজনীয় কাগজ নিয়ে সংশ্লিষ্ট ওয়ার্ড অফিসে জমা দিন" }
  - { title: "নিবন্ধন নম্বর", text: "অনুমোদনের পর ১৭ ডিজিটের জন্মনিবন্ধন নম্বর তৈরি হয়" }
helpline: []
tips:
  - "সংশোধন: bdris.gov.bd/br/correction-এ ফরম পূরণ ও প্রিভিউ দেখে সাবমিট করে প্রিন্ট নিন, তারপর প্রিন্ট, মূল কাগজ ও ফির রসিদ ইউনিয়ন পরিষদ, পৌরসভা বা সিটি করপোরেশনের কার্যালয়ে জমা দিন"
  - "সংশোধনের ফি বিকাশ, নগদে বা ব্যাংক চালানে দেওয়ার কথা এক প্রতিবেদনে আছে; সংশোধনে সময় লাগে সাধারণত ৭–১৫ দিন"
  - "একজন ব্যক্তি সর্বোচ্চ তিনবার জন্মনিবন্ধন সংশোধনের আবেদন করতে পারেন"
  - "নাম, বাবা-মায়ের নাম ও ঠিকানায় ভুল কমাতে নিজে আবেদন করুন"
  - "সনদ যাচাই করুন everify.bdris.gov.bd-এ"
  - "ফির পরিমাণ নিয়ে ২০২৪ সালের প্রতিবেদনে সরকারি হারের বাইরে বেশি টাকা চাওয়ার অভিযোগ ছিল; সরকারি হারের রসিদ চেয়ে নিন"
faq:
  - { q: "জন্মনিবন্ধন সনদ অনলাইনে কীভাবে যাচাই করব?", a: "everify.bdris.gov.bd ঠিকানায় গিয়ে যাচাই করা যায়।" }
  - { q: "বাবা-মায়ের জন্মসনদ লাগবে কি?", a: "২০২২ সালের জুলাই থেকে শিশুর নিবন্ধনে বাবা-মায়ের জন্মসনদ আগের মতো চাওয়া হয় না; হাসপাতালের ছাড়পত্র বা টিকা কার্ড হলে চলে।" }
  - { q: "অনলাইনে কি ফি দেওয়া যায়?", a: "২০২৩ সালে ই-পেমেন্ট চালু হলেও নভেম্বর ২০২৩ থেকে তা বন্ধ থাকার কথা মে ২০২৪-এর প্রতিবেদনে আছে; তখন স্থানীয় অফিসে নগদে দিতে হতো। বর্তমান অবস্থা পোর্টালে দেখুন।" }
  - { q: "হেল্পলাইন নম্বর কত?", a: "কোনো সূত্রে হেল্পলাইন নম্বর পাওয়া যায়নি; বিডিআরআইএস পোর্টালে দেখুন।" }
