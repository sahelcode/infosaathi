name: ড্রাইভিং লাইসেন্স
name_en: Driving Licence (BRTA Smart Card)
dept: বাংলাদেশ সড়ক পরিবহন কর্তৃপক্ষ (বিআরটিএ)
category: পরিবহন
summary: প্রথমে লার্নার লাইসেন্স, তারপর লিখিত, মৌখিক ও ব্যবহারিক পরীক্ষা পাস করে স্মার্ট কার্ড ড্রাইভিং লাইসেন্স পাওয়া যায়। আবেদন শুরু হয় বিআরটিএ সার্ভিস পোর্টালে (বিএসপি)।
portal_url: https://bsp.brta.gov.bd/
online: true
fees:
  - { item: "লার্নার লাইসেন্স (একটি যানবাহন)", amount: "৫১৮ টাকা" }
  - { item: "লার্নার লাইসেন্স (দুটি যানবাহন)", amount: "৭৪৮ টাকা" }
  - { item: "স্মার্ট কার্ড, অপেশাদার (১০ বছর)", amount: "৪,৫৫৭ টাকা" }
  - { item: "স্মার্ট কার্ড, পেশাদার (৫ বছর)", amount: "২,৮৩২ টাকা" }
  - { item: "নবায়ন, অপেশাদার", amount: "৪,১৫২ টাকা" }
  - { item: "নবায়ন, পেশাদার", amount: "২,৪২৭ টাকা" }
  - { item: "মেয়াদ শেষের ১৫ দিন পর নবায়নে জরিমানা", amount: "বছরপ্রতি ৫১৮ টাকা" }
fee_note: "সূত্রভেদে ভিন্ন, পোর্টালে দেখুন। উল্লিখিত অঙ্কগুলো ২০২৩ সালের প্রতিবেদনের; ২০২৬ সালে হালনাগাদ হওয়া আরেকটি প্রতিবেদনে কম অঙ্ক (লার্নার ৩৪৫/৫১৮ টাকা) আছে, তাই বড় অঙ্কটি রাখা হয়েছে। আবেদনের আগে বিএসপি পোর্টালে বর্তমান ফি মিলিয়ে নিন।"
eligibility:
  - অপেশাদার লাইসেন্সের জন্য ন্যূনতম বয়স ১৮ বছর
  - পেশাদার লাইসেন্সের জন্য ন্যূনতম বয়স ২১ বছর (একটি প্রতিবেদনে যানবাহনের ওজনভেদে ২০, ২৩ ও ২৬ বছর বলা আছে, পোর্টালে দেখুন)
  - কমপক্ষে অষ্টম শ্রেণি পাস
  - নিবন্ধিত ডাক্তারের দেওয়া মেডিকেল সনদ, যাতে শারীরিক ও মানসিকভাবে গাড়ি চালানোর উপযুক্ততা থাকে
  - স্মার্ট কার্ডের আবেদনের আগে লার্নার লাইসেন্স থাকতে হবে
documents:
  - জাতীয় পরিচয়পত্র (এনআইডি)
  - নিবন্ধিত ডাক্তারের মেডিকেল সনদ (বিআরটিএর নির্ধারিত ফরমে)
  - শিক্ষাগত যোগ্যতার সনদ (ন্যূনতম অষ্টম শ্রেণি)
  - পাসপোর্ট সাইজ ছবি (৩০০×৩০০ পিক্সেল, সর্বোচ্চ ১৫০ কেবি)
  - বর্তমান ঠিকানা এনআইডির ঠিকানা থেকে আলাদা হলে ইউটিলিটি বিল
  - লার্নার পরীক্ষায় পাসের প্রমাণ
steps:
  - { title: "বিএসপি পোর্টালে নিবন্ধন", text: "https://bsp.brta.gov.bd/ পোর্টালে অ্যাকাউন্ট খুলুন।" }
  - { title: "লার্নার লাইসেন্সের আবেদন", text: "এনআইডি যাচাই করে ড্রাইভিং লাইসেন্সের তথ্য, ব্যক্তিগত তথ্য ও ঠিকানা দিন এবং প্রয়োজনীয় কাগজ সংযুক্ত করুন।" }
  - { title: "লার্নার ফি জমা", text: "লার্নার লাইসেন্সের নির্ধারিত ফি জমা দিন।" }
  - { title: "পরীক্ষা দিন", text: "পরীক্ষাকেন্দ্রে একবার গেলেই বায়োমেট্রিক, লিখিত, মৌখিক ও ব্যবহারিক পরীক্ষা একই দিনে হয়। পাস করলে অনলাইন কিউআর কোডসহ লার্নার লাইসেন্স মেলে, যা দিয়ে সারা দেশে সাময়িকভাবে গাড়ি চালানো যায়।" }
  - { title: "স্মার্ট কার্ডের আবেদন", text: "পরীক্ষায় পাসের পর স্মার্ট কার্ড লাইসেন্সের আবেদন জমা দিন এবং বাকি কাগজ আপলোড করুন।" }
  - { title: "চূড়ান্ত ফি দিন", text: "স্মার্ট কার্ডের ফি পরিশোধ করুন।" }
  - { title: "লাইসেন্স সংগ্রহ", text: "ই-পেপার লাইসেন্স ডাউনলোড করা যায়। স্মার্ট কার্ড ডাকযোগে বাড়িতে পাঠানো হয়।" }
  - { title: "নবায়ন", text: "ফি দিয়ে ফরম ও কাগজসহ বিআরটিএর সার্কেল অফিসে আবেদন করুন, ছবি-স্বাক্ষর-আঙুলের ছাপ (বায়োমেট্রিক) দিন। কার্ড ছাপা হলে এসএমএস আসে। পেশাদার লাইসেন্স নবায়নে আবার ব্যবহারিক পরীক্ষা দিতে হয়, অপেশাদারে পরীক্ষা লাগে না।" }
helpline: []
tips:
  - ভুয়া তথ্য দিলে আবেদন বাতিল ও আইনি ব্যবস্থা হতে পারে।
  - নবায়নের কাগজ হলো পূরণ করা ফরম, মেডিকেল সনদ, এনআইডির সত্যায়িত কপি, শিক্ষাগত সনদ, ফি জমার রসিদ এবং পাসপোর্ট ও স্ট্যাম্প সাইজ ছবি।
  - মেয়াদ শেষের ১৫ দিনের মধ্যে নবায়ন না করলে বছরপ্রতি ৫১৮ টাকা জরিমানা লাগে।
  - ২০২৪ সালের মার্চে বিআরটিএ স্থায়ী ই-লাইসেন্স চালু করেছে; স্মার্টফোনের ই-লাইসেন্সে কিউআর কোড থাকে এবং তা বিআরটিএর ডেটাবেস থেকে যাচাই করা যায়। ফোনে দেখানোর সুবিধা না থাকলে নির্ধারিত ফি দিয়ে পলিকার্বনেট কার্ড নেওয়া যায়।
  - সূত্রগুলোতে বিআরটিএর কোনো হেল্পলাইন নম্বর পাওয়া যায়নি, তাই এখানে দেওয়া হয়নি।
faq:
  - { q: "লার্নার লাইসেন্স ছাড়া কি সরাসরি স্মার্ট কার্ড হয়?", a: "না। স্মার্ট কার্ডের আবেদনের আগে লার্নার লাইসেন্স ও পরীক্ষায় পাস লাগে।" }
  - { q: "অপেশাদার ও পেশাদার লাইসেন্সের মেয়াদ কত?", a: "অপেশাদার লাইসেন্স ১০ বছর, পেশাদার ৫ বছর।" }
  - { q: "পরীক্ষার জন্য কয়বার কেন্দ্রে যেতে হয়?", a: "সূত্র অনুযায়ী একবার গেলেই বায়োমেট্রিক, লিখিত, মৌখিক ও ব্যবহারিক পরীক্ষা একই দিনে হয়।" }
