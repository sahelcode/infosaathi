name: "ই-টিআইএন নিবন্ধন"
name_en: "e-TIN Registration"
dept: "জাতীয় রাজস্ব বোর্ড (এনবিআর)"
category: "কর ও ব্যবসা"
summary: "ঘরে বসে এনবিআরের পোর্টালে অ্যাকাউন্ট খুলে অনলাইনে টিআইএন (করদাতা শনাক্তকরণ নম্বর) নেওয়া যায়। ট্রেড লাইসেন্স, ক্রেডিট কার্ড, গাড়ি, ঋণসহ নানা কাজে টিআইএন লাগে।"
portal_url: "https://secure.incometax.gov.bd/"
online: true
fees:
  - { item: "ই-টিআইএন নিবন্ধন", amount: "বিনামূল্যে" }
fee_note: "নিবন্ধনে কোনো ফি নেই বলে আগের প্রতিবেদনে (২০২২) বলা আছে; ২০২৫ সালের প্রতিবেদনে টিআইএন তথ্য সংশোধনেও সাধারণত কোনো ফি নেই বলা হয়েছে। নিশ্চিত হতে পোর্টাল দেখুন।"
eligibility:
  - "যাঁরা আয়কর রিটার্ন দেন, তাঁদের টিআইএন লাগে"
  - "ট্রেড লাইসেন্স, ক্রেডিট কার্ড, গাড়ি কেনা, সিটি এলাকায় সম্পত্তি লেনদেন, আমদানি-রপ্তানি ও সরকারি টেন্ডারে টিআইএন লাগে"
  - "ডাক্তার, আইনজীবী, প্রকৌশলী, হিসাববিদের মতো পেশাজীবী এবং অনলাইনে আয় করা ব্যক্তিরাও (ফ্রিল্যান্সিং, ইউটিউব ইত্যাদি) এর আওতায়"
  - "মাসে ১৬,০০০ টাকার বেশি আয়ের সরকারি চাকরিজীবী এবং ৫ লাখ টাকার বেশি ঋণ গ্রহীতার টিআইএন লাগে"
  - "একজন ব্যক্তি জীবনে একবারই টিআইএন নিতে পারেন"
documents:
  - "জাতীয় পরিচয়পত্র (এনআইডি)"
  - "এনআইডির সঙ্গে নিবন্ধিত মোবাইল নম্বর"
  - "ইমেইল ঠিকানা"
  - "বর্তমান ঠিকানা, জেলা ও বিভাগ"
  - "বৈবাহিক অবস্থা (বিবাহিত হলে স্বামী/স্ত্রীর তথ্য)"
steps:
  - { title: "পোর্টালে যান", text: "secure.incometax.gov.bd/TINHome-এ গিয়ে ‘Register’-এ ক্লিক করুন" }
  - { title: "অ্যাকাউন্ট খুলুন", text: "ইউজারনেম (অনেকে এনআইডি নম্বর ব্যবহার করেন), পাসওয়ার্ড ও সিকিউরিটি প্রশ্ন বেছে নিন; মোবাইল নম্বরে আসা ভেরিফিকেশন কোড দিন" }
  - { title: "লগইন করে টিআইএন আবেদন বেছে নিন", text: "ইউজার আইডি ও পাসওয়ার্ড দিয়ে ঢুকে বাম মেনু থেকে ‘TIN Application’ নির্বাচন করুন" }
  - { title: "ফরম পূরণ", text: "এনআইডি, ঠিকানা, জেলা-বিভাগ, মোবাইল নম্বর ও বৈবাহিক অবস্থা দিন; সব তথ্য ইংরেজিতে দিতে হবে" }
  - { title: "যাচাই করে জমা", text: "তথ্য মিলিয়ে দেখে সাবমিট করুন" }
  - { title: "ইউজার আইডি ও পাসওয়ার্ড সংরক্ষণ", text: "ভবিষ্যতে লগইন ও অ্যাকাউন্ট ফিরে পেতে এগুলো অবশ্যই সংরক্ষণ করে রাখুন" }
  - { title: "টিআইএন সনদ ডাউনলোড", text: "অনুমোদনের পর একই ওয়েবসাইটে ইউজারনেম-পাসওয়ার্ড দিয়ে লগইন করে সনদ ডাউনলোড ও প্রিন্ট করা যায়; হারালে একইভাবে আবার নামানো যায় (২০২২ সালের প্রতিবেদন)" }
  - { title: "টিআইএন তথ্য সংশোধন", text: "লগইন করে ড্যাশবোর্ডের ‘Update TIN Information’-এ সংশ্লিষ্ট তথ্য ‘Edit’ করুন, সংশোধনের কারণ লিখুন, প্রয়োজনে জন্মনিবন্ধন/এনআইডি বা সরকারি নথি আপলোড করুন, সাবমিট করে রসিদ সংরক্ষণ করুন" }
helpline:
  - { label: "এনবিআর ই-রিটার্ন হটলাইন", number: "০৯৬৪৩-৭১৭১৭১" }
tips:
  - "ফরমে সব তথ্য ইংরেজিতে লিখুন"
  - "ইউজার আইডি ও পাসওয়ার্ড হারালে সনদ নামানো ও তথ্য সংশোধন দুটোই আটকে যায়, তাই লিখে রাখুন"
  - "২০২৬-২৭ করবর্ষে ব্যক্তি করদাতা জুলাই-সেপ্টেম্বরের মধ্যে রিটার্ন দিলে ৫ শতাংশ কর রেয়াত বা সর্বোচ্চ ২৫,০০০ টাকা প্রণোদনার কথা প্রথম আলো (জুলাই ২০২৬) জানিয়েছে; ডিসেম্বরের পর রিটার্ন দিলে অতিরিক্ত কর দিতে হবে"
  - "রিটার্ন দিতে etaxnbr.gov.bd-তে ‘I am not registered yet’ থেকে টিআইএন ও মোবাইল নম্বর দিয়ে ওটিপির মাধ্যমে নিবন্ধন করতে হয়; এনআইডির সঙ্গে নিবন্ধিত মোবাইল লাগে"
  - "প্রবাসী করদাতারা পাসপোর্ট নম্বর, এনআইডি, ভিসার কপি, ইমেইল ও সাম্প্রতিক ছবি এনবিআরের নির্ধারিত ইমেইলে পাঠিয়ে ইমেইল-ওটিপি পদ্ধতিতে নিবন্ধন করতে পারেন (অক্টোবর ২০২৫)"
faq:
  - q: "টিআইএন কি একাধিকবার নেওয়া যায়?"
    a: "না, একজন ব্যক্তি জীবনে একবারই টিআইএন সনদ করতে পারেন।"
  - q: "রিটার্ন জমার চূড়ান্ত তারিখ কত?"
    a: "প্রতি বছরের সময়সীমা বদলাতে পারে। আমরা যেসব প্রতিবেদন দেখেছি তাতে চলতি করবর্ষের নির্দিষ্ট শেষ তারিখ নেই; এনবিআরের পোর্টালে দেখুন।"
  - q: "সরকারি সেবায় রিটার্নের বদলে টিআইএন সনদ চলে?"
    a: "প্রথম আলো (অক্টোবর ২০২৫) জানিয়েছে, ট্রেড লাইসেন্স, ক্রেডিট কার্ড, মোবাইল ব্যাংকিংসহ ১২টি সেবায় রিটার্নের বদলে টিআইএন সনদ দিলেই চলবে।"
