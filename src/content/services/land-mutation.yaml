name: "নামজারি / ই-মিউটেশন"
name_en: "Land Mutation (e-Namjari)"
dept: "ভূমি মন্ত্রণালয়"
category: "ভূমি"
summary: "জমি কেনা, উত্তরাধিকার বা দানের পর খতিয়ানে নিজের নাম তুলতে অনলাইনে নামজারির আবেদন। আবেদন, ফি জমা ও অগ্রগতি দেখা সবই mutation.land.gov.bd থেকে করা যায়।"
portal_url: "https://mutation.land.gov.bd/"
online: true
time: "ই-নামজারিতে সাধারণত ২৮ দিনের লক্ষ্য; নির্ধারিত সময় মহানগরে ৪৫ কর্মদিবস, অন্যত্র ৩০ কর্মদিবস"
fees:
  - { item: "আবেদনের সময় (কোর্ট ফি ২০ + নোটিশ জারি ফি ৫০)", amount: "৭০ টাকা" }
  - { item: "অনুমোদনের পর (রেকর্ড হালনাগাদ ও খতিয়ান/ডিসিআর)", amount: "১,১০০ টাকা" }
  - { item: "মোট", amount: "১,১৭০ টাকা" }
fee_note: "১,১০০ ও ১,১৭০ টাকা একই ফির দুই অংশ, আলাদা ফি নয়: আবেদনের সময় ৭০ টাকা, অনুমোদনের পর ১,১০০ টাকা, মোট ১,১৭০ টাকা। কিছু প্রতিবেদনে শুধু ১,১০০ টাকার অংশটি আলাদা করে লেখা হয়েছে, তাই সূত্রভেদে ভিন্ন; পোর্টালে দেখুন। নির্ধারিত ফির বাইরে কেউ বাড়তি টাকা চাইলে তা বেআইনি।"
eligibility:
  - "জমির মালিকানা অর্জনের সূত্র থাকতে হবে, যেমন ক্রয়, উত্তরাধিকার, দান, আদালতের ডিক্রি বা নিলাম"
documents:
  - "আবেদনকারীর ছবি ও স্বাক্ষর"
  - "জাতীয় পরিচয়পত্র বা জন্মনিবন্ধন সনদ"
  - "খতিয়ান নম্বর, দাগ নম্বর, জমির পরিমাণ এবং মৌজা ও জেলার তথ্য"
  - "মালিকানার প্রমাণ: দলিল, ওয়ারিশ সনদ বা আদালতের আদেশ (যেটি প্রযোজ্য)"
  - "সর্বশেষ ভূমি উন্নয়ন কর (খাজনা) পরিশোধের রসিদ"
  - "মোবাইল নম্বর"
steps:
  - { title: "পোর্টালে যান", text: "mutation.land.gov.bd-তে গিয়ে আবেদন শুরু করুন" }
  - { title: "মালিকানার সূত্র বাছাই", text: "ক্রয়, উত্তরাধিকার, দান, ডিক্রি, নিলাম ইত্যাদির মধ্য থেকে নিজের সূত্র বেছে নিন" }
  - { title: "জমির অবস্থান ও নম্বর", text: "বিভাগ, জেলা, উপজেলা ও মৌজা বাছাই করে খতিয়ান ও দাগ নম্বর দিন" }
  - { title: "আবেদনকারীর তথ্য", text: "ছবি, স্বাক্ষর ও পরিচয়ের কাগজ আপলোড করুন" }
  - { title: "মালিকানার কাগজ আপলোড", text: "দলিল বা আদালতের আদেশ পিডিএফ করে দিন; প্রতিটি ফাইল সর্বোচ্চ ১.২৫ এমবি, মোট ২৫ এমবি" }
  - { title: "ঘোষণা ও ৭০ টাকা জমা", text: "ঘোষণায় স্বাক্ষর করে আবেদন জমা দিন এবং কোর্ট ফি ও নোটিশ ফি বাবদ ৭০ টাকা অনলাইনে দিন; আবেদন নম্বর রেখে দিন, এ দিয়ে অগ্রগতি দেখা যায়" }
  - { title: "তদন্ত ও শুনানি", text: "জমির তদন্ত হয়, সহকারী কমিশনার (ভূমি) প্রতিবেদন দেখেন এবং সব পক্ষকে নিয়ে শুনানি হয়; সহজ মামলায় অনলাইনে শুনানির সুযোগ আছে (oh.lams.gov.bd)" }
  - { title: "অনুমোদন ও ১,১০০ টাকা জমা", text: "আবেদন অনুমোদন হলে এসএমএস আসে; তখন ১,১০০ টাকা অনলাইনে (বিকাশ, রকেট, নগদ, কার্ড বা ইন্টারনেট ব্যাংকিং) দিন" }
  - { title: "খতিয়ান ও ডিসিআর সংগ্রহ", text: "ফি দেওয়ার পর কিউআর কোডযুক্ত ডিজিটাল ডিসিআর ও নতুন খতিয়ান পাওয়া যায়; পুরনো মালিকের নাম বাদ গিয়ে আপনার নাম ওঠে" }
helpline:
  - { label: "ভূমি সেবা হেল্পলাইন", number: "১৬১২২" }
tips:
  - "২০২২ সালের নির্দেশনা অনুযায়ী শুধু কাগজ বা তথ্যের ঘাটতির কারণে নামজারি আবেদন নামঞ্জুর করা যাবে না; কাগজ জমার জন্য সাত কর্মদিবস বা যুক্তিসংগত সময় দেওয়ার কথা বলা হয়েছে।"
  - "ওই নির্দেশনায় আরও বলা হয়েছে, হার্ডকপি জমা না দেওয়া, এনআইডির সঙ্গে নামের গরমিল, ভুল ফোন নম্বর বা সম্পত্তি নিয়ে মামলা চলার কারণে আবেদন বাতিল করা যাবে না।"
  - "ফি অনলাইনে দিতে হয়; ২০২২ সালের অক্টোবর থেকে নগদ নেওয়া বন্ধ হয়েছে। ডিসিআর ও খতিয়ানের ভুল সংশোধনে কোনো ফি লাগে না।"
  - "২০২৩ সালের এক প্রতিবেদনে নামজারি এক মাসে শেষ হওয়ার কথা থাকলেও গড়ে ৪৩ দিন লাগছে বলা হয়েছিল; তাই আবেদন নম্বর দিয়ে নিয়মিত অবস্থা দেখুন।"
  - "২০২৪ সালের শেষে সফটওয়্যার হালনাগাদের পর নামজারি ও খাজনা সেবায় সাময়িক সমস্যার খবর এসেছিল; পোর্টাল না চললে ১৬১২২ নম্বরে জানান।"
about: "নামজারি বা মিউটেশন হলো সরকারি ভূমি রেকর্ডে জমির মালিকের নাম বদলের প্রক্রিয়া। নামজারির পর নতুন খতিয়ান তৈরি হয় এবং এর ভিত্তিতে ভূমি উন্নয়ন কর (খাজনা) দিতে হয়।"
faq:
  - q: "নামজারির মোট ফি কত, ১,১০০ না ১,১৭০ টাকা?"
    a: "মোট ১,১৭০ টাকা। আবেদনের সময় ৭০ টাকা (কোর্ট ফি ২০ ও নোটিশ ফি ৫০) এবং অনুমোদনের পর ১,১০০ টাকা। ১,১০০ টাকা শুধু দ্বিতীয় অংশ। পুরনো প্রতিবেদনে এই ১,১০০ টাকাকে রেকর্ড সংশোধন ১,০০০ ও খতিয়ান সরবরাহ ১০০ টাকা ধরে দেখানো হয়েছে।"
  - q: "নামজারি হতে কত দিন লাগে?"
    a: "ই-নামজারিতে লক্ষ্য ২৮ দিন। নির্ধারিত সময় মহানগরে ৪৫ কর্মদিবস ও অন্যত্র ৩০ কর্মদিবস। বাস্তবে এর চেয়ে বেশি লাগার খবরও আছে।"
  - q: "নামজারির পর কি খাজনা দিতে হয়?"
    a: "হ্যাঁ, ভূমি উন্নয়ন কর অনলাইনে দেওয়া যায়। land.gov.bd বা lsg-land-owner.land.gov.bd/register-এ নিবন্ধন করে খতিয়ান ও দাগের তথ্য দিয়ে নগদ, বিকাশ, রকেট, কার্ড বা সোনালী ব্যাংক গেটওয়েতে দিলে অনলাইন দাখিলা পাওয়া যায়। এনআইডি, জন্মতারিখ, মোবাইল নম্বর ও খতিয়ান/হোল্ডিং নম্বর লাগে।"
  - q: "সাহায্যের জন্য কোথায় ফোন করব?"
    a: "ভূমি মন্ত্রণালয়ের পোর্টালে দেওয়া হেল্পলাইন ১৬১২২।"
