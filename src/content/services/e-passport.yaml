name: "বাংলাদেশ ই-পাসপোর্ট"
name_en: "Bangladesh e-Passport"
dept: "ইমিগ্রেশন ও পাসপোর্ট অধিদপ্তর"
category: "পাসপোর্ট ও ভ্রমণ"
summary: "epassport.gov.bd-তে অনলাইনে আবেদন ও ফি দিয়ে পাসপোর্ট অফিসে ছবি, আঙুলের ছাপ ও স্বাক্ষর দিলে ই-পাসপোর্ট তৈরি হয়; তৈরি হলে এসএমএসে জানানো হয়।"
portal_url: "https://www.epassport.gov.bd/"
online: true
time: "সাধারণ ১৫ কার্যদিবস (২১ দিন), জরুরি ৭ কার্যদিবস (১০ দিন), অতি জরুরি ২ কার্যদিবস"
fees:
  - { item: "৪৮ পৃষ্ঠা, ৫ বছর: সাধারণ", amount: "৪,০২৫ টাকা" }
