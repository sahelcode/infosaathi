  - { item: "৬৪ পৃষ্ঠা, ১০ বছর: অতি জরুরি", amount: "১৩,৮০০ টাকা" }
fee_note: "দেশে থাকা আবেদনকারীর ফি। ৬৪ পৃষ্ঠা, ৫ বছর, অতি জরুরির ফি সূত্রভেদে ভিন্ন (১২,০৭৫ ও ১২,৭৫০ টাকা), তাই পোর্টালে দেখে নিন। প্রবাসীদের ফি ডলারে আলাদা, তা পোর্টালে দেখুন।"
eligibility:
  - "১৮ বছরের কম বয়সীদের পাসপোর্টের মেয়াদ ৫ বছর এবং ৪৮ পৃষ্ঠার হয়"
  - "১৮ বছরের কম বয়সীরা অনলাইন নিবন্ধিত জন্মনিবন্ধন সনদ দিয়ে আবেদন করে; এনআইডি না থাকলে বাবা-মায়ের পরিচয় নম্বর দিতে হয়"
  - "১৮–২০ বছর বয়সীরা এনআইডি অথবা অনলাইন নিবন্ধিত জন্মনিবন্ধন সনদ দিয়ে আবেদন করতে পারে"
  - "২০ বছরের বেশি বয়সীদের এনআইডি লাগে"
documents:
  - "জাতীয় পরিচয়পত্র (এনআইডি) অথবা অনলাইন নিবন্ধিত জন্মনিবন্ধন সনদ (বয়স অনুযায়ী)"
  - "১৮ বছরের কমদের ক্ষেত্রে বাবা-মায়ের এনআইডি"
  - "আগের পাসপোর্টের ফটোকপি, থাকলে (হারানো পাসপোর্টের ক্ষেত্রে)"
  - "পাসপোর্ট হারালে বা চুরি হলে থানায় করা জিডি/এফআইআর-এর কপি"
  - "আবেদনের সারসংক্ষেপের প্রিন্ট কপি (বায়োমেট্রিকের দিন সঙ্গে নিতে হয়)"
steps:
  - { title: "এলাকায় সেবা চালু আছে কিনা দেখুন", text: "epassport.gov.bd-তে গিয়ে আপনার এলাকায় ই-পাসপোর্ট কার্যক্রম চালু আছে কিনা দেখে নিন" }
  - { title: "অনলাইনে ফরম পূরণ", text: "জেলা, থানা, ইমেইল, মোবাইল নম্বরসহ ব্যক্তিগত তথ্য দিয়ে ফরম পূরণ করুন; তথ্য এনআইডি বা জন্মনিবন্ধনের সঙ্গে হুবহু মিলতে হবে" }
  - { title: "ফি পরিশোধ", text: "ব্যাংক কার্ড, মোবাইল ব্যাংকিং (যেমন বিকাশ, নগদ), অনলাইন ব্যাংকিং বা অনুমোদিত ব্যাংকে ফি দিন" }
  - { title: "বায়োমেট্রিকের সময় নিন", text: "পাসপোর্ট অফিসে যাওয়ার দিন ঠিক করে আবেদনের সারসংক্ষেপ প্রিন্ট করে রাখুন" }
  - { title: "পাসপোর্ট অফিসে বায়োমেট্রিক", text: "নির্ধারিত দিনে অফিসে গিয়ে কাগজপত্র জমা দিন; সেখানে ছবি তোলা, আঙুলের ছাপ ও স্বাক্ষর নেওয়া হবে" }
  - { title: "পাসপোর্ট সংগ্রহ", text: "পাসপোর্ট প্রস্তুত হলে মোবাইলে এসএমএসে জানানো হবে; এনআইডি নিয়ে অনুমোদিত প্রতিনিধিও তুলতে পারেন" }
helpline: []
tips:
  - "পুলিশ ভেরিফিকেশন: ১৮ ফেব্রুয়ারি ২০২৫ থেকে ই-পাসপোর্টের আবেদনে পুলিশ ভেরিফিকেশন নেই; এনআইডি বা জন্মনিবন্ধনের তথ্যের ভিত্তিতে পাসপোর্ট দেওয়া হয়"
  - "অনলাইন ফরমের তথ্য এনআইডির সঙ্গে হুবহু না মিললে সমস্যা হতে পারে"
  - "প্রসেসিংয়ের সময় বায়োমেট্রিক দেওয়ার পর থেকে গোনা হয়"
  - "পাসপোর্ট হারালে বা চুরি হলে আগে থানায় জিডি/এফআইআর করুন; নতুন আবেদনের সময় তার কপি ও আগের পাসপোর্টের ফটোকপি (থাকলে) জমা দিতে হয়"
  - "আবেদনের আগে ফি ও সময় পোর্টালে আরেকবার দেখে নিন, কারণ ফি বদলাতে পারে"
faq:
  - { q: "ই-পাসপোর্ট পেতে কত দিন লাগে?", a: "সাধারণ ১৫ কার্যদিবস (২১ দিন), জরুরি ৭ কার্যদিবস (১০ দিন) ও অতি জরুরি ২ কার্যদিবস। বায়োমেট্রিক দেওয়ার পর থেকে সময় গোনা হয়।" }
  - { q: "ই-পাসপোর্টে কি এখনো পুলিশ ভেরিফিকেশন লাগে?", a: "ইউএনবির প্রতিবেদন অনুযায়ী ১৮ ফেব্রুয়ারি ২০২৫ থেকে লাগে না; এনআইডি বা জন্মনিবন্ধনের তথ্য থেকে পাসপোর্ট দেওয়া হয়।" }
  - { q: "পাসপোর্ট হারালে কী করব?", a: "নিকটতম থানায় জিডি/এফআইআর করুন। নতুন আবেদনের সময় তার কপি ও আগের পাসপোর্টের ফটোকপি (থাকলে) জমা দিন।" }
  - { q: "পাসপোর্ট তুলতে নিজে যেতে হবে?", a: "এসএমএস পেলে নিজে তুলতে পারেন; অনুমোদিত প্রতিনিধি এনআইডি নিয়েও তুলতে পারেন।" }
