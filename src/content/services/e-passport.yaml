  - { item: "৪৮ পৃষ্ঠা, ১০ বছর: অতি জরুরি", amount: "১০,৩৫০ টাকা" }
  - { item: "৬৪ পৃষ্ঠা, ৫ বছর: সাধারণ", amount: "৬,৩২৫ টাকা" }
