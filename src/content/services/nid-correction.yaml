steps:
  - { title: "NID Wallet অ্যাপ নামান", text: "গুগল প্লে স্টোর থেকে NID Wallet অ্যাপ নামিয়ে নিন এবং কাগজপত্রের ছবি আগে থেকে তৈরি রাখুন" }
  - { title: "অ্যাকাউন্ট খুলুন", text: "এনআইডি নম্বর, জন্ম তারিখ, ঠিকানা দিয়ে নিবন্ধন করুন এবং মোবাইল নম্বর যাচাই করুন" }
  - { title: "প্রোফাইলে সংশোধন বেছে নিন", text: "প্রোফাইল অংশে গিয়ে ‘এডিট করুন’ চাপুন এবং যে তথ্য বদলাতে চান তা দিন" }
  - { title: "ফি জমা দিন", text: "ব্যাংক বা অনলাইনে প্রযোজ্য ফি পরিশোধ করুন" }
  - { title: "কাগজ আপলোড ও জমা", text: "সহায়ক কাগজপত্র আপলোড করে আবেদন জমা দিন" }
  - { title: "এসএমএসের জন্য অপেক্ষা", text: "নিবন্ধিত মোবাইলে আবেদনের অবস্থা এসএমএসে জানানো হয়" }
  - { title: "কার্ড সংগ্রহ", text: "এসএমএস পাওয়ার পর পুরোনো এনআইডি ও আবেদনের ফর্ম নিয়ে নির্বাচন অফিসে গিয়ে সংশোধিত কার্ড নিন" }
helpline:
