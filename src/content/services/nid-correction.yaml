fee_note: "সূত্রভেদে ভিন্ন, পোর্টালে দেখুন। ফির এই তালিকা ২০২৩ সালের একটি প্রতিবেদনের; আবেদনের আগে পোর্টালে বর্তমান ফি মিলিয়ে নিন।"
