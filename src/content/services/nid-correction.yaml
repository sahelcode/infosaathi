tips:
  - "নির্বাচন কমিশন ২০২৫ সালের ২৩ নভেম্বর থেকে নাম, পিতার নাম, মাতার নাম, পেশা, জন্ম তারিখ, ভোটার এলাকার ঠিকানা ও ছবি সংশোধন সাধারণভাবে বন্ধ রেখেছিল; জরুরি চিকিৎসা, উচ্চশিক্ষা, পাসপোর্ট-ভিসা ও চাকরির ক্ষেত্রে অনুমোদন সাপেক্ষে ব্যতিক্রম ছিল। এখন আবেদনের আগে পোর্টাল বা ১০৫-এ অবস্থা জেনে নিন"
  - "স্ত্রী বা স্বামীর নাম, বৈবাহিক অবস্থা, শিক্ষা, ধর্ম, প্রতিবন্ধিতার ধরন, রক্তের গ্রুপ ও ফোন নম্বরের মতো ভোটার তালিকার সঙ্গে সম্পর্কহীন তথ্য ওই সময়েও বদলানো যেত"
  - "জন্ম তারিখ সংশোধনের আবেদন এখন ‘ডি’ ক্যাটাগরিতে পড়ে এবং এনআইডি উইংয়ের মহাপরিচালকের পর্যায়ে নিষ্পত্তি হয়"
  - "আবেদন বাতিলের কারণ হিসেবে নির্বাচন কমিশন বলেছে: তথ্য-প্রমাণের ঘাটতি, অসঙ্গতি বা অন্যান্য কারণ। ভুয়া তথ্য দিলেও আবেদন বাতিল হয়"
  - "যথাযথ কারণ ও প্রয়োজনীয় কাগজপত্র থাকলে আবেদন অগ্রাধিকার ভিত্তিতে দ্রুত নিষ্পত্তির উদ্যোগ নেওয়া হয়"
about: "স্মার্ট এনআইডি কার্ড বিতরণ ২০১৬ সালে শুরু হয়। ২০২৫ সালের সেপ্টেম্বরের এক প্রতিবেদন অনুযায়ী কার্ড সরবরাহে ঘাটতি আছে এবং নতুন ব্ল্যাংক কার্ড আনার প্রক্রিয়া চলছে, তাই কার্ড হাতে পেতে সময় লাগতে পারে।"
faq:
  - q: "এনআইডি সংশোধনের আবেদন কোথায় করব?"
    a: "services.nidw.gov.bd পোর্টাল বা NID Wallet অ্যাপের মাধ্যমে অনলাইনে আবেদন করা যায়।"
  - q: "সাহায্য পেতে কোন নম্বরে ফোন করব?"
    a: "নির্বাচন কমিশনের টোল-ফ্রি হটলাইন ১০৫, সকাল ৮টা থেকে রাত ৮টা পর্যন্ত। নতুন ভোটার নিবন্ধন, স্থানান্তর ও সংশোধনসহ বিভিন্ন বিষয়ে সহায়তা মেলে।"
  - q: "সংশোধিত কার্ড কীভাবে পাব?"
    a: "আবেদন নিষ্পত্তির এসএমএস পেলে পুরোনো এনআইডি ও আবেদনের ফর্ম নিয়ে নির্বাচন অফিসে যেতে হয়।"
  - q: "আবেদন কেন বাতিল হয়?"
    a: "নির্বাচন কমিশনের ভাষ্য অনুযায়ী তথ্য-প্রমাণের ঘাটতি, অসঙ্গতি বা অন্যান্য কারণে। ২০২০ থেকে ২০২৬ সালের ২ আগস্ট পর্যন্ত ৬৩ লাখের বেশি আবেদনের মধ্যে প্রায় ১২ লাখ ৯৫ হাজার বাতিল হয়েছে।"
