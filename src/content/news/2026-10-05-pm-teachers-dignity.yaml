title: 'বিশ্ব শিক্ষক দিবসে প্রধানমন্ত্রী: সরাসরি ব্যাংকে বেতন, শিক্ষকদের জন্য ডিজিটাল উদ্যোগ'
cat: শিক্ষা
date: '2026-10-05'
summary: ঢাকার ওসমানী স্মৃতি মিলনায়তনের অনুষ্ঠানে শিক্ষকদের বেতন-অবসর সুবিধা, নতুন বই ও পাঠদান আধুনিকীকরণ নিয়ে ঘোষণা।
body:
- ৫ অক্টোবর বিশ্ব শিক্ষক দিবস উপলক্ষে ঢাকার ওসমানী স্মৃতি মিলনায়তনে আয়োজিত আলোচনায় প্রধানমন্ত্রী তারেক রহমান শিক্ষকদের মর্যাদা নিয়ে কথা বলেন। তাঁর ভাষ্য অনুযায়ী, রাষ্ট্র ও সমাজে শিক্ষকের মর্যাদা রাষ্ট্রের নিজের মর্যাদার সঙ্গে যুক্ত। আর্থিক নিরাপত্তা ও সম্মান বাড়িয়ে শিক্ষকতাকে প্রথম পছন্দের পেশা করার কথা তিনি বলেন।
- 'অনুষ্ঠানে যেসব ঘোষণা এসেছে: শিক্ষকদের বেতন ও অবসর সুবিধা অফিসে না গিয়ে সরাসরি ব্যাংকে পৌঁছানো, ডিজিটাল পাঠ-পরিকল্পনার জন্য ‘এক শিক্ষক, এক ট্যাব’ কর্মসূচি সম্প্রসারণ, ষষ্ঠ শ্রেণির জন্য নতুন ‘আনন্দে শেখা’ বই (পরে অন্য শ্রেণিতে বাড়ানো হবে) এবং জাতীয় দিবসের বড় অনুষ্ঠানে শিক্ষকদের আমন্ত্রণ।'
- অনুষ্ঠানে ১০২ জন বিশিষ্ট শিক্ষককে প্রত্যেককে দুই লাখ টাকা, ক্রেস্ট ও সনদ দিয়ে সম্মানিত করা হয়।
- শিক্ষা ব্যবস্থার আধুনিকীকরণ নিয়ে প্রধানমন্ত্রী বলেন, মুখস্থের বদলে ‘কেন’ ও ‘কীভাবে’ প্রশ্নের ওপর জোর দেওয়া হবে। প্রযুক্তি হবে শিক্ষকের সহায়ক, শিক্ষকের বিকল্প নয়। শিক্ষক প্রশিক্ষণ কলেজগুলো এআই-যুগের উপযোগী করা, মাল্টিমিডিয়া ক্লাস ও বিভিন্ন প্রতিষ্ঠানে বিনামূল্যে ওয়াই-ফাই বাড়ানোর কথাও এসেছে।
