title: ডেঙ্গুতে ২৪ ঘণ্টায় আরও ১০ মৃত্যু, এ বছর মৃতের সংখ্যা ২৮১
cat: স্বাস্থ্য
date: '2026-10-06'
summary: স্বাস্থ্য অধিদপ্তরের সর্বশেষ হিসাবে এক দিনে হাসপাতালে ভর্তি হয়েছেন ১,৯৯৬ জন। মৃত্যু ঢাকার বাইরেও ছড়িয়েছে।
body:
- স্বাস্থ্য অধিদপ্তরের হেলথ ইমার্জেন্সি অপারেশন সেন্টার ও কন্ট্রোল রুমের তথ্য অনুযায়ী, গত ২৪ ঘণ্টায় ডেঙ্গুতে আরও ১০ জনের মৃত্যু হয়েছে। এ নিয়ে ২০২৬ সালে ডেঙ্গুতে মোট মৃতের সংখ্যা দাঁড়াল ২৮১।
- একই সময়ে সারা দেশে ১,৯৯৬ জন নতুন রোগী হাসপাতালে ভর্তি হয়েছেন। এ বছর এখন পর্যন্ত ডেঙ্গুতে আক্রান্ত হয়ে হাসপাতালে ভর্তি হয়েছেন মোট ৯০,৩৫৬ জন। ২৪ ঘণ্টায় ১,৯৬৪ জন ছাড়পত্র পেয়েছেন, আর এ বছর সুস্থ হয়ে ফিরেছেন মোট ৮৪,২৯৯ জন।
- গত ২৪ ঘণ্টায় মারা যাওয়া ১০ জনের মধ্যে ঢাকা উত্তর সিটি করপোরেশনে দুজন, ঢাকা দক্ষিণ সিটি করপোরেশনে একজন এবং দুই সিটি করপোরেশনের বাইরে ঢাকা বিভাগে একজন। খুলনা বিভাগে মারা গেছেন তিনজন, বরিশাল বিভাগে দুজন এবং রাজশাহী বিভাগে একজন। অর্থাৎ মৃত্যু এখন শুধু রাজধানীতে সীমাবদ্ধ নেই।
- 'সাধারণ পরামর্শ: বাসা ও আশপাশে জমা পানি জমতে দেবেন না। জ্বর হলে নিজে নিজে ওষুধ না খেয়ে চিকিৎসকের পরামর্শ নিন। তীব্র পেটব্যথা, বারবার বমি বা শরীরের কোথাও রক্তপাত হলে দেরি না করে হাসপাতালে যান।'
