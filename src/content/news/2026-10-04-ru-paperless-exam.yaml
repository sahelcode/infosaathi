title: রাজশাহী বিশ্ববিদ্যালয়ে কাগজবিহীন পরীক্ষা চালু, প্রথম ধাপে আইসিই বিভাগ
cat: শিক্ষা
date: '2026-10-04'
summary: শিক্ষার্থীরা অনলাইনে পরীক্ষা দিয়ে সঙ্গে সঙ্গে ফল ও সঠিক উত্তর জানতে পারছেন।
body:
- রাজশাহী বিশ্ববিদ্যালয়ের তথ্য ও যোগাযোগ প্রকৌশল (আইসিই) বিভাগে ৩০ সেপ্টেম্বর একটি টিউটোরিয়াল পরীক্ষা কাগজবিহীন পদ্ধতিতে নেওয়া হয়েছে। দ্য বিজনেস স্ট্যান্ডার্ডের প্রতিবেদনে একে দেশের সরকারি বিশ্ববিদ্যালয়ের মধ্যে প্রথম বলা হয়েছে।
- পদ্ধতিটিতে শিক্ষার্থী, শিক্ষক ও প্রশাসকের জন্য আলাদা প্ল্যাটফর্ম আছে। শিক্ষার্থীরা বহুনির্বাচনী ও সংক্ষিপ্ত প্রশ্নের উত্তর অনলাইনে দেন এবং পরীক্ষা শেষে সঙ্গে সঙ্গে ফল, সঠিক উত্তর ও ব্যাখ্যা পান। শিক্ষকদের জন্য আছে প্রশ্নব্যাংক, স্বয়ংক্রিয় মূল্যায়ন, ফল সংরক্ষণ ও পর্যবেক্ষণের ব্যবস্থা এবং বিশ্লেষণ প্রতিবেদন।
- সফটওয়্যারটি বানিয়েছেন আইসিই বিভাগের চতুর্থ বর্ষের শিক্ষার্থী ওমর ফারুক ও মাস্টার্সের শিক্ষার্থী সামিউল বাসির। তত্ত্বাবধানে ছিলেন আইসিটি সেন্টারের পরিচালক অধ্যাপক মো. হাসনাত কবির। তাঁর মতে, এতে পরীক্ষা আরও স্বচ্ছ হবে এবং ফল প্রকাশে সময় কম লাগবে।
- আপাতত ব্যবস্থাটি শুধু আইসিই বিভাগে থাকছে। কার্যকারিতা বিবেচনা করে পরে অন্য বিভাগে চালুর পরিকল্পনা আছে বলে প্রতিবেদনে জানানো হয়েছে।
