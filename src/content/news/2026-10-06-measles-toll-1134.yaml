title: হামে আরও ৬ শিশুর মৃত্যু, মার্চ থেকে মৃতের সংখ্যা ১,১৩৪
cat: স্বাস্থ্য
date: '2026-10-06'
summary: স্বাস্থ্য অধিদপ্তরের তথ্যে ১৫ মার্চ থেকে এ পর্যন্ত লক্ষাধিক সন্দেহভাজন রোগীর হিসাব পাওয়া গেছে।
body:
- স্বাস্থ্য অধিদপ্তরের তথ্য অনুযায়ী, গত ২৪ ঘণ্টায় হামে আরও ৬ শিশুর মৃত্যু হয়েছে। ১৫ মার্চ থেকে শুরু হওয়া হিসাবে এ পর্যন্ত মৃতের সংখ্যা ১,১৩৪। এর মধ্যে ১,০৩২ জন সন্দেহভাজন হামে এবং ১০২ জন পরীক্ষাগারে নিশ্চিত হামে মারা গেছে।
- একই সময়ে ১,২৯১ জন নতুন সন্দেহভাজন রোগী শনাক্ত হয়েছে। ১৫ মার্চ থেকে এ পর্যন্ত মোট সন্দেহভাজন রোগীর সংখ্যা ১,৯৯,০১৩, আর পরীক্ষাগারে নিশ্চিত সংক্রমণ ২১,৯১০টি।
- এই সময়ে হাসপাতালে ভর্তি হয়েছে ১,৭৬,৫১৬ জন, যাদের মধ্যে ১,৬৯,২৯০ জন সুস্থ হয়ে বাড়ি ফিরেছে।
- 'সাধারণ পরামর্শ: শিশুর হামের টিকা নির্ধারিত সময়ে পুরোটা দিয়েছেন কি না, টিকার কার্ড দেখে মিলিয়ে নিন। না দিয়ে থাকলে নিকটস্থ স্বাস্থ্যকেন্দ্রে জানতে চান। শিশুর জ্বর ও গায়ে র‍্যাশ দেখা দিলে অন্য শিশুদের থেকে আলাদা রেখে দ্রুত চিকিৎসকের কাছে নিন।'
