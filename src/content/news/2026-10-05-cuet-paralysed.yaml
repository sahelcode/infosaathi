title: চুয়েটে ১৩ দিন ধরে অচলাবস্থা, নতুন উপাচার্য বসছেন সার্কিট হাউসে
cat: শিক্ষা
date: '2026-10-05'
summary: উপাচার্য পরিবর্তনের প্রতিবাদে ২১ সেপ্টেম্বর থেকে ক্যাম্পাসে শিক্ষা কার্যক্রম বন্ধ। একাধিক পরীক্ষা পিছিয়েছে।
body:
- চট্টগ্রাম প্রকৌশল ও প্রযুক্তি বিশ্ববিদ্যালয়ে (চুয়েট) ২১ সেপ্টেম্বর থেকে শুরু হওয়া অচলাবস্থা ৪ অক্টোবর পর্যন্ত ১৩ দিন পেরিয়েছে বলে প্রতিবেদনে বলা হয়েছে। শিক্ষার্থীরা সরিয়ে দেওয়া উপাচার্য অধ্যাপক আবু সাদাত মোহাম্মদ সায়েমকে ফিরিয়ে আনার দাবি জানাচ্ছেন। তিনি ২৭ জুলাই থেকে ২১ সেপ্টেম্বর, মোট ৫৬ দিন দায়িত্বে ছিলেন।
- তাঁর জায়গায় খুলনা বিশ্ববিদ্যালয়ের ইলেকট্রনিক্স অ্যান্ড কমিউনিকেশন ইঞ্জিনিয়ারিং বিভাগের অধ্যাপক শেখ শরিফুল আলম ২৪ সেপ্টেম্বর দায়িত্ব নেন। শিক্ষার্থীদের দাবি, তাঁর নিয়োগ বাতিল করতে হবে। প্রতিবাদের কারণে তিনি ক্যাম্পাসে না বসে চট্টগ্রামের সার্কিট হাউস থেকে দাপ্তরিক কাজ চালাচ্ছেন।
- ২৭ সেপ্টেম্বর থেকে শিক্ষক সমিতি, কর্মকর্তা সমিতি ও কর্মচারী সমিতিও কর্মবিরতি ও অবস্থানে যোগ দিয়েছে। ক্লাস বন্ধ, সেমিস্টার ও চূড়ান্ত পরীক্ষা একাধিক স্থগিত, ফলে সেশনজটের আশঙ্কা তৈরি হয়েছে। ৪ অক্টোবর পর্যন্ত বেতন, ভাতা ও হিন্দু উৎসব ভাতা দেওয়া হয়নি বলেও জানানো হয়েছে।
- শিক্ষক সমিতি বিশ্ববিদ্যালয় মঞ্জুরি কমিশন ও শিক্ষা মন্ত্রণালয়ে চিঠি দিয়েছে। প্রতিবেদনে সরকারের উচ্চপর্যায়ে আলোচনার কথা থাকলেও সমাধানের কোনো ঘোষণা আসেনি। এটি চলমান ঘটনা, তাই পরিস্থিতি বদলাতে পারে।
