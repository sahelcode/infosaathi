note: "কিউএস ২০২৭ (প্রকাশ জুন ২০২৬)-এ বাংলাদেশের ১৩টি বিশ্ববিদ্যালয় আছে। কিউএসের নিজস্ব পাতা এখানে খোলা যায়নি; তালিকা দ্য ডেইলি স্টারের প্রতিবেদন থেকে নেওয়া, ঢাবি, বুয়েট, নর্থ সাউথ ও এআইইউবির অবস্থান দ্য ফিনান্সিয়াল এক্সপ্রেস, এনএসইউ ও এআইইউবির নিজস্ব পাতার সঙ্গে মিলেছে। ১,৪০১+ ব্যান্ডের বিশ্ববিদ্যালয়গুলো বর্ণানুক্রমে সাজানো। আগের বছরের অবস্থান নিশ্চিতভাবে না পাওয়ায় দেওয়া হয়নি।"
