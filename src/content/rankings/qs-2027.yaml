note: "কিউএস ২০২৭ (প্রকাশ ১৮ জুন ২০২৬)-এ বাংলাদেশের ১৩টি বিশ্ববিদ্যালয় আছে। অবস্থান কিউএসের নিজস্ব পাতা ও দ্য ডেইলি স্টারের প্রতিবেদন মিলিয়ে দেওয়া। কেইউইটির কিউএস পাতায় ২০২৭ সাল এখনো ওঠেনি, তাই এর অবস্থান দুটি আলাদা পাতা মিলিয়ে নেওয়া। কিউএস ঢাবিকে যৌথভাবে ৬০০তম দেখায়। একই ব্যান্ডের বিশ্ববিদ্যালয়গুলো বর্ণানুক্রমে সাজানো। এই র‍্যাঙ্কিং কিউএসের, আমাদের নিজের নয়।"
