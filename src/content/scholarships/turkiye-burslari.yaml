  - "আবেদনের একই স্তরে তুরস্কের কোনো বিশ্ববিদ্যালয়ে ইতিমধ্যে পড়ছেন এমন কেউ আবেদন করতে পারবেন না"
covers: ["বিশ্ববিদ্যালয় ও বিভাগ নির্ধারণ", "মাসিক ভাতা", "টিউশন ফি", "স্বাস্থ্য বীমা", "থাকার ব্যবস্থা", "তুর্কি ভাষা কোর্স", "একবারের বিমান টিকিট"]
