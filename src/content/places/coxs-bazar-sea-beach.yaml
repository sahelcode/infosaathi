intro: বঙ্গোপসাগরের তীরে প্রায় ১২০ কিলোমিটার লম্বা কক্সবাজার সমুদ্র সৈকত, এশিয়ার দীর্ঘতম প্রাকৃতিক বালুকাময় সৈকত। শহরের লাবণী, সুগন্ধা ও কলাতলী পয়েন্ট থেকে মেরিন ড্রাইভ ধরে হিমছড়ি আর ইনানী পর্যন্ত পুরোটাই ঘোরা যায়।

glance:
  from: ঢাকা থেকে
  distance: প্রায় ৪১৫ কিমি
