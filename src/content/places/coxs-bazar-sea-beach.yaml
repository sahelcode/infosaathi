  fee: নেই
  best: নভেম্বর – মার্চ

spots:
  - { title: "লাবণী পয়েন্ট", text: "শহরের সবচেয়ে কাছের ও ব্যস্ত সৈকত। ঘোড়ায় চড়া আর স্পিডবোটের ব্যবস্থা আছে।", meta: "শহরের প্রধান সৈকত" }
  - { title: "সুগন্ধা ও কলাতলী পয়েন্ট", text: "লাবণীর দক্ষিণে টানা সৈকত, পাশে হোটেল আর রেস্তোরাঁ। সুগন্ধার কাছেই বার্মিজ মার্কেট। সূর্যাস্ত দেখার জনপ্রিয় জায়গা।", meta: "লাইফগার্ড আছে" }
  - { title: "মেরিন ড্রাইভ", text: "কক্সবাজার থেকে টেকনাফ পর্যন্ত প্রায় ৮০ কিলোমিটার সাগরঘেঁষা সড়ক। একপাশে পাহাড়, অন্যপাশে সমুদ্র।", meta: "হিমছড়ি ও ইনানীর পথ" }
  - { title: "হিমছড়ি", text: "মেরিন ড্রাইভের পাশে পাহাড়ি জাতীয় উদ্যান ও ঝর্ণা। পাহাড়ের ওপর থেকে সাগর দেখা যায়।", meta: "মেরিন ড্রাইভে" }
  - { title: "ইনানী সৈকত", text: "উখিয়ায় প্রায় ১৮ কিলোমিটার লম্বা সৈকত, পাড়ে কালো-সবুজ প্রবাল পাথর। পাথর ধারালো, সাবধানে হাঁটুন।", meta: "শহর থেকে ৪৫ মিনিট – ১ ঘণ্টা" }

routes:
  - from: কক্সবাজার শহর থেকে (হিমছড়ি – ইনানী)
    rows:
      - { mode: car, name: "সিএনজি রিজার্ভ", text: "মেরিন ড্রাইভ ধরে আসা-যাওয়া, হিমছড়ি ও ইনানী একসাথে", fare: "৳৮০০ – ১,২০০" }
      - { mode: car, name: "জিপ রিজার্ভ", text: "আসা-যাওয়া, ১০ – ১৫ জনের দলের জন্য", fare: "৳২,০০০ – ৩,০০০" }
  - from: চট্টগ্রাম থেকে
    rows:
      - { mode: train, name: "ট্রেন (সৈকত ও প্রবাল এক্সপ্রেস)", text: "প্রায় ৩.৫ – ৪ ঘণ্টা, শ্রেণিভেদে ভাড়া", fare: "৳১৮৫ – ৩৪০" }
      - { mode: bus, name: "বাস", text: "প্রায় ১৫০ কিমি, নন-এসি ও এসি। জ্বালানির দাম বাড়ার পর ভাড়া ৳১০০ – ১৫০ বেড়েছে", fare: "৳৪২০ – ৮০০ (২০২৩ সালের ভাড়া)" }
  - from: ঢাকা থেকে
    rows:
      - { mode: bus, name: "নন-এসি বাস", text: "৯ – ১২ ঘণ্টা, বিআরটিএ নির্ধারিত ভাড়া (৪০ আসন)", fare: "৳১,২৩৩" }
      - { mode: bus, name: "এসি বাস", text: "৯ – ১২ ঘণ্টা, কোম্পানিভেদে ভাড়া", fare: "৳১,৭০০ – ২,৭০০" }
      - { mode: train, name: "কক্সবাজার এক্সপ্রেস", text: "রাত ১০:৩০-এ ছাড়ে, প্রায় ৮.৫ ঘণ্টা, শ্রেণিভেদে ভাড়া", fare: "৳৫০০ – ১,৭২৫" }
      - { mode: plane, name: "বিমান", text: "প্রায় ১ ঘণ্টা, তারিখ ও এয়ারলাইনভেদে ভাড়া", fare: "৳৪,৬০০ – ১২,০০০" }

months: [3, 3, 3, 2, 1, 1, 1, 1, 1, 2, 3, 3]   # জানুয়ারি থেকে ডিসেম্বর: ৩ সেরা, ২ ভালো, ১ মোটামুটি
seasons:
  - { title: "শীত (নভেম্বর – মার্চ)", text: "আবহাওয়া আরামদায়ক, সাগর তুলনামূলক শান্ত। ভিড় ও হোটেল ভাড়া দুটোই বেশি থাকে।" }
  - { title: "বর্ষা (জুন – সেপ্টেম্বর)", text: "সাগর উত্তাল থাকে, সৈকতে গুপ্তখাল তৈরি হয়। হোটেলে ছাড় মেলে, তবে গোসলে নামা সবচেয়ে ঝুঁকিপূর্ণ।" }

cost_from: চট্টগ্রাম থেকে, জনপ্রতি
cost:
  - { item: "ট্রেন ভাড়া (আসা-যাওয়া)", amount: "৳৩৭০ – ৬৮০" }
  - { item: "হিমছড়ি – ইনানী সিএনজি রিজার্ভ (৪ জনে ভাগ করলে)", amount: "৳২০০ – ৩০০" }
  - { item: "হোটেল ও খাবার", amount: "মৌসুম ও মানভেদে আলাদা" }
cost_total: ৳৫৭০ – ৯৮০ (থাকা-খাওয়া বাদে)

tips:
  - { title: "হলুদ পতাকার জায়গায় নামুন, লাল পতাকায় নয়।", text: "লাল পতাকা মানে গুপ্তখাল বা বিপজ্জনক এলাকা। কলাতলী থেকে লাবণী পর্যন্ত ৫ কিমিতেই ১৭টি গুপ্তখাল চিহ্নিত হয়েছে, ৬ – ১০ ফুট গভীর।" }
  - { title: "লাইফগার্ড আছে শুধু কলাতলী – লাবণী অংশে।", text: "২৭ জন লাইফগার্ড সকাল ৬টা থেকে বিকেল ৪টা পর্যন্ত থাকেন। এর বাইরে বা এই সময়ের পরে সাগরে নামবেন না।" }
  - { title: "ভাটার সময় টান সবচেয়ে বেশি।", text: "উল্টো স্রোত (রিপ কারেন্ট) মানুষকে গভীরে টেনে নেয়। জোয়ার-ভাটার সময় জেনে নামুন, কোমরপানির বেশি যাবেন না।" }
  - { title: "ইনানী, হিমছড়ি ও মেরিন ড্রাইভের সৈকতে গোসল নয়।", text: "শহরের বাইরের প্রায় ১১৫ কিমি সৈকতে লাইফগার্ড বা ডুবুরি নেই। নির্জন জায়গায় ডুবে যাওয়ার ঘটনা ঘটছে।" }
  - { title: "কেউ ভেসে গেলে নিজে নামবেন না।", text: "চিৎকার করে লাইফগার্ড বা ট্যুরিস্ট পুলিশ ডাকুন। বাঁচাতে গিয়ে প্রাণ হারানোর ঘটনা বারবার ঘটছে।" }

stay: শহরে পাঁচ শতাধিক হোটেল, মোটেল, গেস্টহাউস ও রিসোর্ট আছে, বেশিরভাগ কলাতলী ও সুগন্ধা এলাকায়। ছুটির দিনে ও শীতে আগে বুকিং দিন, তখন হোটেল, খাবার ও অটো ভাড়া অনেক বেশি চাওয়া হয়। অফ-সিজনে হোটেলে ছাড় পাওয়া যায়।
