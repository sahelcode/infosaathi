faq:
  - { q: "কক্সবাজার সৈকতে কোথায় গোসল করা নিরাপদ?", a: "কলাতলী, সুগন্ধা ও লাবণী পয়েন্টের হলুদ পতাকা দেওয়া জায়গায়, সকাল ৬টা থেকে বিকেল ৪টার মধ্যে, যখন লাইফগার্ড থাকেন। লাল পতাকার কাছে আর সাগর উত্তাল থাকলে নামবেন না।" }
  - { q: "ঢাকা থেকে কক্সবাজারে সরাসরি ট্রেন আছে?", a: "হ্যাঁ। কক্সবাজার এক্সপ্রেস রাতে ঢাকা থেকে ছেড়ে সকালে কক্সবাজার পৌঁছায়। শুধু বিমানবন্দর ও চট্টগ্রাম স্টেশনে থামে। টিকিট দ্রুত শেষ হয়, আগে কাটুন।" }

