#   - { src: ./images/jaflong-1.jpg, caption: পিয়াইন নদী ও পাথরের চর, sub: জিরো পয়েন্ট, label: জিরো পয়েন্ট }
intro: সিলেটের গোয়াইনঘাটে ভারতের মেঘালয় সীমান্তে খাসিয়া-জৈন্তা পাহাড়ের পাদদেশে পিয়াইন নদীর তীরে জাফলং। স্বচ্ছ পানি, পাথরের চর, ওপারের পাহাড় আর ঝর্ণার জন্য এটি সিলেটের সবচেয়ে পরিচিত ভ্রমণস্থান।

glance:
  from: সিলেট শহর থেকে
  distance: প্রায় ৬০ কিমি
  time: ২ – ২.৫ ঘণ্টা
  fee: নেই
  best: জুন – নভেম্বর

spots:
  - { title: "জিরো পয়েন্ট ও পিয়াইন নদী", text: "স্বচ্ছ পানি আর পাড়জুড়ে পাথরের চর। জাফলংয়ের মূল জায়গা, বাংলাদেশ-ভারত সীমান্তের ঠিক পাশে।", meta: "মূল আকর্ষণ" }
  - { title: "ডাউকি ব্রিজের দৃশ্য", text: "নদীর ওপারে ভারতের ডাউকি ঝুলন্ত সেতু আর মেঘালয়ের পাহাড়। সেতুটি ভারতে, তাই দেখা যায় দূর থেকেই।", meta: "জিরো পয়েন্ট থেকে দেখা যায়" }
  - { title: "মায়াবী ঝর্ণা", text: "নৌকায় পিয়াইন পার হয়ে সংগ্রামপুঞ্জির দিকে অল্প হাঁটলে ঝর্ণা। বর্ষায় পানি সবচেয়ে বেশি।", meta: "নৌকা + হাঁটা" }
  - { title: "খাসিয়া পুঞ্জি", text: "পান ও সুপারি বাগানের মাঝে খাসিয়াদের গ্রাম। ঘরের ছবি তোলার আগে অনুমতি নিন।", meta: "ঝর্ণার পথেই" }

routes:
  - from: সিলেট শহর থেকে
    rows:
      - { mode: bus, name: "লোকাল বাস", text: "শিবগঞ্জ বা কদমতলী বাসস্ট্যান্ড থেকে, ২ – ২.৫ ঘণ্টা", fare: "৳৭০ – ১০০" }
      - { mode: car, name: "সিএনজি রিজার্ভ", text: "আসা-যাওয়া, ৪ – ৫ জন বসা যায়", fare: "৳১,২০০ – ২,০০০" }
      - { mode: car, name: "মাইক্রোবাস রিজার্ভ", text: "আসা-যাওয়া, দলের জন্য সুবিধা", fare: "৳৩,৫০০ – ৫,০০০" }
  - from: ঢাকা থেকে সিলেট
    rows:
      - { mode: bus, name: "বাস", text: "৬ – ৮ ঘণ্টা, নন-এসি ও এসি", fare: "৳৫৮০ – ১,৫০০" }
      - { mode: train, name: "ট্রেন", text: "৬ – ৮ ঘণ্টা, শ্রেণিভেদে ভাড়া", fare: "৳৪১০ – ১,৪৬৫" }

months: [2, 2, 1, 1, 1, 3, 3, 3, 3, 3, 3, 2]   # জানুয়ারি থেকে ডিসেম্বর: ৩ সেরা, ২ ভালো, ১ মোটামুটি
seasons:
  - { title: "বর্ষা ও শরৎ (জুন – নভেম্বর)", text: "ঝর্ণায় পানি সবচেয়ে বেশি, পাহাড় সবুজ। তবে নদীতে স্রোত প্রবল থাকে।" }
  - { title: "শীত (ডিসেম্বর – ফেব্রুয়ারি)", text: "নদীর পানি স্বচ্ছ ও শান্ত, পাথর দেখা যায় পরিষ্কার। ঝর্ণায় পানি কমে আসে।" }

cost_from: সিলেট থেকে, জনপ্রতি
cost:
  - { item: "বাস ভাড়া (আসা-যাওয়া)", amount: "৳১৪০ – ২০০" }
  - { item: "ঝর্ণায় যাওয়ার নৌকা (জনপ্রতি)", amount: "৳৫০ – ১০০" }
  - { item: "দুপুরের খাবার", amount: "৳১৮০ – ২৫০" }
cost_total: ৳৪০০ – ৬০০

tips:
  - { title: "সাঁতার না জানলে পানিতে নামবেন না।", text: "জানলেও লাইফ জ্যাকেট পরুন, বর্ষায় স্রোত খুব জোরালো।" }
  - { title: "সীমানা পার হবেন না।", text: "জিরো পয়েন্টে বিজিবির নির্দেশনা মেনে চলুন।" }
  - { title: "বর্ষায় পাথর পিচ্ছিল থাকে।", text: "গ্রিপওয়ালা স্যান্ডেল বা জুতা নিন।" }
  - { title: "সন্ধ্যার আগে ফেরার পথ ধরুন।", text: "শেষ দিকের বাসে ভিড় বেশি থাকে।" }

stay: জাফলংয়ে কয়েকটি রিসোর্ট ও হোটেল আছে, তবে বেশিরভাগ মানুষ সিলেট শহরে থেকে দিনে দিনে ঘুরে আসেন। জিরো পয়েন্টের আশেপাশে খাবারের হোটেল আছে।
nearby: [bichanakandi, ratargul-swamp-forest]

