faq:
  - { q: "সাজেক কি একদিনে ঘুরে আসা যায়?", a: "যায়। সকালের এসকর্টে গিয়ে বিকেলের এসকর্টে ফেরা সম্ভব। তবে ভোরের মেঘ ও সূর্যোদয় দেখতে এক রাত থাকাই ভালো।" }
  - { q: "সাজেক রাঙামাটিতে হলে খাগড়াছড়ি দিয়ে কেন যেতে হয়?", a: "সাজেকে যাওয়ার সড়ক খাগড়াছড়ির দীঘিনালা হয়ে বাঘাইহাট দিয়ে গেছে। রাঙামাটি শহর থেকে সরাসরি সহজ সড়কপথ নেই।" }

