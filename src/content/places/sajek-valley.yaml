intro: রাঙামাটির বাঘাইছড়ি উপজেলার সাজেক ইউনিয়ন দেশের আয়তনে সবচেয়ে বড় ইউনিয়ন। প্রায় ১,৮০০ ফুট উঁচু পাহাড়ের চূড়ায় রুইলুই ও কংলাক পাড়া থেকে চারপাশে মেঘের সমুদ্র দেখা যায়। রাঙামাটিতে হলেও যাতায়াত খাগড়াছড়ি শহর ও দীঘিনালা হয়ে।

glance:
  from: খাগড়াছড়ি শহর থেকে
  distance: প্রায় ৭০ কিমি
  time: ২ – ৩ ঘণ্টা
  fee: "৳২০ জনপ্রতি, গাড়ি ৳১০০"
  best: সেপ্টেম্বর – নভেম্বর

spots:
  - { title: "রুইলুই পাড়া", text: "সাজেকের মূল এলাকা, প্রায় ১,৭২০ ফুট উঁচুতে। রিসোর্ট, খাবারের হোটেল আর মেঘ দেখার ভিউপয়েন্ট এখানেই।", meta: "মূল আকর্ষণ" }
  - { title: "হেলিপ্যাড", text: "ভোরে সূর্যোদয় আর পাহাড়ের ভাঁজে জমে থাকা মেঘ দেখার সবচেয়ে জনপ্রিয় জায়গা।", meta: "ভোরে যান" }
  - { title: "কংলাক পাড়া", text: "সাজেকের সবচেয়ে উঁচু জায়গা, প্রায় ১,৮০০ ফুট। লুসাই জনগোষ্ঠীর গ্রাম, চূড়া থেকে চারদিকের পাহাড় দেখা যায়।", meta: "রুইলুই থেকে হাঁটা পথ" }
  - { title: "লুসাই গ্রাম", text: "লুসাইদের ঐতিহ্যবাহী ঘর ও জীবনধারা দেখা যায়। প্রবেশ ৳৩০, ঐতিহ্যবাহী পোশাক পরে ছবি তুলতে ৳১৩০।", meta: "টিকিট লাগে" }
  - { title: "কমলক ঝর্ণা", text: "রুইলুই পাড়া থেকে পাহাড়ি পথে ২ – ২.৫ ঘণ্টা হেঁটে যেতে হয়। স্থানীয় গাইড নিয়ে যাওয়া ভালো।", meta: "ট্রেকিং" }

routes:
  - from: খাগড়াছড়ি শহর থেকে
    rows:
      - { mode: car, name: "চান্দের গাড়ি (দিনে আসা-যাওয়া)", text: "রিজার্ভ, ১২ – ১৪ জন বসা যায়, আর্মি এসকর্টের সাথে যেতে হয়", fare: "৳৭,৫০০ – ৮,০০০" }
      - { mode: car, name: "চান্দের গাড়ি (এক রাত থাকা সহ)", text: "রিজার্ভ, পরদিন ফেরা; অন্য দলের সাথে ভাগ করে খরচ কমানো যায়", fare: "৳৮,০০০ – ১০,০০০" }
      - { mode: car, name: "সিএনজি রিজার্ভ", text: "৪ – ৫ জন, সময় বেশি লাগে", fare: "৳৪,২০০ – ৭,২০০" }
      - { mode: car, name: "মোটরসাইকেল (দীঘিনালা থেকে)", text: "ভাড়ায় বাইক, এসকর্টের সাথেই যেতে হয়", fare: "৳১,০০০ – ১,২০০" }
  - from: ঢাকা থেকে খাগড়াছড়ি
    rows:
      - { mode: bus, name: "নন-এসি বাস", text: "শান্তি, শ্যামলী, হানিফ, ঈগল ইত্যাদি; রাতের বাসে প্রায় ৭.৫ – ৮ ঘণ্টা", fare: "৳৮০০ – ৮৫০" }
      - { mode: bus, name: "এসি বাস", text: "রাত ১০ – ১১টায় ছেড়ে ভোরে খাগড়াছড়ি পৌঁছায়", fare: "৳১,০০০ – ১,৬০০" }

months: [2, 2, 1, 1, 1, 2, 2, 2, 3, 3, 3, 2]   # জানুয়ারি থেকে ডিসেম্বর: ৩ সেরা, ২ ভালো, ১ মোটামুটি
seasons:
  - { title: "বর্ষার শেষ থেকে শীতের শুরু (সেপ্টেম্বর – নভেম্বর)", text: "মেঘ সবচেয়ে বেশি, পাহাড় সবুজ। সাজেক যাওয়ার আদর্শ সময়।" }
  - { title: "বর্ষা (জুন – আগস্ট)", text: "মেঘ প্রচুর, তবে ভারী বৃষ্টিতে পাহাড়ধস ও রাস্তা নষ্ট হওয়ার ঝুঁকি থাকে।" }
  - { title: "শীত (ডিসেম্বর – ফেব্রুয়ারি)", text: "ভোরে কুয়াশা ও মেঘ দেখা যায়, আকাশ পরিষ্কার থাকে। রাতে বেশ ঠান্ডা।" }

cost_from: খাগড়াছড়ি থেকে, জনপ্রতি (এক রাত, ১২ জনের দল)
cost:
  - { item: "চান্দের গাড়ি ভাগ করে (এক রাত সহ)", amount: "৳৭০০ – ৮৫০" }
  - { item: "প্রবেশ ফি", amount: "৳২০ – ১৫০" }
  - { item: "রিসোর্ট (রুম ভাগ করে)", amount: "৳৪০০ – ৯০০" }
  - { item: "খাবার (তিন বেলা)", amount: "৳৬০০ – ৭৫০" }
cost_total: ৳১,৮০০ – ২,৬০০

tips:
  - { title: "আর্মি এসকর্ট ছাড়া যাওয়া যায় না।", text: "দীঘিনালা/বাঘাইহাট থেকে সাধারণত দিনে দুবার এসকর্ট ছাড়ে, সকাল ১০ – ১১টা ও বিকেল ২:৩০ – ৩টা। সাজেক থেকে ফেরার এসকর্টও সকাল ১০টা ও বিকেল ৩টার দিকে। উৎসভেদে সময় আলাদা, চালকের কাছে আগেই নিশ্চিত হোন।" }
  - { title: "সকালের এসকর্ট ধরার পরিকল্পনা করুন।", text: "রাতের বাসে ভোরে খাগড়াছড়ি পৌঁছে নাশতা সেরে রওনা দিলে সকালের এসকর্ট ধরা যায়। দেরি হলে বিকেল পর্যন্ত অপেক্ষা করতে হয়।" }
  - { title: "জাতীয় পরিচয়পত্র সাথে রাখুন।", text: "বাঘাইহাট পুলিশ ও আর্মি ক্যাম্পে নাম-তথ্য দিতে হয়। প্রবেশ ফি ৳২০ জনপ্রতি ও গাড়ি ৳১০০ বলে এক উৎসে আছে, অন্য উৎসে প্রবেশ ও পার্কিং মিলিয়ে প্রায় ৳১৫০।" }
  - { title: "নেটওয়ার্ক ও বিদ্যুৎ সীমিত।", text: "মূলত রবি ও এয়ারটেল নেটওয়ার্ক পাওয়া যায়। বিদ্যুৎ সোলার/জেনারেটরনির্ভর, পাওয়ার ব্যাংক নিন।" }
  - { title: "যাওয়ার আগে খবর দেখুন।", text: "আইনশৃঙ্খলা পরিস্থিতির কারণে জেলা প্রশাসন মাঝে মাঝে সাজেক ভ্রমণ নিরুৎসাহিত বা বন্ধ রাখে। ছুটির দিনে রিসোর্ট আগেই বুক করুন।" }

stay: রুইলুই পাড়ায় অনেক রিসোর্ট ও কটেজ আছে। সাধারণ রিসোর্টে রুম প্রতি রাত ৳১,৫০০ – ১,৮০০, ভালো রিসোর্টে ৳৩,০০০ – ৪,৫০০; স্থানীয় বাড়িতে হোমস্টে ৳১৫০ – ৩০০। ছুটির দিনে আগে থেকে বুকিং দিন।
