tips:
  - { title: "সাঁতার না জানলে গভীর পানিতে নামবেন না।", text: "পানির নিচে পাথর আর বর্ষায় প্রবল স্রোত থাকে। লাইফ জ্যাকেট পরুন।" }
  - { title: "সীমানা পার হবেন না।", text: "এখানে সীমানা সবসময় চিহ্নিত নয়। বিজিবির নির্দেশনা মেনে চলুন।" }
  - { title: "সন্ধ্যা ৬টার আগে ফিরে আসুন।", text: "এর পর সেখানে পর্যটকদের থাকা নিষেধ, বিজিবি তা নিয়ন্ত্রণ করে।" }
  - { title: "নৌকায় ওঠার আগে ভাড়া ঠিক করুন।", text: "রিজার্ভ নৌকায় আসা-যাওয়া আর অপেক্ষার সময় আগেই কথা বলে নিন।" }
  - { title: "পাথর পিচ্ছিল থাকে।", text: "গ্রিপওয়ালা স্যান্ডেল বা জুতা নিন, দলবেঁধে ঘুরুন।" }

stay: বিছনাকান্দিতে থাকার ব্যবস্থা নেই বললেই চলে, সবাই সিলেট শহরে থেকে দিনে দিনে ঘুরে আসেন। মূল পয়েন্টে ভাসমান খাবারের দোকান আর হাদারপার বাজারে খাবারের হোটেল আছে।
