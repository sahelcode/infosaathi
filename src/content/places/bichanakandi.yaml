intro: সিলেটের গোয়াইনঘাটের রুস্তমপুর ইউনিয়নে ভারত সীমান্ত ঘেঁষে বিছনাকান্দি। মেঘালয়ের খাসিয়া পাহাড়ের কয়েকটি ভাঁজ এখানে এসে মিলেছে, পাহাড় থেকে নেমে আসা পানির ধারায় বিছানার মতো ছড়িয়ে আছে অসংখ্য পাথর। হাদারপার থেকে নৌকায় যেতে হয়।

glance:
  from: সিলেট শহর থেকে
  distance: প্রায় ৩০ কিমি
  time: ২.৫ – ৩ ঘণ্টা (নৌকাসহ)
  fee: নেই
  best: জুন – সেপ্টেম্বর

spots:
  - { title: "পাথরের বিছানা ও স্বচ্ছ পানি", text: "পাহাড়ি ধারায় নেমে আসা পাথর বিছানার মতো ছড়ানো, তার ওপর দিয়ে বয়ে যায় ঠান্ডা স্বচ্ছ পানি। নামটাও এসেছে এখান থেকে।", meta: "মূল আকর্ষণ" }
  - { title: "মেঘালয়ের পাহাড় ও ঝর্ণা", text: "সীমান্তের ওপারে সবুজ খাসিয়া পাহাড় আর বর্ষায় পাহাড় বেয়ে নামা ঝর্ণা। মেঘ নেমে আসে পাহাড়ের গায়ে।", meta: "মূল পয়েন্ট থেকে দেখা যায়" }
  - { title: "পিয়াইন নদীতে নৌকাভ্রমণ", text: "হাদারপার ঘাট থেকে ইঞ্জিন নৌকায় প্রায় ৪০ মিনিট। দুপাশে পাহাড় আর গ্রাম দেখতে দেখতে যাওয়া যায়।", meta: "হাদারপার থেকে" }
  - { title: "পান্তুমাই ঝর্ণা", text: "একই নৌকা রিজার্ভ করে বিছনাকান্দির সঙ্গে পান্তুমাই ঝর্ণাও ঘুরে আসা যায়। ঝর্ণাটি ভারতের ভেতরে, দেখা যায় সীমান্ত থেকে।", meta: "নৌকায়, একসঙ্গে ঘোরা যায়" }

