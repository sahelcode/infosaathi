seasons:
  - { title: "বর্ষা (জুন – সেপ্টেম্বর)", text: "পাহাড় থেকে পানি নামে সবচেয়ে বেশি, ঝর্ণা আর সবুজে বিছনাকান্দির আসল রূপ দেখা যায়। তবে স্রোতও এ সময় প্রবল।" }
  - { title: "শীত ও শুকনো মৌসুম (ডিসেম্বর – এপ্রিল)", text: "পানি অনেক কমে যায়, পাথর তোলার কাজ ও পাথরবাহী যানের চলাচল বাড়ে। এ সময় সৌন্দর্য কম।" }

