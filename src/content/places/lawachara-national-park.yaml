      - { mode: car, name: "সিএনজি সারাদিন রিজার্ভ", text: "লাউয়াছড়া, মাধবপুর লেক ও চা বাগান একসাথে, ৪ জন বসা যায়", fare: "৳১,০০০ – ১,৫০০" }
  - from: ঢাকা থেকে শ্রীমঙ্গল
    rows:
