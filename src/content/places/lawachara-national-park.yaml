intro: শ্রীমঙ্গল থেকে ভানুগাছ-কমলগঞ্জ সড়কে প্রায় ৭ – ৮ কিমি দূরে লাউয়াছড়া জাতীয় উদ্যান। প্রায় ১,২৫০ হেক্টরের এই ঘন বর্ষাবন ১৯৯৬ সালে জাতীয় উদ্যান ঘোষণা করা হয়। দেশের সবচেয়ে বড় উল্লুকের দল এখানেই থাকে, আর বনের মাঝ দিয়ে চলে গেছে রেললাইন।

glance:
  from: শ্রীমঙ্গল শহর থেকে
  distance: প্রায় ৭ – ৮ কিমি
  time: প্রায় ২০ – ৩০ মিনিট
  fee: "৳১১৫ (প্রাপ্তবয়স্ক)"
  best: নভেম্বর – ফেব্রুয়ারি

spots:
  - { title: "ট্রেকিং ট্রেইল", text: "বনের ভেতরে তিনটি হাঁটার পথ আছে: আধা ঘণ্টা, এক ঘণ্টা ও তিন ঘণ্টার। লম্বা ট্রেইলে গাইড নেওয়া ভালো।", meta: "৩০ মিনিট / ১ ঘণ্টা / ৩ ঘণ্টা" }
  - { title: "উল্লুক ও বানর", text: "বিলুপ্তপ্রায় উল্লুক, চশমাপরা হনুমান ও নানা জাতের বানর এই বনের মূল আকর্ষণ। চুপচাপ থাকলে দেখার সম্ভাবনা বেশি।", meta: "বন্যপ্রাণী" }
  - { title: "বনের ভেতরের রেললাইন", text: "ঘন বনের মাঝ দিয়ে ঢাকা-সিলেট রেলপথ। ছবি তোলার জনপ্রিয় জায়গা, তবে ট্রেন চলাচল করে।", meta: "সাবধানে" }
  - { title: "খাসিয়া পুঞ্জি", text: "বনের ভেতরে খাসিয়াদের গ্রাম। ঘর বা মানুষের ছবি তোলার আগে অনুমতি নিন।", meta: "বনের ভেতরে" }
  - { title: "পাখি ও প্রজাপতি", text: "এখানে ২৪০টির বেশি প্রজাতির পাখি ও রঙিন প্রজাপতি দেখা যায়। ভোরবেলা পাখি দেখার সবচেয়ে ভালো সময়।", meta: "সকালে যান" }

routes:
