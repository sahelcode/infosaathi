tips:
  - { title: "রেললাইনে সাবধান থাকুন।", text: "বনের ভেতর দিয়ে নিয়মিত ট্রেন চলে। লাইনের ওপর দাঁড়িয়ে ছবি তুলবেন না।" }
  - { title: "জোঁক ও সাপ থেকে সাবধান।", text: "শীতকাল ছাড়া অন্য সময়ে জোঁক ও সাপ বেশি। বন্ধ জুতা বা গ্রিপওয়ালা স্যান্ডেল পরুন।" }
  - { title: "শব্দ করবেন না, ময়লা ফেলবেন না।", text: "উচ্চ শব্দে বন্যপ্রাণী দূরে সরে যায়। প্লাস্টিক ও বোতল সাথে নিয়ে ফিরুন।" }
  - { title: "লম্বা ট্রেইলে গাইড নিন।", text: "তিন ঘণ্টার ট্রেইলে পথ হারানোর ভয় আছে। গেটেই গাইড পাওয়া যায়।" }
  - { title: "প্রবেশ ফি গেটে মিলিয়ে নিন।", text: "বন বিভাগ ২০২৪ সালে ফি বাড়িয়ে প্রাপ্তবয়স্কদের জন্য ৳১১৫ (ভ্যাটসহ) ও বিদেশিদের জন্য ৳১,১৫০ করেছে। কিছু প্রতিবেদনে এখনো ৳৫০ লেখা থাকে, তাই গেটে বর্তমান হার দেখে নিন।" }

stay: লাউয়াছড়ার ভেতরে থাকার ব্যবস্থা নেই। বেশিরভাগ মানুষ শ্রীমঙ্গল শহরে বিভিন্ন দামের হোটেল ও রিসোর্টে থেকে দিনে দিনে ঘুরে আসেন।
