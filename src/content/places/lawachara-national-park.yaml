      - { mode: bus, name: "বাস", text: "সায়েদাবাদ বা ফকিরাপুল থেকে, প্রায় ৪ – ৫ ঘণ্টা, এসি ও নন-এসি", fare: "৳৫৭০ – ৭০০" }

months: [3, 3, 2, 1, 1, 2, 2, 2, 2, 2, 3, 3]   # জানুয়ারি থেকে ডিসেম্বর: ৩ সেরা, ২ ভালো, ১ মোটামুটি
seasons:
  - { title: "শীত (নভেম্বর – ফেব্রুয়ারি)", text: "ট্রেকিংয়ের জন্য সবচেয়ে আরামদায়ক। জোঁক ও সাপের ভয় কম থাকে।" }
  - { title: "বর্ষা (জুন – সেপ্টেম্বর)", text: "বন সবচেয়ে সবুজ ও ঘন। তবে পথ কাদা আর পিচ্ছিল থাকে, জোঁক বেশি।" }

