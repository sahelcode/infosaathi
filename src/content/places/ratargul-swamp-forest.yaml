#   - { src: ./images/ratargul-swamp-forest-1.jpg, caption: পানিতে ডোবা করচ গাছের সারি, sub: বর্ষার রাতারগুল, label: জলাবন }
intro: সিলেটের গোয়াইনঘাটের ফতেপুর ইউনিয়নে গোয়াইন নদীর পাশে রাতারগুল জলাবন। বছরে চার থেকে সাত মাস গাছগুলো পানিতে ডুবে থাকে, তখন নৌকায় করে বনের ভেতর ঘোরা যায়। একে "বাংলার আমাজন" বলা হয়।

glance:
  from: সিলেট শহর থেকে
  distance: প্রায় ২৬ কিমি
  time: ১ – ১.৫ ঘণ্টা
  fee: "৳৫০ (ভ্যাটসহ ৳৫৭.৫০)"
  best: জুলাই – সেপ্টেম্বর

spots:
  - { title: "নৌকায় জলাবনের ভেতর", text: "ছোট ডিঙি নৌকায় পানিতে ডোবা হিজল, করচ আর মুর্তা গাছের ফাঁক দিয়ে ঘোরা। রাতারগুলের মূল অভিজ্ঞতা এটাই।", meta: "মূল আকর্ষণ" }
  - { title: "ওয়াচ টাওয়ার", text: "বনের ভেতরে প্রায় ৫০ ফুট উঁচু টাওয়ার। ওপর থেকে পুরো বনের সবুজ চাঁদোয়া দেখা যায়।", meta: "নৌকায় যেতে হয়" }
  - { title: "পাখি ও বন্যপ্রাণী", text: "বক, মাছরাঙা, চিল, বানর আর গুইসাপ চোখে পড়ে। শীতে অতিথি পাখিও আসে।", meta: "চুপচাপ থাকলে বেশি দেখা যায়" }
  - { title: "চেঙ্গির খাল ও গোয়াইন নদী", text: "চেঙ্গির খাল দিয়ে বনটি গোয়াইন নদীর সাথে যুক্ত। ঘাটে যাওয়া-আসার পথে নদী আর খালের দৃশ্য।", meta: "ঘাটের পথে" }

routes:
  - from: সিলেট শহর থেকে
    rows:
      - { mode: car, name: "লোকাল সিএনজি", text: "আম্বরখানা থেকে, জনপ্রতি ভাড়া, প্রায় ১ – ১.৫ ঘণ্টা", fare: "৳১০০" }
      - { mode: car, name: "সিএনজি রিজার্ভ", text: "সারাদিনের জন্য, আসা-যাওয়া", fare: "৳১,২০০ – ১,৫০০" }
      - { mode: boat, name: "ঘাট থেকে নৌকা", text: "চৌরঙ্গী, চৌমুহনী বা মোটরঘাট থেকে, এক নৌকায় ৮ – ১০ জন", fare: "৳৭৫০ (প্রতি নৌকা)" }
  - from: ঢাকা থেকে সিলেট
    rows:
      - { mode: bus, name: "বাস", text: "৬ – ৮ ঘণ্টা, নন-এসি ও এসি", fare: "৳৫৮০ – ১,৫০০" }
      - { mode: train, name: "ট্রেন", text: "৬ – ৮ ঘণ্টা, শ্রেণিভেদে ভাড়া", fare: "৳৪১০ – ১,৪৬৫" }

months: [1, 1, 1, 1, 2, 3, 3, 3, 3, 2, 1, 1]   # জানুয়ারি থেকে ডিসেম্বর: ৩ সেরা, ২ ভালো, ১ মোটামুটি
seasons:
  - { title: "বর্ষা (জুন – সেপ্টেম্বর)", text: "বন পানিতে ডুবে থাকে, ঘাট থেকেই নৌকায় বনের ভেতর ঢোকা যায়। রাতারগুলের সবচেয়ে সুন্দর সময়।" }
  - { title: "শুকনো মৌসুম (নভেম্বর – এপ্রিল)", text: "পানি কমে যায়। কিছু পথ কাদা মাড়িয়ে হেঁটে তারপর নৌকায় উঠতে হয়। শীতে অতিথি পাখি দেখা যায়।" }

cost_from: সিলেট থেকে, জনপ্রতি
cost:
  - { item: "লোকাল সিএনজি (আসা-যাওয়া)", amount: "৳২০০" }
  - { item: "প্রবেশ ফি (ভ্যাটসহ)", amount: "৳৫৭.৫০" }
  - { item: "নৌকা (৳৭৫০, ৮ – ১০ জনে ভাগ করলে)", amount: "৳৭৫ – ১০০" }
cost_total: "৳৩৫০ – ৪০০ (খাবার ছাড়া)"

tips:
  - { title: "সাঁতার না জানলে পানিতে নামবেন না।", text: "বর্ষায় পানি গভীর, স্রোতও থাকে। নৌকায় বসে থাকুন, লাইফ জ্যাকেট পেলে পরুন।" }
  - { title: "সাপ ও জোঁক থেকে সাবধান।", text: "বর্ষায় গাছের ডালে সাপ থাকতে পারে। ডালে হাত দেবেন না, পা ঢাকা পোশাক পরুন।" }
  - { title: "নৌকায় ওঠার আগে ভাড়া ঠিক করুন।", text: "কতক্ষণ ঘোরাবে আর ওয়াচ টাওয়ারে যাবে কি না, মাঝির সাথে আগেই কথা বলে নিন।" }
  - { title: "জোরে শব্দ করবেন না, প্লাস্টিক ফেলবেন না।", text: "এটি সংরক্ষিত বন ও বন্যপ্রাণীর আবাস।" }
  - { title: "খাবার ও পানি সঙ্গে নিন।", text: "বনের ভেতরে কিছু পাওয়া যায় না, ঘাটে টয়লেটের ব্যবস্থাও সীমিত।" }

stay: রাতারগুলের আশেপাশে কয়েকটি রিসোর্ট আছে, তবে বেশিরভাগ মানুষ সিলেট শহরে থেকে দিনে দিনে ঘুরে আসেন।
nearby: [jaflong, bichanakandi]

faq:
  - { q: "শীতে গেলে কি নৌকায় ঘোরা যায়?", a: "শুকনো মৌসুমে পানি কম থাকে। তখন কিছু পথ হেঁটে বনের ভেতরে গিয়ে নৌকায় উঠতে হয়। পুরো সৌন্দর্য দেখতে বর্ষায় যাওয়াই ভালো।" }
  - { q: "রাতারগুলে কয়টি ঘাট আছে?", a: "প্রধান ঘাট তিনটি: চৌরঙ্গী, চৌমুহনী (রাতারগুল গ্রাম) ও মোটরঘাট। প্রতিটি থেকেই নৌকা ছাড়ে।" }

